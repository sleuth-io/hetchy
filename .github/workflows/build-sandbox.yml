name: Ensure Daytona sandbox snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-sandbox.yml"
      - "sandbox/**"
      - "scripts/push-snapshot.sh"
      - "scripts/sandbox-version.sh"
  workflow_dispatch:

jobs:
  ensure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compute sandbox version
        run: echo "SANDBOX_VERSION=$(./scripts/sandbox-version.sh)" >> "$GITHUB_ENV"

      - name: Install Daytona CLI
        run: |
          curl -fsSL https://download.daytona.io/daytona/install.sh | bash
          echo "$HOME/.daytona/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Ensure Daytona snapshot
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          DAYTONA_CLI_LOGIN: "1"
          DAYTONA_ORGANIZATION: ${{ secrets.DAYTONA_ORGANIZATION }}
          SNAPSHOT_NAME: universal-coding
          SNAPSHOT_TAG: ${{ env.SANDBOX_VERSION }}
        run: ./scripts/push-snapshot.sh

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway sandbox build arg
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: |
          : "${RAILWAY_TOKEN:?missing RAILWAY_TOKEN secret}"
          : "${RAILWAY_PROJECT_ID:?missing RAILWAY_PROJECT_ID secret}"
          : "${RAILWAY_SERVICE:?missing RAILWAY_SERVICE secret}"
          : "${RAILWAY_ENVIRONMENT:?missing RAILWAY_ENVIRONMENT secret}"
          railway variable set "SANDBOX_VERSION=${SANDBOX_VERSION}" \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --skip-deploys
