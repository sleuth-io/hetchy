name: Ensure Daytona sandbox snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-sandbox.yml"
      - "sandbox/**"
      - "scripts/push-snapshot.sh"
      - "scripts/sandbox-version.sh"
  workflow_dispatch:

jobs:
  ensure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compute sandbox version
        run: echo "SANDBOX_VERSION=$(./scripts/sandbox-version.sh)" >> "$GITHUB_ENV"

      - name: Install Daytona CLI
        run: |
          install -d "$HOME/.local/bin"
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            -o "$HOME/.local/bin/daytona" \
            https://github.com/daytonaio/daytona/releases/latest/download/daytona-linux-amd64
          chmod +x "$HOME/.local/bin/daytona"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/daytona" version

      - name: Ensure Daytona snapshot
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          DAYTONA_CLI_LOGIN: "1"
          DAYTONA_ORGANIZATION: ${{ secrets.DAYTONA_ORGANIZATION }}
          SNAPSHOT_NAME: universal-coding
          SNAPSHOT_TAG: ${{ env.SANDBOX_VERSION }}
        run: ./scripts/push-snapshot.sh
