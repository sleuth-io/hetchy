name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Okteto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Okteto
        uses: okteto/pipeline@latest
        with:
          token: ${{ secrets.OKTETO_TOKEN }}
          url: "https://demo.okteto.dev"
