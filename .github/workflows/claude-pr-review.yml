name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_REVIEW_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && secrets.SKILLS_SITE_API_KEY != '' }}
      IS_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Skip unavailable review
        if: env.IS_SAME_REPO_PR != 'true' || env.HAS_REVIEW_SECRETS != 'true'
        run: echo "Skipping Claude review for fork PRs or missing review secrets."

      - name: Checkout code
        if: env.IS_SAME_REPO_PR == 'true' && env.HAS_REVIEW_SECRETS == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install sx
        if: env.IS_SAME_REPO_PR == 'true' && env.HAS_REVIEW_SECRETS == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/sleuth-io/sx/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup sx config
        if: env.IS_SAME_REPO_PR == 'true' && env.HAS_REVIEW_SECRETS == 'true'
        run: |
          mkdir -p "$HOME/.config/sx"
          mkdir -p "$HOME/.claude"
          printf '%s\n' '{' '  "type": "sleuth",' '  "repositoryUrl": "https://app.skills.new",' '  "authToken": "${{ secrets.SKILLS_SITE_API_KEY }}"' '}' > "$HOME/.config/sx/config.json"

      - name: Install skills
        if: env.IS_SAME_REPO_PR == 'true' && env.HAS_REVIEW_SECRETS == 'true'
        run: sx install

      - name: Discover installed Claude skills
        if: env.IS_SAME_REPO_PR == 'true' && env.HAS_REVIEW_SECRETS == 'true'
        id: discover-skills
        run: |
          # sx install puts assets under $HOME/.claude. Mirror them into the
          # repo root so claude-code-action (which runs cwd-relative) finds them.
          if [ -d "$HOME/.claude" ]; then
            mkdir -p .claude
            cp -R "$HOME/.claude/." .claude/
          fi

          if [ -d ".claude/skills" ]; then
            SKILLS=$(find .claude/skills -name "SKILL.md" -type f | \
              sed 's|.claude/skills/||' | \
              sed 's|/SKILL.md||' | \
              tr '\n' ',' | \
              sed 's/,$//')

            if [ -z "$SKILLS" ]; then
              echo "skills=none" >> "$GITHUB_OUTPUT"
              echo "No Claude skills found"
            else
              echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
              echo "Found skills: $SKILLS"
            fi
          else
            echo "skills=none" >> "$GITHUB_OUTPUT"
            echo ".claude/skills directory not found"
          fi

      - name: Claude Code Review
        if: env.IS_SAME_REPO_PR == 'true' && env.HAS_REVIEW_SECRETS == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 50"
          track_progress: true
          # Hetchy itself is dogfooded against this repo — PRs opened by
          # hetchy-dev[bot] / hetchy[bot] should still get reviewed.
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request using the project's installed Claude skills and any CLAUDE.md standards.

            **Installed Skills**: ${{ steps.discover-skills.outputs.skills }}

            **Process**:
            1. Read SKILL.md files in .claude/skills/[skill-name]/SKILL.md
            2. Review PR changes and match to relevant skills
            3. Validate against skill guidelines and any CLAUDE.md standards
            4. Check for security, performance, and architecture issues

            **Output Format**:

            Start with a single sentence summarizing the overall review.

            Then output ONLY the collapsible sections below (one per issue):

            <details>
            <summary><b>[PRIORITY]</b> Single sentence summary</summary>

            **Location**: file:line

            **Issue**: Detailed description

            **Suggestion**: Concrete fix

            </details>

            If no issues found, output: "Review complete. No issues found."

            **Rules**:
            - First line: one sentence overall summary
            - Then ONLY the <details> blocks, nothing else
            - Do NOT include headings, categories, or additional summaries
            - Do NOT add explanatory text between issues
            - Each issue is one <details> block with priority in the summary
            - Ensure blank lines before and after markdown content inside details tags
        timeout-minutes: 15
