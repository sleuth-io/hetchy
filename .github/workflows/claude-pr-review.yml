name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  # Pull requests from forks run without repository secrets, and public forks
  # of Hetchy have no Claude subscription of their own. Decide up front whether
  # the review can run at all so those PRs skip cleanly instead of failing.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      review: ${{ steps.check.outputs.review }}
      skills: ${{ steps.check.outputs.skills }}
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_SKILLS_KEY: ${{ secrets.SKILLS_SITE_API_KEY != '' }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - id: check
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "Skipping Claude review: pull request is from a fork, so repository secrets are unavailable."
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "skills=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_CLAUDE_TOKEN" != "true" ]; then
            echo "Skipping Claude review: CLAUDE_CODE_OAUTH_TOKEN is not configured."
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "skills=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "review=true" >> "$GITHUB_OUTPUT"
          # Skills are a bonus. Without a vault key the review still runs
          # against CLAUDE.md standards alone.
          if [ "$HAS_SKILLS_KEY" = "true" ]; then
            echo "skills=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skills vault key is not configured; reviewing without installed skills."
            echo "skills=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: guard
    if: needs.guard.outputs.review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install sx
        if: needs.guard.outputs.skills == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/sleuth-io/sx/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup sx config
        if: needs.guard.outputs.skills == 'true'
        run: |
          mkdir -p "$HOME/.config/sx"
          mkdir -p "$HOME/.claude"
          printf '%s\n' '{' '  "type": "sleuth",' '  "repositoryUrl": "https://app.skills.new",' '  "authToken": "${{ secrets.SKILLS_SITE_API_KEY }}"' '}' > "$HOME/.config/sx/config.json"

      - name: Install skills
        if: needs.guard.outputs.skills == 'true'
        run: sx install

      - name: Discover installed Claude skills
        id: discover-skills
        run: |
          # sx install puts assets under $HOME/.claude. Mirror them into the
          # repo root so claude-code-action (which runs cwd-relative) finds them.
          if [ -d "$HOME/.claude" ]; then
            mkdir -p .claude
            cp -R "$HOME/.claude/." .claude/
          fi

          if [ -d ".claude/skills" ]; then
            SKILLS=$(find .claude/skills -name "SKILL.md" -type f | \
              sed 's|.claude/skills/||' | \
              sed 's|/SKILL.md||' | \
              tr '\n' ',' | \
              sed 's/,$//')

            if [ -z "$SKILLS" ]; then
              echo "skills=none" >> "$GITHUB_OUTPUT"
              echo "No Claude skills found"
            else
              echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
              echo "Found skills: $SKILLS"
            fi
          else
            echo "skills=none" >> "$GITHUB_OUTPUT"
            echo ".claude/skills directory not found"
          fi

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 50"
          track_progress: true
          # Hetchy itself is dogfooded against this repo — PRs opened by
          # hetchy-dev[bot] / hetchy[bot] should still get reviewed.
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request using the project's installed Claude skills and any CLAUDE.md standards.

            **Installed Skills**: ${{ steps.discover-skills.outputs.skills }}

            **Process**:
            1. Read SKILL.md files in .claude/skills/[skill-name]/SKILL.md
            2. Review PR changes and match to relevant skills
            3. Validate against skill guidelines and any CLAUDE.md standards
            4. Check for security, performance, and architecture issues

            **Output Format**:

            Start with a single sentence summarizing the overall review.

            Then output ONLY the collapsible sections below (one per issue):

            <details>
            <summary><b>[PRIORITY]</b> Single sentence summary</summary>

            **Location**: file:line

            **Issue**: Detailed description

            **Suggestion**: Concrete fix

            </details>

            If no issues found, output: "Review complete. No issues found."

            **Rules**:
            - First line: one sentence overall summary
            - Then ONLY the <details> blocks, nothing else
            - Do NOT include headings, categories, or additional summaries
            - Do NOT add explanatory text between issues
            - Each issue is one <details> block with priority in the summary
            - Ensure blank lines before and after markdown content inside details tags
        timeout-minutes: 15
