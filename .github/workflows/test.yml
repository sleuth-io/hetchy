name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Release tags run these same checks before any artifact is published.
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need history + origin/main locally so the migration-ordering
          # check can diff branch-added migrations against main.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Check migration ordering
        run: ./scripts/check-migrations-order.sh

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'go fmt ./...' to fix:"
            gofmt -d .
            exit 1
          fi

      - name: Lint
        run: go tool golangci-lint run

      - name: Test
        run: |
          go mod tidy
          go vet ./...
          go test -v -race -cover ./...

      - name: Coverage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export COVERAGE_COMPARE_REF="origin/${{ github.base_ref }}"
          fi
          bash scripts/check-go-coverage.sh ./... .github/coverage/repo-total.min

      - name: Build
        run: make build
