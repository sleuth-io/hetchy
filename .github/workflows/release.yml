name: Release

# Cut a release by pushing a semver tag:
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# The tag runs the normal test suite, builds and pushes a multi-arch container
# image to GHCR, and publishes a GitHub Release. Optional curated notes live in
# docs/releases/<tag>.md.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse the exact checks that gate main so a tag can never ship something
  # that would have failed CI.
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image metadata
        id: meta
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sandbox_version=$(./scripts/sandbox-version.sh)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            # Pre-releases (v1.2.3-rc.1) must not move the :latest tag.
            case "${GITHUB_REF_NAME}" in
              *-*) ;;
              *) echo "${image}:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            SANDBOX_VERSION=${{ steps.meta.outputs.sandbox_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the changelog can diff against the previous tag.
          fetch-depth: 0

      - name: Generate notes
        env:
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            ${prerelease}
