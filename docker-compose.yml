version: '3.8'

services:
  # Local Postgres for development. Mirrors Supabase's Postgres surface (no
  # auth/storage/etc.) — enough for sqlc + golang-migrate. Port 5432 is
  # exposed on the host so `make bot` running on the host can connect to it.
  postgres:
    image: postgres:16-alpine
    container_name: hetchy-postgres
    restart: unless-stopped
    ports:
      # Default 5433 so we don't collide with other dev Postgres on 5432.
      # Override via POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hetchy}
    volumes:
      - hetchy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hetchy}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Main hetchy bot service
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: migration
    restart: never
    command: "/app/hetchy --migrate"
    depends_on:
      postgres:
        condition: service_healthy
  hetchy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: hetchy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      # Slack configuration
      SLACK_BOT_OAUTH_TOKEN: ${SLACK_BOT_OAUTH_TOKEN}
      SLACK_SOCKET_TOKEN: ${SLACK_SOCKET_TOKEN}

      # Anthropic API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # GitHub configuration
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}

      # Daytona configuration
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-claude-playwright:1}

      # WorkOS configuration
      WORKOS_API_KEY: ${WORKOS_API_KEY}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      # sx (optional)
      SX_KEY: ${SX_KEY:-}

      # Database — defaults to the bundled postgres service. Override
      # DATABASE_URL to point at Supabase or another instance.
      # Nested ${...} in default values is unsupported by Docker Compose interpolation,
      # so defaults are hardcoded to match the postgres service's own defaults above.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/hetchy?sslmode=disable}

      # Web UI configuration
      WEB_PORT: ${WEB_PORT:-8080}
      DISABLE_SLACK: ${DISABLE_SLACK:-}
    healthcheck:
      http:
        path: "/"
        port: 8080
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hetchy-postgres-data:
