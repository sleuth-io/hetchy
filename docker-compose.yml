version: '3.8'

services:
  # Software Factory Slack Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    image: software-factory:latest
    container_name: software-factory-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override specific env vars if needed
      - WEB_PORT=${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # Mount .env file for local development
      - ./.env:/app/.env:ro
    networks:
      - software-factory
    depends_on:
      - daytona
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Local Daytona OSS Stack
  daytona:
    image: daytonaio/daytona:latest
    container_name: daytona-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "30000-30100:30000-30100"
    volumes:
      - daytona-data:/daytona
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DAYTONA_SERVER_URL=http://localhost:3000
    networks:
      - software-factory
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  software-factory:
    driver: bridge

volumes:
  daytona-data:
    driver: local
