services:
  # Local Postgres for development. Mirrors Supabase's Postgres surface (no
  # auth/storage/etc.) — enough for sqlc + golang-migrate. Port 5432 is
  # exposed on the host so `make bot` running on the host can connect to it.
  postgres:
    image: postgres:16-alpine
    container_name: hetchy-postgres
    restart: unless-stopped
    ports:
      # Default 5433 so we don't collide with other dev Postgres on 5432.
      # Override via POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hetchy}
    volumes:
      - hetchy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hetchy}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot migration runner. Bumps schema before the hetchy service
  # starts (see hetchy.depends_on.migration.condition: service_completed_successfully).
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: migration
    restart: never
    command: "--migrate"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --migrate mode only reads DATABASE_URL; nothing else is needed.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/hetchy?sslmode=disable}

  # Main hetchy bot service.
  hetchy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: hetchy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      # Block hetchy until the bundled daytona api answers its
      # healthcheck — without this the bot can come up first and start
      # logging connection-refused errors against http://api:3000/api
      # before daytona finishes booting (especially under okteto where
      # everything spins up in parallel).
      api:
        condition: service_healthy
    environment:
      # Runtime mode — gates dev-only UI affordances (manual Slack
      # token paste, etc.). Defaults to prod so a missing var is the
      # safe choice; `make bot` overrides to dev.
      HETCHY_ENV: ${HETCHY_ENV:-prod}

      # Slack — process-level config for the deployed Hetchy app
      # (one app per env: dev/staging/prod). Per-org bot tokens land
      # in the database after OAuth install, not here.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}
      # Reference-only / not consumed by the Go code today.
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_VERIFICATION_TOKEN: ${SLACK_VERIFICATION_TOKEN:-}

      # GitHub App — process-level config for the deployed Hetchy
      # GitHub App (one App per env: dev/staging/prod). Per-org
      # installation tokens are minted on demand; nothing org-specific
      # lives here.
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET}

      # Daytona configuration. When the bundled stack below is in use,
      # set DAYTONA_API_URL=http://api:3000/api in this env (e.g. from
      # doppler). Locally where hetchy runs on the host, the same env
      # uses http://localhost:3000/api.
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-universal-coding:1}

      # WorkOS configuration
      WORKOS_API_KEY: ${WORKOS_API_KEY}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI}
      LOGOUT_RETURN_TO: ${LOGOUT_RETURN_TO:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      # sx (optional)
      SX_KEY: ${SX_KEY:-}

      # Database — defaults to the bundled postgres service. Override
      # DATABASE_URL to point at Supabase or another instance.
      # Nested ${...} in default values is unsupported by Docker Compose interpolation,
      # so defaults are hardcoded to match the postgres service's own defaults above.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/hetchy?sslmode=disable}

      # Web UI configuration
      WEB_PORT: ${WEB_PORT:-8080}
      # Set to 1 only when serving over plain HTTP (local dev). In
      # production, leave empty so session cookies require TLS.
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
    healthcheck:
      # Use the standard test form so plain `docker compose` validates the
      # file (the okteto-specific `http:` shortcut is rejected upstream).
      # Okteto accepts the standard form too — it converts the exec probe
      # into a Kubernetes livenessProbe just like the http: form did.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Daytona OSS stack — bundled so the same compose file works locally and in
  # staging (replaces the Daytona Cloud dependency we used to point at).
  #
  # Service names are intentionally NOT prefixed with "daytona-" so we don't
  # have to rewrite the inter-service URLs baked into the upstream config
  # (api → db, redis, dex, runner, registry, minio, otel-collector). The hetchy
  # services (postgres, migration, hetchy) sit alongside on the default network.
  #
  # Adapted from daytonaio/daytona's docker/docker-compose.yaml. Skipped the
  # dev-only frills (pgadmin, jaeger, registry-ui, maildev) and the explicit
  # `daytona-network` (okteto warns on top-level `networks:`; the compose
  # default network reaches everything by service name anyway).
  #
  # NOTE on okteto staging: `privileged: true` (runner only) is recognized but
  # unsupported by okteto and may need a cluster-side override to actually run.
  # The api in the upstream daytona compose is also `privileged`, but it's a
  # NestJS process that doesn't touch the docker socket — dropped here so we
  # don't ask okteto to honor a privilege we don't actually need.
  # Locally with `docker compose` this Just Works.
  # ---------------------------------------------------------------------------

  api:
    # Pinned by digest rather than `:latest` so the staging stack is
    # reproducible. Daytona OSS doesn't publish stable version tags;
    # to refresh: `docker pull daytonaio/daytona-api && docker inspect
    # daytonaio/daytona-api --format '{{index .RepoDigests 0}}'` and
    # paste the new sha here.
    image: daytonaio/daytona-api@sha256:933acf3d073d7e6c146e674d183a47c202197d3c094a41d4588600cfa05ad187
    restart: always
    healthcheck:
      # Mirror the HEALTHCHECK baked into the image so the compose
      # file is self-documenting — services that gate on
      # `api: service_healthy` (hetchy, proxy implicitly) keep working
      # even if a future image push drops or changes the image-level
      # directive. start_period is wide because the api runs DB
      # migrations on first boot before /api/config begins serving;
      # under load (cold okteto deploy) the migration phase has
      # historically taken longer than 60s, so 120s is the safer floor.
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    ports:
      # Exposed on the host so `make bot` (hetchy on host) can hit
      # http://localhost:3000/api.
      - "${DAYTONA_API_HOST_PORT:-3000}:3000"
    environment:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - DEFAULT_SNAPSHOT=daytonaio/sandbox:0.5.0-slim
      - ENCRYPTION_KEY=supersecretkey
      - ENCRYPTION_SALT=supersecretsalt
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=user
      - DB_PASSWORD=pass
      - DB_DATABASE=daytona
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OIDC_CLIENT_ID=daytona
      - OIDC_ISSUER_BASE_URL=http://dex:5556/dex
      # User-facing URLs that the api bakes into responses (OIDC redirects,
      # dashboard links, sandbox preview URLs, ssh helper text). Locally
      # the localhost defaults work; in okteto/staging override each via
      # doppler so generated links resolve against the public hostname.
      - PUBLIC_OIDC_DOMAIN=${DAYTONA_PUBLIC_OIDC_DOMAIN:-http://localhost:5556/dex}
      - OIDC_AUDIENCE=daytona
      - OIDC_MANAGEMENT_API_ENABLED=
      - OIDC_MANAGEMENT_API_CLIENT_ID=
      - OIDC_MANAGEMENT_API_CLIENT_SECRET=
      - OIDC_MANAGEMENT_API_AUDIENCE=
      - DASHBOARD_URL=${DAYTONA_DASHBOARD_URL:-http://localhost:3000/dashboard}
      - DASHBOARD_BASE_API_URL=${DAYTONA_DASHBOARD_BASE_API_URL:-http://localhost:3000}
      - POSTHOG_API_KEY=phc_bYtEsdMDrNLydXPD4tufkBrHKgfO2zbycM30LOowYNv
      - POSTHOG_HOST=https://d18ag4dodbta3l.cloudfront.net
      - POSTHOG_ENVIRONMENT=local
      - TRANSIENT_REGISTRY_URL=http://registry:6000
      - TRANSIENT_REGISTRY_ADMIN=admin
      - TRANSIENT_REGISTRY_PASSWORD=password
      - TRANSIENT_REGISTRY_PROJECT_ID=daytona
      - INTERNAL_REGISTRY_URL=http://registry:6000
      - INTERNAL_REGISTRY_ADMIN=admin
      - INTERNAL_REGISTRY_PASSWORD=password
      - INTERNAL_REGISTRY_PROJECT_ID=daytona
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_SECURE=
      - SMTP_EMAIL_FROM=Daytona Team <no-reply@daytona.io>
      - S3_ENDPOINT=http://minio:9000
      - S3_STS_ENDPOINT=http://minio:9000/minio/v1/assume-role
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_DEFAULT_BUCKET=daytona
      - S3_ACCOUNT_ID=/
      - S3_ROLE_NAME=/
      - ENVIRONMENT=docker-compose
      - MAX_AUTO_ARCHIVE_INTERVAL=43200
      - MAINTENANCE_MODE=false
      - PROXY_DOMAIN=${DAYTONA_PROXY_DOMAIN:-proxy.localhost:4000}
      - PROXY_PROTOCOL=${DAYTONA_PROXY_PROTOCOL:-http}
      - PROXY_API_KEY=super_secret_key
      # PROXY_TEMPLATE_URL contains mustache placeholders ({{PORT}}, {{sandboxId}})
      # that the api expands at request time — compose interpolation only
      # eats `${...}`, so the inner braces pass through untouched.
      - PROXY_TEMPLATE_URL=${DAYTONA_PROXY_TEMPLATE_URL:-http://{{PORT}}-{{sandboxId}}.proxy.localhost:4000}
      - DEFAULT_RUNNER_DOMAIN=runner:3003
      - DEFAULT_RUNNER_API_URL=http://runner:3003
      - DEFAULT_RUNNER_PROXY_URL=http://runner:3003
      - DEFAULT_RUNNER_API_KEY=secret_api_token
      - DEFAULT_RUNNER_CPU=4
      - DEFAULT_RUNNER_MEMORY=8
      - DEFAULT_RUNNER_DISK=50
      - DEFAULT_RUNNER_NAME=default
      - DEFAULT_REGION_ID=us
      - DEFAULT_REGION_NAME=us
      - DEFAULT_REGION_ENFORCE_QUOTAS=false
      - DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA=100000
      - DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX=1000
      - DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA=1000
      - DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE=1000
      - DEFAULT_ORG_QUOTA_VOLUME_QUOTA=10000
      - SSH_GATEWAY_API_KEY=ssh_secret_api_token
      # {{TOKEN}} is a mustache placeholder the api substitutes per-sandbox.
      - SSH_GATEWAY_COMMAND=${DAYTONA_SSH_GATEWAY_COMMAND:-ssh -p 2222 {{TOKEN}}@localhost}
      - SSH_GATEWAY_PUBLIC_
      - SSH_GATEWAY_URL=${DAYTONA_SSH_GATEWAY_URL:-localhost:2222}
      - RUNNER_DECLARATIVE_BUILD_SCORE_THRESHOLD=10
      - RUNNER_AVAILABILITY_SCORE_THRESHOLD=10
      - RUNNER_START_SCORE_THRESHOLD=3
      - SKIP_USER_EMAIL_VERIFICATION=true
      - RUN_MIGRATIONS=true
      - OTEL_COLLECTOR_API_KEY=otel_collector_api_key
      - HEALTH_CHECK_API_KEY=supersecretkey
    depends_on:
      # Long form so we can gate on healthy status: api boots fast and
      # then crashes in a retry loop if it talks to a postgres that
      # hasn't accepted connections yet (or to a dex that hasn't loaded
      # its keys). `runner` has no healthcheck baked into its image —
      # leaving it on the default `service_started` is fine because
      # api/runner registration retries naturally on either side.
      db:
        condition: service_healthy
      dex:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
      runner:
        condition: service_started

  proxy:
    # Pinned by digest — see api above for the refresh recipe.
    image: daytonaio/daytona-proxy@sha256:20ff5e9041c8fb12a15c8861acb2e995a4587219e9224d15068d5878a4b0ee29
    restart: always
    ports:
      - "${DAYTONA_PROXY_HOST_PORT:-4000}:4000"
    environment:
      - DAYTONA_API_URL=http://api:3000/api
      - PROXY_PORT=4000
      - PROXY_API_KEY=super_secret_key
      - PROXY_PROTOCOL=http
      - OIDC_CLIENT_ID=daytona
      - OIDC_CLIENT_SECRET=
      - OIDC_DOMAIN=http://dex:5556/dex
      # Same override target as the api's PUBLIC_OIDC_DOMAIN so a
      # single doppler value points both services at the public dex URL.
      - OIDC_PUBLIC_DOMAIN=${DAYTONA_PUBLIC_OIDC_DOMAIN:-http://localhost:5556/dex}
      - OIDC_AUDIENCE=daytona
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TOOLBOX_ONLY_MODE=false
      - PREVIEW_WARNING_ENABLED=false
    depends_on:
      # proxy validates JWTs against dex and uses redis for session
      # state — both block its startup if not ready, so wait for them
      # to be healthy before scheduling proxy.
      dex:
        condition: service_healthy
      redis:
        condition: service_healthy

  runner:
    # Pinned by digest — see api above for the refresh recipe.
    image: daytonaio/daytona-runner@sha256:caab79fe61de3d5b58cbfae8385e90322f05f9d41151c9a7d46fe12782c573e9
    restart: always
    privileged: true
    environment:
      - ENVIRONMENT=development
      - API_PORT=3003
      - DAYTONA_RUNNER_TOKEN=secret_api_token
      - LOG_FILE_PATH=/home/daytona/runner/runner.log
      - RESOURCE_LIMITS_DISABLED=true
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_BUCKET=daytona
      - DAYTONA_API_URL=http://api:3000/api
      - RUNNER_DOMAIN=runner
      - SSH_GATEWAY_ENABLE=false
      - INTER_SANDBOX_NETWORK_ENABLED=false

  dex:
    image: dexidp/dex:v2.42.0
    restart: always
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/config.yaml
      - dex_db:/var/dex
    entrypoint: ['sh', '-c', 'touch /var/dex/dex.db && exec dex serve /etc/dex/config.yaml']
    ports:
      - "${DAYTONA_DEX_HOST_PORT:-5556}:5556"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_USER=user
      - POSTGRES_DB=daytona
    volumes:
      - daytona_db_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d daytona"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Pinned to the 7.x alpine stream rather than `:latest` so a future
    # major bump (e.g. 8.x licensing changes) doesn't surprise this stack.
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  registry:
    image: registry:2.8.2
    restart: always
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[http://registry-ui.example.com]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: registry:6000
    volumes:
      - daytona_registry:/var/lib/registry
    ports:
      # Exposed on the host so `make push-snapshot` can `docker push
      # localhost:6000/...`. The runner sees the same registry internally
      # at `registry:6000` (the address baked into the snapshot record).
      - "${DAYTONA_REGISTRY_HOST_PORT:-6000}:6000"
    healthcheck:
      # REGISTRY_HTTP_ADDR is set to `registry:6000`, which binds to
      # the container's network-side IP — nothing listens on
      # 127.0.0.1:6000, so the healthcheck has to use the docker
      # service hostname. /v2/ returns 200 when the registry is ready
      # to serve manifests/blobs.
      test: ["CMD", "wget", "--spider", "--quiet", "http://registry:6000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    # Pinned by digest rather than `:latest` so the stack is reproducible.
    # Minio publishes RELEASE.YYYY-MM-DDTHH-MM-SSZ tags; this digest
    # corresponds to the build pulled while developing this PR (mid-2025).
    # To update: `docker pull minio/minio:latest && docker inspect
    # minio/minio:latest --format '{{.RepoDigests}}'` and copy the new sha.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_IDENTITY_STS_EXPIRY=24h
    volumes:
      - daytona_minio_data:/data
    command: server /data --console-address ":9001"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    restart: always
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

volumes:
  hetchy-postgres-data:
  daytona_db_data:
  daytona_registry:
  daytona_minio_data:
  dex_db:
