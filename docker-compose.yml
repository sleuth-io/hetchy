version: '3.8'

services:
  # Software Factory bot service
  software-factory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: software-factory
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      # Slack configuration
      SLACK_BOT_OAUTH_TOKEN: ${SLACK_BOT_OAUTH_TOKEN}
      SLACK_SOCKET_TOKEN: ${SLACK_SOCKET_TOKEN}

      # Anthropic API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # GitHub configuration
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}

      # Daytona configuration
      DAYTONA_API_URL: ${DAYTONA_API_URL}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT}

      # Web UI configuration
      WEB_PORT: ${WEB_PORT:-8080}

      # Optional: disable Slack for web-only mode
      DISABLE_SLACK: ${DISABLE_SLACK:-}
    volumes:
      # Mount .env file if it exists (for local overrides)
      - ./.env:/app/.env:ro
    networks:
      - software-factory-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development mode: build and run locally with hot reload
  software-factory-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: software-factory-dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      SLACK_BOT_OAUTH_TOKEN: ${SLACK_BOT_OAUTH_TOKEN}
      SLACK_SOCKET_TOKEN: ${SLACK_SOCKET_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      DAYTONA_API_URL: ${DAYTONA_API_URL}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT}
      WEB_PORT: ${WEB_PORT:-8080}
      DISABLE_SLACK: ${DISABLE_SLACK:-}
    volumes:
      - ./:/build
      - go-mod-cache:/go/pkg/mod
    working_dir: /build
    command: >
      sh -c "go mod download &&
             go build -o /tmp/software-factory ./cmd/software-factory &&
             /tmp/software-factory"
    networks:
      - software-factory-net
    profiles:
      - dev

networks:
  software-factory-net:
    driver: bridge

volumes:
  go-mod-cache:
    driver: local
