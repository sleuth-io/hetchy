services:
  # Postgres for local self-hosting and development. Port 5432 is exposed on
  # the host as 5433 by default so host-side tools can connect without
  # colliding with another local Postgres.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Default 5433 so we don't collide with other dev Postgres on 5432.
      # Override via POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hetchy}
    volumes:
      - hetchy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hetchy}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot migration runner. Bumps schema before the hetchy service
  # starts (see hetchy.depends_on.migration.condition: service_completed_successfully).
  #
  # Shares the hetchy image: same binary, different command.
  migration:
    image: ${HETCHY_IMAGE:-ghcr.io/sleuth-io/hetchy}:${HETCHY_VERSION:-dev}
    pull_policy: ${HETCHY_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
        SANDBOX_VERSION: ${SANDBOX_VERSION:-}
    restart: "no"
    command: "--migrate"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --migrate mode only reads DATABASE_URL; nothing else is needed.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hetchy?sslmode=disable}

  # Main hetchy bot service.
  #
  # `docker compose up` builds from this checkout and tags the result :dev,
  # which never collides with a published tag. pull_policy defaults to build so
  # a first run does not try (and fail) to pull a :dev image that was never
  # published. To run a published release instead, set HETCHY_VERSION=v0.1.0 in
  # .env and run `docker compose up -d --pull always`.
  hetchy:
    image: ${HETCHY_IMAGE:-ghcr.io/sleuth-io/hetchy}:${HETCHY_VERSION:-dev}
    pull_policy: ${HETCHY_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
        SANDBOX_VERSION: ${SANDBOX_VERSION:-}
    restart: unless-stopped
    ports:
      # Host side only. The container always listens on 8080 — see the note on
      # WEB_PORT below.
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      # Runtime mode and public URL.
      HETCHY_ENV: ${HETCHY_ENV:-prod}
      # Defaults track WEB_PORT. The container cannot infer the host port — it
      # always listens on 8080 — so anything the app derives from its own bind
      # port would name the wrong port once WEB_PORT is changed. Compose knows
      # both sides, so it supplies the externally reachable origin here.
      HETCHY_PUBLIC_BASE_URL: ${HETCHY_PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}

      # Auth. Self-hosted deployments use local username/password auth by
      # default. Hosted deployments can set HETCHY_AUTH_MODE=workos and fill
      # the WorkOS variables below.
      HETCHY_AUTH_MODE: ${HETCHY_AUTH_MODE:-local}
      HETCHY_TRUSTED_PROXY: ${HETCHY_TRUSTED_PROXY:-}
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}

      # Slack OAuth is optional. Per-org manual tokens and OAuth installs land
      # in the database after signup.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}

      # Linear OAuth is optional.
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      LINEAR_OAUTH_REDIRECT_URI: ${LINEAR_OAUTH_REDIRECT_URI:-}

      # GitHub App is optional for self-hosting. The UI supports a per-org
      # GitHub PAT without these process-level credentials.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}

      # Daytona sandbox configuration. DAYTONA_API_KEY is required for useful
      # agent runs.
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-universal-coding}
      HETCHY_SANDBOX_VERSION: ${HETCHY_SANDBOX_VERSION:-}
      DAYTONA_CACHE_VOLUMES_DISABLED: ${DAYTONA_CACHE_VOLUMES_DISABLED:-}
      DAYTONA_CACHE_VOLUME_PREFIX: ${DAYTONA_CACHE_VOLUME_PREFIX:-}
      DAYTONA_CACHE_PRUNE_DAYS: ${DAYTONA_CACHE_PRUNE_DAYS:-}
      DAYTONA_AUTO_ARCHIVE_MINUTES: ${DAYTONA_AUTO_ARCHIVE_MINUTES:-}
      HETCHY_SX_CACHE_DIR: ${HETCHY_SX_CACHE_DIR:-}
      HETCHY_SX_CACHE_MIN_FREE_MB: ${HETCHY_SX_CACHE_MIN_FREE_MB:-}
      HETCHY_SX_GIT_OPERATION_TIMEOUT_SECONDS: ${HETCHY_SX_GIT_OPERATION_TIMEOUT_SECONDS:-}
      HETCHY_SX_GIT_MAX_CONCURRENT_OPS: ${HETCHY_SX_GIT_MAX_CONCURRENT_OPS:-}

      # WorkOS configuration, only required when HETCHY_AUTH_MODE=workos.
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      WORKOS_WEBHOOK_SECRET: ${WORKOS_WEBHOOK_SECRET:-}
      # Same reasoning as HETCHY_PUBLIC_BASE_URL: left empty, the app would
      # build this from its in-container port and send post-logout redirects to
      # the wrong place.
      LOGOUT_RETURN_TO: ${LOGOUT_RETURN_TO:-http://localhost:${WEB_PORT:-8080}/}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}

      # Stripe billing.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUBSCRIPTION_PRICE_ID: ${STRIPE_SUBSCRIPTION_PRICE_ID:-}
      STRIPE_SUBSCRIPTION_PRICE_IDS: ${STRIPE_SUBSCRIPTION_PRICE_IDS:-}
      STRIPE_TOPUP_PRICE_ID: ${STRIPE_TOPUP_PRICE_ID:-}
      STRIPE_TOPUP_PRICE_IDS: ${STRIPE_TOPUP_PRICE_IDS:-}
      STRIPE_RETURN_TO: ${STRIPE_RETURN_TO:-}

      # Proof artifact upload. Validation runs use these settings
      # to mint pre-signed slots so screenshots and recordings can be linked
      # in PR bodies. Local filesystem storage takes precedence over S3.
      HETCHY_ARTIFACT_DIR: ${HETCHY_ARTIFACT_DIR:-}
      HETCHY_S3_BUCKET: ${HETCHY_S3_BUCKET:-}
      HETCHY_S3_REGION: ${HETCHY_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      # In-process scheduled-job dispatch. Defaults apply when unset;
      # interval 0 disables the loop for external-cron setups.
      HETCHY_JOB_DISPATCH_INTERVAL_SECONDS: ${HETCHY_JOB_DISPATCH_INTERVAL_SECONDS:-}
      HETCHY_JOB_DISPATCH_LIMIT: ${HETCHY_JOB_DISPATCH_LIMIT:-}
      HETCHY_JOB_DISPATCH_CONCURRENCY: ${HETCHY_JOB_DISPATCH_CONCURRENCY:-}
      HETCHY_PR_STATE_POLL_INTERVAL_SECONDS: ${HETCHY_PR_STATE_POLL_INTERVAL_SECONDS:-}
      HETCHY_PR_STATE_POLL_LIMIT: ${HETCHY_PR_STATE_POLL_LIMIT:-}

      # Database — defaults to the bundled postgres service. Override
      # DATABASE_URL to point at Supabase or another instance.
      # Nested ${...} in default values is unsupported by Docker Compose interpolation,
      # so defaults are hardcoded to match the postgres service's own defaults above.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hetchy?sslmode=disable}
      # Optional pgx pool ceiling. Empty leaves the pgx default
      # (max(4, NumCPU)). See internal/db/db.go for sizing guidance.
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-}

      # Web UI configuration.
      #
      # Deliberately fixed at 8080 rather than ${WEB_PORT}. WEB_PORT selects the
      # HOST port in the mapping above; feeding it to the app as well made the
      # app listen on that port inside the container while the mapping still
      # targeted 8080, so any WEB_PORT other than 8080 left the app silently
      # unreachable.
      WEB_PORT: 8080
    volumes:
      - hetchy-artifacts-data:/data/hetchy/artifacts
    healthcheck:
      # CMD avoids shell redirection; -O /dev/null discards output without
      # requiring a shell.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hetchy-postgres-data:
  hetchy-artifacts-data:
