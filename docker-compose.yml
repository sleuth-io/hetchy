services:
  # Local Postgres for development. Mirrors Supabase's Postgres surface (no
  # auth/storage/etc.) — enough for sqlc + golang-migrate. Port 5432 is
  # exposed on the host so `make bot` running on the host can connect to it.
  postgres:
    image: postgres:16-alpine
    container_name: hetchy-postgres
    restart: unless-stopped
    ports:
      # Default 5433 so we don't collide with other dev Postgres on 5432.
      # Override via POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hetchy}
    volumes:
      - hetchy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hetchy}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot migration runner. Bumps schema before the hetchy service
  # starts (see hetchy.depends_on.migration.condition: service_completed_successfully).
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: migration
    restart: "no"
    command: "--migrate"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --migrate mode only reads DATABASE_URL; nothing else is needed.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hetchy?sslmode=disable}

  # Main hetchy bot service.
  hetchy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    container_name: hetchy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      # Runtime mode — gates dev-only UI affordances (manual Slack
      # token paste, etc.). Defaults to prod so a missing var is the
      # safe choice; `make bot` overrides to dev.
      HETCHY_ENV: ${HETCHY_ENV:-prod}

      # Slack — process-level config for the deployed Hetchy app
      # (one app per env: dev/staging/prod). Per-org bot tokens land
      # in the database after OAuth install, not here.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}
      # Reference-only / not consumed by the Go code today.
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_VERIFICATION_TOKEN: ${SLACK_VERIFICATION_TOKEN:-}

      # GitHub App — process-level config for the deployed Hetchy
      # GitHub App (one App per env: dev/staging/prod). Per-org
      # installation tokens are minted on demand; nothing org-specific
      # lives here.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}

      # Daytona Cloud configuration.
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-universal-coding:1}
      DAYTONA_CACHE_VOLUMES_DISABLED: ${DAYTONA_CACHE_VOLUMES_DISABLED:-}
      DAYTONA_CACHE_VOLUME_PREFIX: ${DAYTONA_CACHE_VOLUME_PREFIX:-}
      DAYTONA_CACHE_PRUNE_DAYS: ${DAYTONA_CACHE_PRUNE_DAYS:-}
      DAYTONA_AUTO_ARCHIVE_MINUTES: ${DAYTONA_AUTO_ARCHIVE_MINUTES:-}

      # WorkOS configuration
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      LOGOUT_RETURN_TO: ${LOGOUT_RETURN_TO:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # sx (optional)
      SX_KEY: ${SX_KEY:-}

      # Proof artifact upload. Validation runs use these settings
      # to mint pre-signed S3 slots so screenshots and recordings can be
      # linked in PR bodies.
      HETCHY_S3_BUCKET: ${HETCHY_S3_BUCKET:-}
      HETCHY_S3_REGION: ${HETCHY_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      # Database — defaults to the bundled postgres service. Override
      # DATABASE_URL to point at Supabase or another instance.
      # Nested ${...} in default values is unsupported by Docker Compose interpolation,
      # so defaults are hardcoded to match the postgres service's own defaults above.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hetchy?sslmode=disable}
      # Optional pgx pool ceiling. Empty leaves the pgx default
      # (max(4, NumCPU)). Set in Doppler per environment — see
      # internal/db/db.go for sizing guidance.
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-}

      # Web UI configuration
      WEB_PORT: ${WEB_PORT:-8080}
      # Set to 1 only when serving over plain HTTP (local dev). In
      # production, leave empty so session cookies require TLS.
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
    healthcheck:
      # CMD avoids shell redirection; -O /dev/null discards output without
      # requiring a shell.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hetchy-postgres-data:
