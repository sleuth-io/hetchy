# OpenTelemetry collector config used by the bundled Daytona stack.
# Copied from daytonaio/daytona's docker/otel/otel-collector-config.yaml.
# The `jaeger` exporter target is dropped since we don't bundle jaeger;
# traces fall back to the debug exporter.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Logs / fallback to console
  debug:
    verbosity: basic

  # Metrics to Prometheus endpoint
  prometheus:
    endpoint: 0.0.0.0:9090
    namespace: otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
