<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hetchy</title>
<script>
(function(){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){
    var pref;
    try { pref = localStorage.getItem('theme') || 'system'; } catch(e) { pref = 'system'; }
    var dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.classList.toggle('is-dark', dark);
  }
  apply();
  mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if (e.key === 'theme') apply(); });
})();
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: #fff; padding: 2.5rem 3rem; border-radius: 1rem;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center; max-width: 24rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  p { color: #555; margin: 0 0 1.5rem; line-height: 1.5; }
  .row { display: flex; gap: .75rem; justify-content: center; }
  a.btn { display: inline-block; padding: .6rem 1.2rem; background: #0b93f6;
          color: #fff; text-decoration: none; border-radius: 2rem;
          font-size: 1rem; font-weight: 500; }
  a.btn.secondary { background: #fff; color: #0b93f6; border: 1px solid #0b93f6; }

  html { color-scheme: light; }
  html.is-dark { color-scheme: dark; }
  html.is-dark body { background: #0f0f10; }
  html.is-dark .card { background: #1c1c1f; color: #e7e7e9;
                       box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  html.is-dark h1 { color: #f5f5f7; }
  html.is-dark p { color: #b8b8bc; }
  html.is-dark a.btn.secondary { background: #1c1c1f; }
</style>
</head>
<body>
<div class="card">
  <h1>Hetchy</h1>
  <p>Turn natural-language requests into pull requests with Claude Code.</p>
  <div class="row">
    <a class="btn" href="/signup">Sign up</a>
    <a class="btn secondary" href="/login">Log in</a>
  </div>
</div>
</body>
</html>
