<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hetchy</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: #fff; padding: 2.5rem 3rem; border-radius: 1rem;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center; max-width: 24rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  p { color: #555; margin: 0 0 1.5rem; line-height: 1.5; }
  .row { display: flex; gap: .75rem; justify-content: center; }
  a.btn { display: inline-block; padding: .6rem 1.2rem; background: #0b93f6;
          color: #fff; text-decoration: none; border-radius: 2rem;
          font-size: 1rem; font-weight: 500; }
  a.btn.secondary { background: #fff; color: #0b93f6; border: 1px solid #0b93f6; }
</style>
</head>
<body>
<div class="card">
  <h1>Hetchy</h1>
  <p>Turn natural-language requests into pull requests with Claude Code.</p>
  <div class="row">
    <a class="btn" href="/signup">Sign up</a>
    <a class="btn secondary" href="/login">Log in</a>
  </div>
</div>
</body>
</html>
