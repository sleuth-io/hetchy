<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your organization · Hetchy</title>
<link rel="icon" type="image/svg+xml" href="{{faviconHref}}">
<script>
(function(){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){
    var pref;
    try { pref = localStorage.getItem('theme') || 'system'; } catch(e) { pref = 'system'; }
    var dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.classList.toggle('is-dark', dark);
  }
  apply();
  mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if (e.key === 'theme') apply(); });
})();
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 1rem; box-sizing: border-box; }
  .card { background: #fff; padding: 2rem 2.5rem; border-radius: 1rem;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); width: 100%; max-width: 24rem;
          box-sizing: border-box; }
  @media (max-width: 480px) {
    .card { padding: 1.5rem 1.25rem; }
  }
  h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
  .sub { color: #777; margin: 0 0 1.25rem; font-size: .9rem; }
  label { display: block; font-size: .85rem; color: #555; margin-bottom: .25rem; }
  input { width: 100%; padding: .55rem .75rem; border: 1px solid #ccc;
          border-radius: .4rem; font-size: 1rem; box-sizing: border-box; }
  input:focus { outline: none; border-color: #0b93f6; }
  button { margin-top: 1rem; width: 100%; padding: .65rem; background: #0b93f6;
           color: #fff; border: none; border-radius: .4rem; font-size: 1rem;
           cursor: pointer; }
  .err { background: #fee; color: #a00; padding: .5rem .75rem;
         border-radius: .4rem; margin-bottom: 1rem; font-size: .85rem; }
  .who { color: #999; font-size: .8rem; margin-top: 1rem; text-align: center; }
  .who a { color: #999; }

  html { color-scheme: light; }
  html.is-dark { color-scheme: dark; }
  html.is-dark body { background: #0f0f10; }
  html.is-dark .card { background: #1c1c1f; color: #e7e7e9;
                       box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  html.is-dark h1 { color: #f5f5f7; }
  html.is-dark .sub { color: #9a9aa0; }
  html.is-dark label { color: #b8b8bc; }
  html.is-dark input { background: #232327; color: #e7e7e9; border-color: #2e2e33; }
  html.is-dark .err { background: #3a1818; color: #ff8888; }
  html.is-dark .who, html.is-dark .who a { color: #6e6e72; }
</style>
</head>
<body>
<form class="card" method="POST" action="/onboarding">
  <h1>Create your organization</h1>
  <p class="sub">An organization holds your GitHub credentials, Slack bot, and target repo.</p>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <label for="org_name">Organization name</label>
  <input id="org_name" name="org_name" autofocus required maxlength="100" placeholder="Acme, Inc.">
  <button type="submit">Create organization</button>
  <p class="who">Signed in as {{.Email}} · <a href="/logout">Log out</a></p>
</form>
</body>
</html>
