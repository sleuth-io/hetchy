<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hetchy</title>
<!-- Markdown rendering for bot blocks. DOMPurify sanitizes the HTML
     marked produces — we render server-supplied content (Claude's
     stream-json text, tool inputs/results) and never want raw HTML
     bleeding in. CDN-pinned to specific minor versions so a publish
     can't silently change behaviour. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
// Theme bootstrap — runs before any styles are applied so the page paints
// in the chosen theme on first frame (no flash of light content). The
// preference lives in localStorage under 'theme' with values
// "system" | "light" | "dark"; "system" (or missing) follows the OS via
// prefers-color-scheme. A change in either source flips html.is-dark.
(function(){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){
    var pref;
    try { pref = localStorage.getItem('theme') || 'system'; } catch(e) { pref = 'system'; }
    var dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.classList.toggle('is-dark', dark);
  }
  apply();
  mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if (e.key === 'theme') apply(); });
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; display: flex; height: 100vh;
         background: #f5f5f5; color: #1a1a1a; }

  /* Sidebar */
  #sidebar { width: 260px; flex-shrink: 0; background: #fafafa;
             border-right: 1px solid #e5e5e5; display: flex; flex-direction: column;
             min-height: 0; }
  #sidebar-head { padding: .75rem; border-bottom: 1px solid #f0f0f0; }
  .new-chat-btn { display: flex; align-items: center; gap: .5rem; width: 100%;
                  padding: .55rem .75rem; background: #fff; border: 1px solid #e5e5e5;
                  border-radius: .5rem; font-size: .9rem; font-weight: 500;
                  color: #1a1a1a; cursor: pointer; text-decoration: none;
                  text-align: left; }
  .new-chat-btn:hover { background: #f4f4f4; border-color: #d0d0d0; }
  .new-chat-btn .plus { font-size: 1.05rem; line-height: 1; color: #888; }
  #sidebar-filter { padding: .5rem .75rem .25rem; }
  #user-filter { width: 100%; padding: .3rem .5rem; border: 1px solid #e5e5e5;
                 border-radius: .375rem; font-size: .8rem; font-family: inherit;
                 background: #fff; color: #333; cursor: pointer; outline: none; }
  #user-filter:focus { border-color: #0b93f6; }
  #sidebar-section { padding: .35rem .75rem .25rem;
                     font-size: .7rem; font-weight: 600; text-transform: uppercase;
                     letter-spacing: .05em; color: #999; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 .25rem .75rem; }
  #chat-list .empty { padding: .5rem .75rem; font-size: .85rem; color: #999; }
  .chat-item-wrap { position: relative; display: flex; align-items: center;
                    margin: 0 .25rem; border-radius: .375rem; }
  .chat-item-wrap:hover { background: #f0f0f0; }
  .chat-item-wrap.wrap-active { background: #e8f1fc; }
  .chat-item { flex: 1; min-width: 0; display: block; padding: .5rem .75rem;
               font-size: .875rem; color: #333; text-decoration: none; cursor: pointer;
               white-space: nowrap; overflow: hidden;
               -webkit-mask-image: linear-gradient(to right, black calc(100% - 2rem), transparent 100%);
               mask-image: linear-gradient(to right, black calc(100% - 2rem), transparent 100%);
               background: none; border-radius: 0; }
  .chat-item:hover { background: none; }
  .chat-item.active { background: none; color: #0b5ec0; }
  .chat-menu-btn { position: absolute; right: 0; top: 0; bottom: 0;
                   display: flex; align-items: center;
                   padding: 0 .4rem 0 1.2rem;
                   background: linear-gradient(to right, transparent, #fafafa 40%);
                   border: 0; color: #666; cursor: pointer;
                   font-size: 1rem; line-height: 1; font-family: inherit;
                   opacity: 0; pointer-events: none; }
  .chat-item-wrap:hover .chat-menu-btn { background: linear-gradient(to right, transparent, #f0f0f0 40%);
                                          opacity: 1; pointer-events: auto; }
  .chat-item-wrap.wrap-active .chat-menu-btn { background: linear-gradient(to right, transparent, #e8f1fc 40%); }
  .chat-menu-btn[aria-expanded="true"] { opacity: 1; pointer-events: auto; }

  /* Chat item context-menu dropdown — rendered into <body> as fixed-position */
  .chat-menu-drop { position: fixed; z-index: 200; background: #fff;
                    border: 1px solid #e5e5e5; border-radius: .4rem;
                    box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: .25rem 0;
                    min-width: 130px; }
  .chat-menu-drop[hidden] { display: none; }
  .chat-menu-drop-item { display: block; width: 100%; padding: .45rem .85rem;
                         text-align: left; background: none; border: 0;
                         border-radius: 0; cursor: pointer; font-family: inherit;
                         font-size: .83rem; color: #333; }
  .chat-menu-drop-item:hover { background: #f5f5f5; }
  .chat-menu-drop-item.danger { color: #c0392b; }
  .chat-menu-drop-item.danger:hover { background: #fff0ee; }

  /* Rename / delete dialogs */
  dialog.chat-dialog { border: none; border-radius: .55rem; padding: 0; margin: auto;
                        box-shadow: 0 16px 48px rgba(0,0,0,.22); max-width: 26rem;
                        width: 90vw; background: #fff; color: #1a1a1a; }
  dialog.chat-dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog.chat-dialog .dlg-body { padding: 1.25rem 1.25rem 1rem; }
  dialog.chat-dialog h3 { margin: 0 0 .75rem; font-size: 1rem; font-weight: 600; }
  dialog.chat-dialog p { margin: 0 0 .75rem; font-size: .875rem; color: #555; }
  dialog.chat-dialog input[type="text"] { width: 100%; padding: .5rem .65rem;
    border: 1px solid #d0d0d0; border-radius: .4rem; font-size: .9rem;
    font-family: inherit; outline: none; }
  dialog.chat-dialog input[type="text"]:focus { border-color: #0b93f6; }
  dialog.chat-dialog .dlg-actions { display: flex; justify-content: flex-end;
                                     gap: .5rem; padding: .85rem 1.25rem; }
  dialog.chat-dialog .dlg-cancel { padding: .5rem 1rem; background: #f3f3f3;
    color: #333; border: 1px solid #d8d8d8; border-radius: .4rem; cursor: pointer;
    font-size: .875rem; font-family: inherit; }
  dialog.chat-dialog .dlg-cancel:hover { background: #ebebeb; }
  dialog.chat-dialog .dlg-save { padding: .5rem 1rem; background: #0b93f6;
    color: #fff; border: 0; border-radius: .4rem; cursor: pointer;
    font-size: .875rem; font-family: inherit; }
  dialog.chat-dialog .dlg-save:hover { background: #0a83d8; }
  dialog.chat-dialog .dlg-delete { padding: .5rem 1rem; background: #c0392b;
    color: #fff; border: 0; border-radius: .4rem; cursor: pointer;
    font-size: .875rem; font-family: inherit; }
  dialog.chat-dialog .dlg-delete:hover { background: #a93226; }

  /* Main column */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Top bar across the chat column. Holds the toggle for the right-hand
     metadata panel; nothing else lives here yet so it stays slim. */
  #main-top { display: flex; align-items: center; justify-content: flex-end;
              padding: .5rem .75rem; border-bottom: 1px solid #ececec;
              background: #fafafa; min-height: 2.5rem; }
  #meta-toggle { display: inline-flex; align-items: center; justify-content: center;
                 padding: .35rem; background: none; border: 1px solid transparent;
                 border-radius: .35rem; color: #555; cursor: pointer;
                 line-height: 0; }
  #meta-toggle:hover { background: #efefef; border-color: #e0e0e0; }
  #meta-toggle[aria-pressed="true"] { background: #e8f1fc; border-color: #cfe2f8;
                                       color: #0b5ec0; }
  #meta-toggle svg { width: 1rem; height: 1rem; }

  #log  { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex;
          flex-direction: column; gap: .75rem; }
  .msg  { max-width: 70%; padding: .6rem 1rem; border-radius: 1rem; line-height: 1.4; }
  .user { align-self: flex-end; background: #0b93f6; color: #fff; border-bottom-right-radius: .25rem; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #ddd;
          border-bottom-left-radius: .25rem; white-space: pre-wrap; }
  #empty-state { margin: auto; text-align: center; color: #888; font-size: .95rem; }
  #empty-state h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: .5rem;
                    color: #333; }
  .empty-ascii { font-family: monospace; font-size: .6rem; line-height: 1.2;
                 color: #0b93f6; margin: 0 auto 1rem; display: inline-block;
                 text-align: left; white-space: pre; }
  #empty-state .options { margin-top: 1.25rem; display: inline-flex;
                          align-items: center; gap: .5rem;
                          font-size: .9rem; color: #555; cursor: pointer;
                          user-select: none; }
  #empty-state .options input[type="checkbox"] { width: 1rem; height: 1rem;
                                                 cursor: pointer; }
  #bar  { display: flex; gap: .5rem; padding: 1rem; background: #fff;
          border-top: 1px solid #ddd; }
  #inp  { flex: 1; padding: .6rem 1rem; border: 1px solid #ccc; border-radius: 2rem;
          font-size: 1rem; outline: none; }
  #inp:focus { border-color: #0b93f6; }
  button { padding: .6rem 1.2rem; background: #0b93f6; color: #fff; border: none;
           border-radius: 2rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #session-bar { padding: .3rem 1rem; background: #f0f0f0; border-top: 1px solid #ddd;
                 font-size: .75rem; color: #888; font-family: monospace;
                 display: flex; justify-content: space-between; align-items: center; }
  #session-bar a { color: #0b93f6; text-decoration: none; font-family: system-ui, sans-serif; }
  #session-bar a:hover { text-decoration: underline; }
  #session-bar .links { display: flex; gap: 1rem; }

  /* Right-side metadata sidebar — surfaces what we know about the chat
     (repo, branch, PR, sandbox, creator). Hidden when the user toggles
     it off via #meta-toggle (state persisted in localStorage). */
  #meta-sidebar { width: 280px; flex-shrink: 0; background: #fafafa;
                  border-left: 1px solid #e5e5e5; display: flex;
                  flex-direction: column; min-height: 0; overflow-y: auto; }
  body.meta-hidden #meta-sidebar { display: none; }
  .meta-section { padding: .85rem 1rem; border-bottom: 1px solid #f0f0f0; }
  .meta-section:last-child { border-bottom: 0; }
  .meta-title { font-size: .7rem; font-weight: 600; text-transform: uppercase;
                letter-spacing: .05em; color: #888; margin-bottom: .55rem; }
  .meta-row { display: flex; gap: .5rem; align-items: baseline;
              padding: .25rem 0; font-size: .82rem; }
  .meta-row .meta-label { width: 5.5rem; flex-shrink: 0; color: #777; }
  .meta-row .meta-value { flex: 1; min-width: 0; color: #1a1a1a;
                          overflow-wrap: anywhere; }
  .meta-row .meta-value a { color: #0b5ec0; text-decoration: none; }
  .meta-row .meta-value a:hover { text-decoration: underline; }
  .meta-row.is-empty .meta-value { color: #b8b8b8; }
  .meta-empty { padding: 1rem; font-size: .82rem; color: #888;
                text-align: center; }
  .meta-badge { display: inline-block; padding: 0 .4rem; border-radius: .65rem;
                font-size: .7rem; font-weight: 500; line-height: 1.4;
                background: #e6f4ea; color: #1e7a3c; vertical-align: middle;
                margin-left: .35rem; }
  .meta-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: .78rem; }

  /* User menu — sidebar footer with click-to-open popup */
  .user-menu { position: relative; border-top: 1px solid #f0f0f0;
               margin-top: auto; padding-bottom: .75rem; }
  /* border-radius is set explicitly because the global `button` rule
     (used by the chat Send button) gives all <button>s a 2rem pill
     radius; without this override the hover highlight would round off
     instead of filling the full sidebar width. */
  .user-menu-trigger { display: flex; align-items: center; gap: .6rem;
                       width: 100%; padding: .65rem .75rem; background: none;
                       border: 0; border-radius: 0; cursor: pointer;
                       text-align: left; font-family: inherit;
                       font-size: .9rem; color: #1a1a1a; }
  .user-menu-trigger:hover, .user-menu-trigger[aria-expanded="true"] { background: #f0f0f0; }
  .user-menu-trigger .name { flex: 1; min-width: 0; font-weight: 500;
                             white-space: nowrap; overflow: hidden;
                             text-overflow: ellipsis; }
  .avatar { width: 28px; height: 28px; border-radius: 50%;
            display: block; background: #f0f0f0; flex-shrink: 0; }
  .user-menu-dropdown { position: absolute; bottom: calc(100% + .35rem); left: .5rem;
                        right: .5rem; background: #fff; border: 1px solid #e5e5e5;
                        border-radius: .5rem; box-shadow: 0 8px 24px rgba(0,0,0,.12);
                        padding: .25rem 0; z-index: 50; }
  .user-menu-dropdown[hidden] { display: none; }
  .user-menu-header { display: flex; align-items: center; gap: .75rem;
                      padding: .75rem .85rem; border-bottom: 1px solid #f0f0f0; }
  .user-menu-header .avatar-lg { width: 36px; height: 36px; border-radius: 50%;
                                  background: #f0f0f0; display: block; flex-shrink: 0; }
  .user-menu-header .name { font-weight: 600; font-size: .9rem; color: #1a1a1a;
                            line-height: 1.2; white-space: nowrap;
                            overflow: hidden; text-overflow: ellipsis; }
  .user-menu-header .email { font-size: .75rem; color: #777; line-height: 1.4;
                             white-space: nowrap; overflow: hidden;
                             text-overflow: ellipsis; }
  .user-menu-header > div { min-width: 0; }
  .user-menu-dropdown a.item { display: flex; align-items: center; gap: .6rem;
                                padding: .55rem .85rem; color: #333; font-size: .85rem;
                                text-decoration: none; }
  .user-menu-dropdown a.item:hover { background: #f7f7f7; text-decoration: none; }
  .user-menu-dropdown a.item .ico { width: 1rem; height: 1rem; opacity: .65;
                                     flex-shrink: 0; color: #555; }
  .user-menu-dropdown .divider { border-top: 1px solid #f0f0f0; margin: .25rem 0; }

  /* Block-style bot messages. The bot's per-turn output is a sequence
     of typed Blocks (sandbox setup, claude_text, tool_use, notify,
     result, error). Each block renders as a <details> element that
     auto-collapses when the next one starts; the active streaming
     block stays open. */
  /* Fixed-width container so the block stack doesn't jump around as
     content streams in and blocks open/close. The blocks inside (which
     are <details> elements, block-level by default) stretch to fill
     this width, keeping every row the same size regardless of which
     block is currently widest. Pinned to the left at 80% so bot turns
     read as a response distinct from the right-aligned user bubble. */
  .bot-turn { display: flex; flex-direction: column; gap: .35rem;
              align-self: flex-start; width: 80%; min-width: 0; }
  .blk { border: 1px solid #e2e2e6; border-radius: .55rem; background: #fff;
         overflow: hidden; transition: border-color .15s; }
  .blk[open] { border-color: #c8c8cc; }
  .blk > summary { display: flex; align-items: center; gap: .5rem;
                   padding: .45rem .75rem; cursor: pointer; user-select: none;
                   font-size: .82rem; color: #444; list-style: none; }
  .blk > summary::-webkit-details-marker { display: none; }
  .blk > summary .caret { color: #999; font-size: .7rem; width: .8rem;
                          display: inline-block; text-align: center;
                          transition: transform .15s; }
  .blk[open] > summary .caret { transform: rotate(90deg); }
  .blk > summary .blk-icon { font-size: .9rem; line-height: 1;
                             flex-shrink: 0; width: 1rem; text-align: center; }
  .blk > summary .blk-title { flex: 1; min-width: 0; font-weight: 500;
                              white-space: nowrap; overflow: hidden;
                              text-overflow: ellipsis; }
  .blk > summary .blk-summary { color: #888; font-weight: 400;
                                font-size: .75rem; flex-shrink: 0; }
  .blk-body { padding: .5rem .85rem .8rem; font-size: .88rem;
              line-height: 1.5; color: #1a1a1a; }
  .blk-body p { margin: .35rem 0; }
  .blk-body p:first-child { margin-top: 0; }
  .blk-body p:last-child { margin-bottom: 0; }
  .blk-body pre { background: #f3f3f5; border: 1px solid #e6e6ea;
                  border-radius: .35rem; padding: .5rem .65rem;
                  overflow-x: auto; font-size: .8rem; line-height: 1.4;
                  margin: .35rem 0; }
  .blk-body code { background: #f0f0f3; border-radius: .25rem;
                   padding: 0 .2rem; font-size: .85em; }
  .blk-body pre code { background: transparent; padding: 0; font-size: 1em; }
  .blk-body a { color: #0b5ec0; }
  .blk-body ul, .blk-body ol { margin: .35rem 0 .35rem 1.25rem; }

  /* Per-kind accents on the icon column. */
  .blk-kind-setup       > summary .blk-icon { color: #888; }
  .blk-kind-notify      > summary .blk-icon { color: #0b93f6; }
  .blk-kind-claude_text > summary .blk-icon { color: #6b46c1; }
  .blk-kind-tool_use    > summary .blk-icon { color: #2b8a3e; }
  .blk-kind-result      > summary .blk-icon { color: #2b8a3e; }
  .blk-kind-error       > summary .blk-icon { color: #c0392b; }
  .blk-kind-error       { border-color: #f4b6ad; }
  .blk-kind-result      { border-color: #b6e0c4; }

  /* Tool-use blocks render as compact one-line log rows (matching
     Claude Code's terminal `● Read(file.go) — 287 lines` style). The
     web emitter drops the streamed body for tool_use, so the body
     div stays empty and we hide it; the caret is removed and the
     summary cursor is default to make the row visually inert. */
  .blk-kind-tool_use { border-color: transparent; background: transparent;
                        border-radius: 0; }
  .blk-kind-tool_use > summary { padding: .2rem .25rem; cursor: default; }
  .blk-kind-tool_use > summary .caret { display: none; }
  .blk-kind-tool_use > .blk-body { display: none; }
  /* Failed tools surface the truncated error in the summary slot —
     bump it so it's not dim like a happy-path "287 lines". */
  .blk-kind-tool_use.blk-kind-error > summary .blk-summary {
    color: #c0392b; font-weight: 500;
  }

  /* "Phase" boxes group a Claude prose paragraph with the tool calls
     it triggered. The box header carries the prose's first line as a
     scannable title; the body shows the full prose (when there's more
     than one line) followed by the tool one-liners. When the next
     phase or a terminal block starts, the previous phase collapses
     and its right-side summary updates with the step count. */
  .blk-kind-phase > summary .blk-icon { color: #6b46c1; }
  .blk-kind-phase > .blk-body { padding: .35rem .85rem .65rem; }
  .phase-prose { font-size: .9rem; line-height: 1.5; color: #1a1a1a; }
  .phase-prose:empty { display: none; }
  .phase-prose p { margin: .25rem 0; }
  .phase-prose p:first-child { margin-top: 0; }
  .phase-prose p:last-child { margin-bottom: 0; }
  .phase-prose code { background: #f0f0f3; border-radius: .25rem;
                      padding: 0 .2rem; font-size: .85em; }
  .phase-prose a { color: #0b5ec0; }
  .phase-tools { margin-top: .25rem; }
  .phase-tools:empty { margin-top: 0; }


  /* Spinner for streaming blocks (status="streaming"). */
  .blk-streaming > summary .blk-icon::after {
    content: ''; display: inline-block; width: .75rem; height: .75rem;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: blk-spin .7s linear infinite;
    vertical-align: -.15em;
  }
  .blk-streaming > summary .blk-icon { color: #888; }
  .blk-streaming > summary .blk-icon > * { display: none; }
  @keyframes blk-spin { to { transform: rotate(360deg); } }

  /* Dark theme — applied via html.is-dark by the bootstrap script. Kept
     as overrides on top of the light defaults so the light path stays
     untouched and either rule set is easy to find when tweaking colors. */
  html { color-scheme: light; }
  html.is-dark { color-scheme: dark; }
  html.is-dark body { background: #18181b; color: #e7e7e9; }
  html.is-dark #sidebar { background: #1c1c1f; border-right-color: #2a2a2d; }
  html.is-dark #sidebar-head { border-bottom-color: #2a2a2d; }
  html.is-dark .new-chat-btn { background: #232327; border-color: #2e2e33; color: #e7e7e9; }
  html.is-dark .new-chat-btn:hover { background: #2a2a2e; border-color: #3a3a40; }
  html.is-dark .new-chat-btn .plus { color: #9a9aa0; }
  html.is-dark #user-filter { background: #232327; border-color: #2e2e33; color: #c4c4c8; }
  html.is-dark #user-filter:focus { border-color: #7dc4ff; }
  html.is-dark #sidebar-section { color: #6e6e72; }
  html.is-dark #chat-list .empty { color: #6e6e72; }
  html.is-dark .chat-item-wrap:hover { background: #2a2a2e; }
  html.is-dark .chat-item-wrap.wrap-active { background: #1f3a5c; }
  html.is-dark .chat-item { color: #c4c4c8; }
  html.is-dark .chat-item:hover { background: none; }
  html.is-dark .chat-item.active { background: none; color: #7dc4ff; }
  html.is-dark .chat-menu-btn { color: #9a9aa0; background: linear-gradient(to right, transparent, #1c1c1f 40%); }
  html.is-dark .chat-item-wrap:hover .chat-menu-btn { background: linear-gradient(to right, transparent, #2a2a2e 40%); }
  html.is-dark .chat-item-wrap.wrap-active .chat-menu-btn { background: linear-gradient(to right, transparent, #1f3a5c 40%); }
  html.is-dark .chat-menu-drop { background: #232327; border-color: #2e2e33;
                                  box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  html.is-dark .chat-menu-drop-item { color: #c4c4c8; }
  html.is-dark .chat-menu-drop-item:hover { background: #2a2a2e; }
  html.is-dark .chat-menu-drop-item.danger { color: #f87171; }
  html.is-dark .chat-menu-drop-item.danger:hover { background: #3a1c1c; }
  html.is-dark dialog.chat-dialog { background: #1c1c1f; color: #e7e7e9; }
  html.is-dark dialog.chat-dialog::backdrop { background: rgba(0,0,0,.6); }
  html.is-dark dialog.chat-dialog p { color: #9a9aa0; }
  html.is-dark dialog.chat-dialog input[type="text"] { background: #232327;
    color: #e7e7e9; border-color: #2e2e33; }
  html.is-dark dialog.chat-dialog input[type="text"]:focus { border-color: #7dc4ff; }

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');

// Current user's WorkOS ID, injected by the server. Used to default the
// sidebar filter to "my chats".
const currentUserID = '{{.UserID}}';

// Read session ID from URL (?session=...) so the page can be reloaded or
// shared to reconnect to an existing sandbox. Generate a new one if absent.
// crypto.randomUUID() is gated on secure contexts; on plain HTTP at a
// non-localhost host (like dev.hetchy.ai) it isn't defined, so fall back
// to RFC4122 v4 from getRandomValues (which is unrestricted).
function newSessionId() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
const params = new URLSearchParams(window.location.search);
const isFreshChat = !params.has('session');
const sessionId = params.get('session') || newSessionId();
if (isFreshChat) {
  const url = new URL(window.location);
  url.searchParams.set('session', sessionId);
  history.replaceState(null, '', url);
}
document.getElementById('session-label').textContent = sessionId;

inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

function addUserMsg(text) {
  // Replace the empty-state placeholder the first time we add a message
  // so the welcome card disappears as the conversation begins.
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg user';
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

// Per-kind icon glyphs shown in the collapsed summary. Spinner takes
// over when a block is streaming, so this is just the resting icon.
const BLK_ICON = {
  setup:       '□', // ▢
  notify:      '●', // ●
  claude_text: '✎', // ✎
  tool_use:    '⚙', // ⚙
  result:      '✓', // ✓
  error:       '✗', // ✗
  phase:       '✎', // ✎ — phase boxes group prose + tools, share the prose icon
};

// renderMarkdown converts a markdown body into sanitized HTML. We
// trust marked's output shape but run it through DOMPurify because
// the body comes from Claude / sandbox stdout and could contain
// arbitrary text — some of which (e.g. tool result JSON) might look
// like an HTML tag to a careless parser.
function renderMarkdown(md) {
  if (!md) return '';
  const html = marked.parse(md, { breaks: true, gfm: true });
  return DOMPurify.sanitize(html);
}

// startBotTurn ensures there's a container the streaming blocks are
// appended into. One container per user → bot exchange. The active
// block's icon spinner is the run's "still alive" indicator —
// there's no separate turn-level pulse because it would duplicate
// the spinner inside whichever block is currently streaming.
function startBotTurn() {
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'bot-turn';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

// renderBlock builds a collapsible block element and appends it into
// the supplied turn container. Used for setup, notify, result, and
// error kinds — claude_text and tool_use go through phase boxes
// (openPhase / addToolToPhase) instead so the user sees the prose +
// tools as a single grouped unit.
//
// tool_use is still handled here for the standalone case (no phase
// has been opened yet), though in practice the phase model creates
// one on first contact. We keep the standalone branch so a future
// emitter that fires tool_use without a wrapping claude_text doesn't
// silently drop on the floor.
function renderBlock(turn, block, opts) {
  const isToolUse = block.kind === 'tool_use';
  const open = !!(opts && opts.open) && !isToolUse;
  const el = document.createElement('details');
  el.className = 'blk blk-kind-' + block.kind
                 + (block.status === 'streaming' ? ' blk-streaming' : '')
                 + (block.status === 'error' ? ' blk-kind-error' : '');
  if (open) el.open = true;
  el.dataset.blockId = block.id;
  el.id = 'block-' + block.id;
  el.innerHTML = '<summary>'
    + '<span class="caret">▶</span>'
    + '<span class="blk-icon"><span>' + (BLK_ICON[block.kind] || '•') + '</span></span>'
    + '<span class="blk-title"></span>'
    + '<span class="blk-summary"></span>'
    + '</summary><div class="blk-body"></div>';
  el.querySelector('.blk-title').textContent = block.title || '';
  el.querySelector('.blk-summary').textContent = block.summary || '';
  if (!isToolUse) {
    el.querySelector('.blk-body').innerHTML = renderMarkdown(block.body || '');
  }
  if (isToolUse) {
    // Suppress the native <details> click-to-toggle so the body never
    // opens (it would reveal an empty pane).
    el.querySelector('summary').addEventListener('click', e => e.preventDefault());
  }
  turn.appendChild(el);
  return el;
}

// openPhase creates a new phase box ("group" of one Claude prose
// paragraph + the tool calls it triggers). The box stays expanded
// while it's the active phase; closePhase below collapses it and
// stamps the right-hand summary with the step count.
//
// The header title is set on creation from the first claude_text
// chunk's first line (or "Working" when a tool_use opens the phase
// without a leading prose chunk). The body holds two regions: a
// .phase-prose block that streams the rest of the paragraph, and a
// .phase-tools wrapper that subsequent tool_uses are appended into.
function openPhase(turn, headerTitle) {
  const el = document.createElement('details');
  el.className = 'blk blk-kind-phase blk-streaming';
  el.open = true;
  el.innerHTML = '<summary>'
    + '<span class="caret">▶</span>'
    + '<span class="blk-icon"><span>' + BLK_ICON.phase + '</span></span>'
    + '<span class="blk-title"></span>'
    + '<span class="blk-summary"></span>'
    + '</summary>'
    + '<div class="blk-body">'
    +   '<div class="phase-prose"></div>'
    +   '<div class="phase-tools"></div>'
    + '</div>';
  const phase = {
    el,
    titleEl: el.querySelector('.blk-title'),
    summaryEl: el.querySelector('.blk-summary'),
    proseEl: el.querySelector('.phase-prose'),
    toolsEl: el.querySelector('.phase-tools'),
    proseRaw: '',
    toolCount: 0,
    titleLocked: false,
    proseRenderQueued: false,
  };
  phase.titleEl.textContent = headerTitle || 'Working';
  if (headerTitle) phase.titleLocked = true;
  turn.appendChild(el);
  return phase;
}

// closePhase collapses the phase and updates its right-hand summary
// with the step count so the user sees "5 steps" once it's done.
// Idempotent — safe to call on a phase that's already closed.
function closePhase(phase) {
  if (!phase || phase._closed) return;
  phase._closed = true;
  phase.el.classList.remove('blk-streaming');
  phase.el.open = false;
  if (phase.toolCount > 0) {
    phase.summaryEl.textContent = phase.toolCount === 1
      ? '1 step'
      : phase.toolCount + ' steps';
  }
}

// appendPhaseProse buffers the delta into the phase's prose buffer
// and schedules a single rAF-coalesced re-render — same coalescing
// rationale as the original appendToBlock (avoid O(n²) full re-parse
// per token on long prose chunks).
//
// Once the prose contains its first newline the header title is
// frozen with `titleLocked = true`. Without that latch, every
// subsequent delta would re-run `indexOf('\n')` over the growing
// buffer for nothing — the title can't change after the first line
// is complete. Until the newline arrives, we keep updating the
// title from the running first-line preview so streaming feels live.
function appendPhaseProse(phase, delta) {
  if (!phase) return;
  phase.proseRaw += delta;
  if (!phase.titleLocked) {
    const nl = phase.proseRaw.indexOf('\n');
    const head = nl >= 0 ? phase.proseRaw.slice(0, nl) : phase.proseRaw;
    const firstLine = head.trim();
    if (firstLine) {
      phase.titleEl.textContent = firstLine.length > 100
        ? firstLine.slice(0, 100) + '…'
        : firstLine;
    }
    if (nl >= 0) phase.titleLocked = true;
  }
  if (phase.proseRenderQueued) return;
  phase.proseRenderQueued = true;
  requestAnimationFrame(() => {
    phase.proseRenderQueued = false;
    phase.proseEl.innerHTML = renderMarkdown(phase.proseRaw);
    log.scrollTop = log.scrollHeight;
  });
}

// finishPhaseProse flushes any pending render (so the last delta
// always lands) and commits the title. The phase itself stays open —
// the trailing tool_uses are still arriving and belong inside it.
function finishPhaseProse(phase) {
  if (!phase) return;
  phase.titleLocked = true;
  phase.proseEl.innerHTML = renderMarkdown(phase.proseRaw);
}

// addToolToPhase renders a tool_use one-liner inside the supplied
// phase. Mirrors the standalone tool_use rendering in renderBlock so
// the row looks identical whether or not it's inside a phase; this
// is what keeps the visual treatment consistent across rows that
// happen to be standalone (no preceding prose) and rows inside a
// phase.
function addToolToPhase(phase, payload) {
  const el = document.createElement('details');
  el.className = 'blk blk-kind-tool_use'
                 + (payload.status === 'streaming' ? ' blk-streaming' : '')
                 + (payload.status === 'error' ? ' blk-kind-error' : '');
  el.dataset.blockId = payload.id;
  el.id = 'block-' + payload.id;
  el.innerHTML = '<summary>'
    + '<span class="caret">▶</span>'
    + '<span class="blk-icon"><span>' + BLK_ICON.tool_use + '</span></span>'
    + '<span class="blk-title"></span>'
    + '<span class="blk-summary"></span>'
    + '</summary><div class="blk-body"></div>';
  el.querySelector('.blk-title').textContent = payload.title || '';
  el.querySelector('.blk-summary').textContent = payload.summary || '';
  el.querySelector('summary').addEventListener('click', e => e.preventDefault());
  phase.toolsEl.appendChild(el);
  phase.toolCount++;
  return el;
}

// appendToBlock buffers the delta into the block's raw markdown and
// schedules a single rAF-coalesced re-render. A naive "re-render on
// every delta" would be O(n²): each chunk re-parses + re-sanitises the
// full body, which visibly stutters the browser on long Claude streams
// (thousands of small text deltas). Coalescing collapses bursts of
// deltas into one paint per frame.
function appendToBlock(el, delta) {
  if (!el) return;
  const body = el.querySelector('.blk-body');
  body.dataset.raw = (body.dataset.raw || '') + delta;
  scheduleBlockRender(el);
}

function scheduleBlockRender(el) {
  if (el._renderQueued) return;
  el._renderQueued = true;
  requestAnimationFrame(() => {
    el._renderQueued = false;
    // Collapsible <details> blocks hide the body when closed, so the
    // markdown render is wasted work — catch up on the next render
    // (or on finishBlock). Flat claude_text blocks are always visible,
    // so we always paint.
    if (el.tagName === 'DETAILS' && !el.open) return;
    const body = el.querySelector('.blk-body');
    body.innerHTML = renderMarkdown(body.dataset.raw || '');
    log.scrollTop = log.scrollHeight;
  });
}

function finishBlock(el, status, summary) {
  if (!el) return;
  el.classList.remove('blk-streaming');
  const summaryEl = el.querySelector('.blk-summary');
  if (summary && summaryEl) summaryEl.textContent = summary;
  if (status === 'error') {
    el.classList.add('blk-kind-error');
  }
  // Force a final render so any pending deltas land before the block
  // is collapsed by the next block_start (a collapsed block skips its
  // queued render, so we'd otherwise miss the last few tokens).
  const body = el.querySelector('.blk-body');
  if (body) body.innerHTML = renderMarkdown(body.dataset.raw || '');
}

function showEmptyState() {
  log.innerHTML = '';
  const d = document.createElement('div');
  d.id = 'empty-state';
  const ascii = `<pre class="empty-ascii">
  ██╗  ██╗███████╗████████╗ ██████╗██╗  ██╗██╗   ██╗
  ██║  ██║██╔════╝╚══██╔══╝██╔════╝██║  ██║╚██╗ ██╔╝
  ███████║█████╗     ██║   ██║     ███████║ ╚████╔╝
  ██╔══██║██╔══╝     ██║   ██║     ██╔══██║  ╚██╔╝
  ██║  ██║███████╗   ██║   ╚██████╗██║  ██║   ██║
  ╚═╝  ╚═╝╚══════╝   ╚═╝    ╚═════╝╚═╝  ╚═╝   ╚═╝

       &lt; your AI coding co-pilot /&gt;
  </pre>`;
  d.innerHTML =
    ascii +
    '<h2>Start a new chat</h2>' +
    '<div>Describe a feature, fix, or refactor and Hetchy will open a PR.</div>' +
    '<label class="options">' +
    '  <input type="checkbox" id="validate-checkbox" checked>' +
    '  Validate changes with end-to-end testing' +
    '</label>';
  log.appendChild(d);
}

// Sidebar state. `sidebarItems` is the last list returned by the API
// — the server persists each new conversation row at HandleRequest
// entry (before sandbox creation), so calling loadSidebar() after a
// new turn starts reliably picks up the in-flight chat without any
// optimistic placeholder.
let sidebarItems = [];
// `userFilter` is the currently-selected creator_id for the sidebar filter.
// Empty string means "All". Persisted in localStorage so navigating to a
// chat (which reloads the page) doesn't snap the filter back to "Me".
// Defaults to the current user on first visit.
//
// Key is suffixed with the current user_id so a shared browser doesn't
// carry one user's saved filter into another's session — that user's
// id wouldn't match any option in the new account's dropdown, the
// dropdown would silently fall back to "All", and the sidebar would
// appear empty until the user manually re-picked.
const userFilterStorageKey = 'hetchy.userFilter.' + currentUserID;
let userFilter = (function () {
  try {
    const saved = localStorage.getItem(userFilterStorageKey);
    return saved === null ? currentUserID : saved;
  } catch (e) {
    return currentUserID;
  }
})();

function renderSidebar() {
  const list = document.getElementById('chat-list');
  const display = sidebarItems.slice();
  list.innerHTML = '';
  if (display.length === 0) {
    list.innerHTML = '<div class="empty">No past chats yet.</div>';
    return;
  }
  for (const c of display) {
    const wrap = document.createElement('div');
    const isActive = c.thread_id === sessionId;
    wrap.className = 'chat-item-wrap' + (isActive ? ' wrap-active' : '');

    const a = document.createElement('a');
    a.className = 'chat-item' + (isActive ? ' active' : '');
    a.href = '/?session=' + encodeURIComponent(c.thread_id);
    a.title = c.title;
    a.textContent = c.title;
    wrap.appendChild(a);

    const menuBtn = document.createElement('button');
    menuBtn.className = 'chat-menu-btn';
    menuBtn.setAttribute('aria-label', 'Chat options');
    menuBtn.setAttribute('aria-haspopup', 'menu');
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.textContent = '•••';
    menuBtn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      toggleChatMenu(menuBtn, c.thread_id, c.title);
    });
    wrap.appendChild(menuBtn);

    list.appendChild(wrap);
  }
}

// --- Chat item context menu ---
// A single shared dropdown rendered into <body> as fixed-position so it
// isn't clipped by the sidebar's overflow-y: auto scroll container.
const chatMenuDrop = document.createElement('div');
chatMenuDrop.className = 'chat-menu-drop';
chatMenuDrop.setAttribute('role', 'menu');
chatMenuDrop.hidden = true;
document.body.appendChild(chatMenuDrop);

let activeMenuBtn = null;

function closeChatMenu() {
  if (activeMenuBtn) {
    activeMenuBtn.setAttribute('aria-expanded', 'false');
    activeMenuBtn = null;
  }
  chatMenuDrop.hidden = true;
}

function toggleChatMenu(btn, threadId, title) {
  if (activeMenuBtn === btn) { closeChatMenu(); return; }
  closeChatMenu();

  activeMenuBtn = btn;
  btn.setAttribute('aria-expanded', 'true');

  // Populate options
  chatMenuDrop.innerHTML = '';
  const renameItem = document.createElement('button');
  renameItem.className = 'chat-menu-drop-item';
  renameItem.setAttribute('role', 'menuitem');
  renameItem.textContent = 'Rename';
  renameItem.addEventListener('click', () => { closeChatMenu(); openRenameDialog(threadId, title); });
  const deleteItem = document.createElement('button');
  deleteItem.className = 'chat-menu-drop-item danger';
  deleteItem.setAttribute('role', 'menuitem');
  deleteItem.textContent = 'Delete';
  deleteItem.addEventListener('click', () => { closeChatMenu(); openDeleteDialog(threadId); });
  chatMenuDrop.appendChild(renameItem);
  chatMenuDrop.appendChild(deleteItem);

  // Position below the button, aligned to its right edge
  const rect = btn.getBoundingClientRect();
  chatMenuDrop.style.top = (rect.bottom + 4) + 'px';
  chatMenuDrop.style.left = '';
  chatMenuDrop.style.right = (window.innerWidth - rect.right) + 'px';
  chatMenuDrop.hidden = false;
}

document.addEventListener('click', e => {
  if (!chatMenuDrop.hidden && !chatMenuDrop.contains(e.target)) closeChatMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !chatMenuDrop.hidden) closeChatMenu();
});
// The dropdown is body-positioned (fixed coords) so it doesn't move with
// the sidebar — close it on scroll instead of trying to track the button.
document.getElementById('chat-list').addEventListener('scroll', () => {
  if (!chatMenuDrop.hidden) closeChatMenu();
}, { passive: true });

// --- Rename dialog ---
const renameDialog = document.getElementById('rename-dialog');
const renameInput  = document.getElementById('rename-input');

document.getElementById('rename-cancel').addEventListener('click', () => renameDialog.close());
document.getElementById('rename-save').addEventListener('click', saveRename);
renameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveRename(); });

function openRenameDialog(threadId, currentTitle) {
  renameInput.value = currentTitle;
  renameInput.dataset.threadId = threadId;
  renameDialog.showModal();
  renameInput.select();
}

async function saveRename() {
  const threadId = renameInput.dataset.threadId;
  const newTitle = renameInput.value.trim();
  if (!newTitle) return;
  let res;
  try {
    res = await fetch('/api/conversations/' + encodeURIComponent(threadId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle }),
    });
  } catch (_) {
    alert('Could not rename: network error. Try again.');
    return;
  }
  if (!res.ok) {
    alert('Could not rename: ' + res.status + ' ' + res.statusText);
    return;
  }
  renameDialog.close();
  loadSidebar();
}

// --- Delete confirmation dialog ---
const deleteDialog = document.getElementById('delete-dialog');

document.getElementById('delete-cancel').addEventListener('click', () => deleteDialog.close());
document.getElementById('delete-confirm').addEventListener('click', confirmDelete);

function openDeleteDialog(threadId) {
  deleteDialog.dataset.threadId = threadId;
  deleteDialog.showModal();
}

async function confirmDelete() {
  const threadId = deleteDialog.dataset.threadId;
  let res;
  try {
    res = await fetch('/api/conversations/' + encodeURIComponent(threadId), { method: 'DELETE' });
  } catch (_) {
    alert('Could not delete: network error. Try again.');
    return;
  }
  if (!res.ok) {
    alert('Could not delete: ' + res.status + ' ' + res.statusText);
    return;
  }
  deleteDialog.close();
  if (threadId === sessionId) {
    window.location.href = '/';
  } else {
    loadSidebar();
  }
}

async function loadSidebar() {
  const list = document.getElementById('chat-list');
  try {
    const url = userFilter
      ? '/api/conversations?user=' + encodeURIComponent(userFilter)
      : '/api/conversations';
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) {
      list.innerHTML = '<div class="empty">Could not load chats.</div>';
      return;
    }
    sidebarItems = (await res.json()) || [];
    renderSidebar();
  } catch (e) {
    list.innerHTML = '<div class="empty">Could not load chats.</div>';
  }
}

// Member display-name cache. Populated by loadMembers() so renderMetadata()
// can show a creator's "First Last" instead of an opaque WorkOS user id.
const memberById = new Map();

// Tiny HTML escape — values that flow into innerHTML below come from
// server JSON (branch names, repo, etc.) so we can't trust them
// against angle brackets even though they're constrained at write
// time.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

// extractPRNumber pulls the trailing /pull/<n> segment out of a
// github.com PR URL. Returns null on anything that doesn't match so
// the caller can fall back to showing the full URL.
function extractPRNumber(url) {
  if (!url) return null;
  const m = url.match(/\/pull\/(\d+)(?:[/?#]|$)/);
  return m ? m[1] : null;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

// renderMetadata paints the right-hand sidebar from a conversationDetail
// JSON shape (the same payload loadHistory consumes). Re-entrant —
// safe to call any time the source data changes (e.g. when a live SSE
// run finishes and the PR URL has just been persisted).
function renderMetadata(detail) {
  const host = document.getElementById('meta-content');
  if (!detail) {
    host.innerHTML = '<div class="meta-empty">No chat details yet.</div>';
    return;
  }
  const owner = detail.github_owner || '';
  const repo = detail.github_repo || '';
  const branch = detail.branch || '';
  const prURL = detail.pr_url || '';
  const sandbox = detail.sandbox_id || '';
  const created = fmtDate(detail.created_at || detail.updated_at);

  const repoSlug = (owner && repo) ? owner + '/' + repo : '';
  const repoLink = repoSlug
    ? '<a href="https://github.com/' + esc(repoSlug) + '" target="_blank" rel="noopener">'
        + esc(repoSlug) + '</a>'
    : '<span>—</span>';

  const branchLink = (repoSlug && branch)
    ? '<a href="https://github.com/' + esc(repoSlug) + '/tree/' + encodeURIComponent(branch)
        + '" target="_blank" rel="noopener" class="meta-mono">' + esc(branch) + '</a>'
    : (branch ? '<span class="meta-mono">' + esc(branch) + '</span>' : '<span>—</span>');

  let prCell = '<span>—</span>';
  if (prURL) {
    const num = extractPRNumber(prURL);
    const label = num ? '#' + num : prURL;
    prCell = '<a href="' + esc(prURL) + '" target="_blank" rel="noopener">'
      + esc(label) + '</a><span class="meta-badge">Open</span>';
  }

  const creatorLabel = detail.creator_id
    ? (memberById.get(detail.creator_id) || detail.creator_id)
    : '';

  // Build rows. Each row is wrapped in is-empty class when the value
  // is missing so the dashes look intentionally placeholdered rather
  // than like a layout bug.
  const rows = [
    { label: 'Repo',    html: repoLink,                 empty: !repoSlug },
    { label: 'Branch',  html: branchLink,               empty: !branch },
    { label: 'PR',      html: prCell,                   empty: !prURL },
    { label: 'Sandbox', html: sandbox
        ? '<span class="meta-mono">' + esc(sandbox) + '</span>'
        : '<span>—</span>', empty: !sandbox },
    { label: 'Created by', html: creatorLabel
        ? '<span>' + esc(creatorLabel) + '</span>'
        : '<span>—</span>', empty: !creatorLabel },
    { label: 'Created',  html: created
        ? '<span>' + esc(created) + '</span>'
        : '<span>—</span>', empty: !created },
  ];

  const rowHTML = rows.map(r =>
    '<div class="meta-row' + (r.empty ? ' is-empty' : '') + '">'
    +   '<span class="meta-label">' + esc(r.label) + '</span>'
    +   '<span class="meta-value">' + r.html + '</span>'
    + '</div>'
  ).join('');

  host.innerHTML =
    '<div class="meta-section">'
    +   '<div class="meta-title">Details</div>'
    +   rowHTML
    + '</div>';
}

// Most recent conversationDetail we've seen for this session, kept so
// the post-stream refresh can re-render against the freshest payload
// without forcing a second fetch when nothing has changed.
let lastDetail = null;

async function refreshMetadata() {
  if (isFreshChat) {
    renderMetadata(null);
    return;
  }
  try {
    const res = await fetch('/api/conversations/' + encodeURIComponent(sessionId),
                            { headers: { 'Accept': 'application/json' } });
    if (!res.ok) return;
    const detail = await res.json();
    lastDetail = detail;
    renderMetadata(detail);
  } catch (e) {
    // Leave the previous render in place on transient errors.
  }
}

async function loadHistory(opts) {
  opts = opts || {};
  const skipLastBotResponse = !!opts.skipLastBotResponse;
  // Fresh chat: don't probe the API, just show the welcome state.
  if (isFreshChat) { showEmptyState(); renderMetadata(null); return; }
  try {
    const res = await fetch('/api/conversations/' + encodeURIComponent(sessionId),
                            { headers: { 'Accept': 'application/json' } });
    if (res.status === 404) {
      // Session id is in the URL but no conversation has been persisted yet
      // (e.g. the user opened a fresh URL with ?session= or the agent for a
      // brand-new chat hasn't completed its first turn). Treat as new chat.
      showEmptyState();
      renderMetadata(null);
      return;
    }
    if (!res.ok) return;
    const detail = await res.json();
    lastDetail = detail;
    renderMetadata(detail);
    log.innerHTML = '';
    const history = detail.history || [];
    const turns = detail.response_blocks || [];
    for (let i = 0; i < history.length; i++) {
      addUserMsg(history[i]);
      const isLastTurn = i === history.length - 1;
      // skipLastBotResponse is set when we know a live SSE stream is
      // about to take over rendering for the active turn — leave the
      // user message in place but don't paint the (possibly stale)
      // persisted bot blocks; consumeSSEResponse will paint the
      // authoritative version next.
      if (isLastTurn && skipLastBotResponse) {
        continue;
      }
      const blocks = turns[i] || [];
      const turn = startBotTurn();
      // Reconstruct the live phase grouping from the persisted block
      // sequence. The streamed turn paints the same phase boxes as
      // it goes; replay does it in one shot from the recorded list.
      let phase = null;
      for (const b of blocks) {
        if (b.kind === 'claude_text') {
          if (phase) closePhase(phase);
          phase = openPhase(turn, b.title);
          phase.proseRaw = b.body || '';
          phase.proseEl.innerHTML = renderMarkdown(phase.proseRaw);
        } else if (b.kind === 'tool_use') {
          if (!phase) phase = openPhase(turn, '');
          addToolToPhase(phase, {
            id: b.id, title: b.title, summary: b.summary,
            status: b.status,
          });
        } else {
          if (phase) { closePhase(phase); phase = null; }
          const open = isLastTurn && (b.kind === 'result' || b.kind === 'error');
          renderBlock(turn, b, { open });
        }
      }
      if (phase) closePhase(phase);
    }
    // Honour #block-<id> deep links by expanding + scrolling to the
    // referenced block.
    if (window.location.hash && window.location.hash.startsWith('#block-')) {
      const target = document.getElementById(window.location.hash.slice(1));
      if (target) {
        target.open = true;
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  } catch (e) {
    // Leave the log empty on error; the user can still type a message.
  }
}

// consumeSSEResponse reads a server-sent-event stream from `res` and
// renders blocks into a fresh bot turn. Used by both the original
// POST-/chat send() flow and the GET-/chat/stream reload reattach
// flow — the event shape is identical, only the source URL differs.
//
// onFirstEvent (optional) fires exactly once, the first time we
// successfully parse a payload. send() uses it to refresh the sidebar
// the moment the server confirms work has begun — by then the
// conversation row has been Upserted and the LHN can render the new
// chat without an optimistic placeholder.
async function consumeSSEResponse(res, onFirstEvent) {
  let firstEventFired = false;
  const turn = startBotTurn();
  // blockRefs is the per-id map of "what to do on append/done". Each
  // ref is a tagged shape:
  //   { kind: 'phase-prose', phase }      — claude_text inside a phase
  //   { kind: 'tool',        el, phase }  — tool_use inside a phase
  //   { kind: 'standalone',  el }         — setup/notify/result/error
  // Phase-prose appends update the phase body; tool appends are
  // dropped (the live emitter never fires them); standalone appends
  // go through the original appendToBlock path.
  const blockRefs = new Map();
  // currentPhase is the open phase box accepting new tool_uses. Set
  // when claude_text or the first tool_use opens one; cleared when a
  // standalone block (setup/notify/result/error) starts and closes
  // it.
  let currentPhase = null;
  // lastStandaloneEl is the most recently rendered standalone block
  // (setup, notify, result, error). When the *next* block of any
  // kind starts, we collapse this one so the user always sees the
  // freshest activity expanded — e.g. the long Sandbox setup body
  // tucks itself away when Claude starts streaming its first phase.
  let lastStandaloneEl = null;

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';

  // SSE parser — each event is `event: <name>\n data: <json>\n\n`. We
  // accumulate bytes in `buf` and consume whole frames as they arrive.
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      // SSE comment frames (`: keepalive`) — ignore.
      if (part.startsWith(':')) continue;
      let event = 'message';
      let data = '';
      for (const line of part.split('\n')) {
        if (line.startsWith('event: ')) event = line.slice(7).trim();
        else if (line.startsWith('data: ')) data += (data ? '\n' : '') + line.slice(6);
      }
      if (!data) continue;
      let payload;
      try { payload = JSON.parse(data); } catch (e) { continue; }
      if (!firstEventFired) {
        firstEventFired = true;
        if (onFirstEvent) {
          try { onFirstEvent(); } catch (e) {}
        }
      }
      if (event === 'block_start') {
        // Any new block_start collapses the most recent standalone
        // block (setup / notify / result / error) so the latest
        // activity stays expanded. Phase boxes manage their own
        // collapse via closePhase() below.
        if (lastStandaloneEl) {
          lastStandaloneEl.open = false;
          lastStandaloneEl = null;
        }
        if (payload.kind === 'claude_text') {
          // A new prose chunk starts a fresh phase: collapse the prior
          // phase (if any) and open a new box with this paragraph as
          // the header.
          if (currentPhase) closePhase(currentPhase);
          currentPhase = openPhase(turn, payload.title);
          blockRefs.set(payload.id, { kind: 'phase-prose', phase: currentPhase });
        } else if (payload.kind === 'tool_use') {
          // Tool calls go inside the current phase; if no phase is
          // open (Claude jumped straight to tools without prose),
          // open one with a generic title so the visual treatment
          // stays consistent.
          if (!currentPhase) currentPhase = openPhase(turn, '');
          const el = addToolToPhase(currentPhase, payload);
          blockRefs.set(payload.id, { kind: 'tool', el, phase: currentPhase });
        } else {
          // Standalone block (setup, notify, result, error) — these
          // aren't part of a phase. Close any open phase first so the
          // step count stamps correctly, then render normally.
          if (currentPhase) {
            closePhase(currentPhase);
            currentPhase = null;
          }
          const el = renderBlock(turn, {
            id: payload.id, kind: payload.kind, title: payload.title,
            body: '', status: 'streaming',
          }, { open: true });
          blockRefs.set(payload.id, { kind: 'standalone', el });
          lastStandaloneEl = el;
        }
        log.scrollTop = log.scrollHeight;
      } else if (event === 'block_append') {
        const ref = blockRefs.get(payload.id);
        if (!ref) continue;
        if (ref.kind === 'phase-prose') {
          appendPhaseProse(ref.phase, payload.delta || '');
        } else if (ref.kind === 'standalone') {
          appendToBlock(ref.el, payload.delta || '');
        }
        // tool appends are dropped by the live emitter and never reach here.
      } else if (event === 'block_done') {
        const ref = blockRefs.get(payload.id);
        if (!ref) continue;
        if (ref.kind === 'phase-prose') {
          finishPhaseProse(ref.phase);
        } else if (ref.kind === 'tool') {
          finishBlock(ref.el, payload.status, payload.summary);
        } else if (ref.kind === 'standalone') {
          finishBlock(ref.el, payload.status, payload.summary);
        }
      }
    }
  }
  // The SSE stream closed. Idempotent close for any phase that
  // didn't receive a terminal block to push it closed (defensive —
  // a dropped connection should still produce a clean final state).
  if (currentPhase) closePhase(currentPhase);
}

async function send() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  btn.disabled = true;

  // Capture the validate checkbox state BEFORE addUserMsg runs —
  // addUserMsg removes #empty-state from the DOM (the welcome card
  // disappears as the conversation begins), and the checkbox lives
  // inside that container. Reading after addUserMsg would always
  // return null and silently fall back to "validate=true on the
  // server", regardless of the user's choice.
  const validateBox = document.getElementById('validate-checkbox');
  const validateChoice = validateBox ? validateBox.checked : null;

  const isFirstTurn = log.querySelectorAll('.msg').length === 0;
  addUserMsg(text);

  const payload = { text, session_id: sessionId };
  if (validateChoice !== null) {
    payload.validate = validateChoice;
  }
  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  // The server persists the conversation row at HandleRequest entry —
  // before sandbox creation begins. By the time the first SSE event
  // reaches us the row is committed, so triggering a sidebar refresh on
  // first event surfaces the new chat immediately rather than waiting
  // for the agent to finish (which can take minutes).
  await consumeSSEResponse(res, isFirstTurn ? () => { loadSidebar(); refreshMetadata(); } : null);
  btn.disabled = false;
  inp.focus();
  // Refresh the sidebar after every turn so the row's title (server-side)
  // and ordering (newest activity first) reflect the just-completed turn.
  loadSidebar();
  // Metadata may have changed too — branch + PR URL only land at the
  // end of the first turn, and the agent can re-base subsequent turns.
  refreshMetadata();
}

// Sidebar user filter — populate the <select> with org members and wire up
// the change handler to refresh the conversation list.
// addOption is a small DOM-API helper that avoids innerHTML
// concatenation when the value is a server-supplied identifier — the
// option's value/text never crosses an HTML parser, so escaping bugs
// in user_id can't break out into attribute context.
function addOption(sel, value, text) {
  const opt = document.createElement('option');
  opt.value = value;
  opt.textContent = text;
  sel.appendChild(opt);
}

async function loadMembers() {
  const sel = document.getElementById('user-filter');
  try {
    const res = await fetch('/api/members', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('members fetch failed: ' + res.status);
    const members = (await res.json()) || [];
    sel.innerHTML = '';
    addOption(sel, '', 'All');
    for (const m of members) {
      const label = m.display_name || m.email;
      // Cache the display name so the metadata sidebar can render
      // "Created by First Last" instead of the WorkOS user id.
      memberById.set(m.user_id, label || m.user_id);
      let text;
      if (m.user_id === currentUserID) {
        text = label ? 'Me (' + label + ')' : 'Me';
      } else {
        text = label || m.user_id;
      }
      addOption(sel, m.user_id, text);
    }
    // Members loaded after the metadata may have rendered with raw
    // creator ids — re-paint with the freshly resolved names.
    if (lastDetail) renderMetadata(lastDetail);
  } catch (e) {
    // Network or server error: render a minimal dropdown so the label
    // matches the actual filter state. Without "Me" here, the dropdown
    // would read "All" while the sidebar is in fact scoped to the
    // current user (userFilter defaults to currentUserID), which looks
    // like a bug to anyone trying to widen the view.
    sel.innerHTML = '';
    addOption(sel, '', 'All');
    if (currentUserID) {
      addOption(sel, currentUserID, 'Me');
    }
  }
  // Honor the persisted filter, but if it points at someone who is no
  // longer in the org (or who was never an option here, e.g. typo in
  // localStorage), fall back to the current user. Otherwise the
  // dropdown silently shows blank "All" while loadSidebar() still
  // queries with the stale id and returns an empty list.
  const known = Array.from(sel.options).some(o => o.value === userFilter);
  if (!known) {
    userFilter = currentUserID;
    try { localStorage.setItem(userFilterStorageKey, userFilter); } catch (e) {}
  }
  sel.value = userFilter;
}

document.getElementById('user-filter').addEventListener('change', function () {
  userFilter = this.value;
  try { localStorage.setItem(userFilterStorageKey, userFilter); } catch (e) {}
  loadSidebar();
});

// Metadata sidebar visibility — persisted across reloads so the user's
// preference sticks. Default = visible (matches the screenshot UX
// where the panel is the natural home for branch/PR context).
const metaHiddenStorageKey = 'hetchy.metaHidden';
function applyMetaHidden(hidden) {
  document.body.classList.toggle('meta-hidden', hidden);
  const btn = document.getElementById('meta-toggle');
  btn.setAttribute('aria-pressed', String(!hidden));
}
(function () {
  let hidden = false;
  try { hidden = localStorage.getItem(metaHiddenStorageKey) === '1'; } catch (e) {}
  applyMetaHidden(hidden);
})();
document.getElementById('meta-toggle').addEventListener('click', () => {
  const nowHidden = !document.body.classList.contains('meta-hidden');
  applyMetaHidden(nowHidden);
  try { localStorage.setItem(metaHiddenStorageKey, nowHidden ? '1' : '0'); } catch (e) {}
});

// Avatar dropdown — toggle on click, close on outside-click or Escape.
const userMenuBtn = document.getElementById('user-menu-btn');
const userMenuDrop = document.getElementById('user-menu-dropdown');
function setUserMenuOpen(open) {
  userMenuDrop.hidden = !open;
  userMenuBtn.setAttribute('aria-expanded', String(open));
}
userMenuBtn.addEventListener('click', e => {
  e.stopPropagation();
  setUserMenuOpen(userMenuDrop.hidden);
});
document.addEventListener('click', e => {
  if (!userMenuDrop.hidden && !userMenuDrop.contains(e.target)) setUserMenuOpen(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !userMenuDrop.hidden) {
    setUserMenuOpen(false);
    userMenuBtn.focus();
  }
});

// init paints the sidebar, populates the user filter, and renders the
// chat. On a reload, it first probes /chat/stream to see if a turn
// is currently in flight: if so, it loads persisted prior turns AND
// attaches to the live SSE stream so the user sees the in-progress
// turn updating in real time. If no turn is in flight, it falls
// back to rendering the persisted snapshot.
async function init() {
  loadMembers();
  loadSidebar();

  if (isFreshChat) {
    showEmptyState();
    return;
  }

  let liveRes = null;
  try {
    const r = await fetch('/chat/stream?session=' + encodeURIComponent(sessionId), {
      headers: { 'Accept': 'text/event-stream' },
    });
    if (r.ok) {
      liveRes = r;
    } else if (r.body) {
      // 404 / other — drain so the connection releases promptly.
      try { await r.body.cancel(); } catch (e) {}
    }
  } catch (e) {
    // Network blip — fall back to the persisted snapshot.
  }

  await loadHistory({ skipLastBotResponse: !!liveRes });
  if (liveRes) {
    btn.disabled = true;
    await consumeSSEResponse(liveRes);
    btn.disabled = false;
    inp.focus();
    // Refresh the sidebar so the just-completed turn's metadata
    // (title, ordering) lines up with what the server saved.
    loadSidebar();
    // Branch + PR URL only land at end-of-turn — re-fetch the detail
    // so the right-hand metadata panel picks them up.
    refreshMetadata();
  }
}

init();
</script>
</body>
</html>
