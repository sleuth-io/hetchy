<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hetchy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; display: flex; height: 100vh;
         background: #f5f5f5; color: #1a1a1a; }

  /* Sidebar */
  #sidebar { width: 260px; flex-shrink: 0; background: #fafafa;
             border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; }
  #sidebar-head { padding: .75rem; border-bottom: 1px solid #f0f0f0; }
  .new-chat-btn { display: flex; align-items: center; gap: .5rem; width: 100%;
                  padding: .55rem .75rem; background: #fff; border: 1px solid #e5e5e5;
                  border-radius: .5rem; font-size: .9rem; font-weight: 500;
                  color: #1a1a1a; cursor: pointer; text-decoration: none;
                  text-align: left; }
  .new-chat-btn:hover { background: #f4f4f4; border-color: #d0d0d0; }
  .new-chat-btn .plus { font-size: 1.05rem; line-height: 1; color: #888; }
  #sidebar-section { padding: .75rem .75rem .25rem;
                     font-size: .7rem; font-weight: 600; text-transform: uppercase;
                     letter-spacing: .05em; color: #999; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 .25rem .75rem; }
  #chat-list .empty { padding: .5rem .75rem; font-size: .85rem; color: #999; }
  .chat-item { display: block; padding: .5rem .75rem; margin: 0 .25rem;
               border-radius: .375rem; font-size: .875rem; color: #333;
               text-decoration: none; cursor: pointer;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item:hover { background: #f0f0f0; }
  .chat-item.active { background: #e8f1fc; color: #0b5ec0; }

  /* Main column */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; justify-content: space-between; align-items: center;
            padding: .6rem 1.5rem; background: #fff; border-bottom: 1px solid #ddd; }
  #topbar h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  #topbar .links { display: flex; gap: 1rem; font-size: .85rem; align-items: center; }
  #topbar a { color: #0b93f6; text-decoration: none; }
  #topbar a:hover { text-decoration: underline; }

  #log  { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex;
          flex-direction: column; gap: .75rem; }
  .msg  { max-width: 70%; padding: .6rem 1rem; border-radius: 1rem; line-height: 1.4; }
  .user { align-self: flex-end; background: #0b93f6; color: #fff; border-bottom-right-radius: .25rem; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #ddd;
          border-bottom-left-radius: .25rem; white-space: pre-wrap; }
  #empty-state { margin: auto; text-align: center; color: #888; font-size: .95rem; }
  #empty-state h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: .5rem;
                    color: #333; }
  #bar  { display: flex; gap: .5rem; padding: 1rem; background: #fff;
          border-top: 1px solid #ddd; }
  #inp  { flex: 1; padding: .6rem 1rem; border: 1px solid #ccc; border-radius: 2rem;
          font-size: 1rem; outline: none; }
  #inp:focus { border-color: #0b93f6; }
  button { padding: .6rem 1.2rem; background: #0b93f6; color: #fff; border: none;
           border-radius: 2rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #session-bar { padding: .3rem 1rem; background: #f0f0f0; border-top: 1px solid #ddd;
                 font-size: .75rem; color: #888; font-family: monospace;
                 display: flex; justify-content: space-between; align-items: center; }
  #session-bar a { color: #0b93f6; text-decoration: none; font-family: system-ui, sans-serif; }
  #session-bar a:hover { text-decoration: underline; }
  #session-bar .links { display: flex; gap: 1rem; }

  /* User menu (avatar dropdown) */
  .user-menu { position: relative; margin-left: .25rem; }
  .avatar-btn { background: none; border: 1px solid #e5e5e5; padding: 0;
                border-radius: 50%; cursor: pointer; display: inline-flex;
                line-height: 0; }
  .avatar-btn:hover, .avatar-btn[aria-expanded="true"] { border-color: #0b93f6; }
  .avatar { width: 28px; height: 28px; border-radius: 50%;
            display: block; background: #f0f0f0; }
  .user-menu-dropdown { position: absolute; top: calc(100% + .5rem); right: 0;
                        background: #fff; border: 1px solid #e5e5e5;
                        border-radius: .5rem; box-shadow: 0 8px 24px rgba(0,0,0,.12);
                        min-width: 18rem; padding: .25rem 0; z-index: 50; }
  .user-menu-dropdown[hidden] { display: none; }
  .user-menu-header { display: flex; align-items: center; gap: .75rem;
                      padding: .9rem 1rem; border-bottom: 1px solid #f0f0f0; }
  .user-menu-header .avatar-lg { width: 44px; height: 44px; border-radius: 50%;
                                  background: #f0f0f0; display: block; flex-shrink: 0; }
  .user-menu-header .name { font-weight: 600; font-size: .95rem; color: #1a1a1a;
                            line-height: 1.2; }
  .user-menu-header .email { font-size: .8rem; color: #777; line-height: 1.4; }
  .user-menu-dropdown a.item { display: flex; align-items: center; gap: .6rem;
                                padding: .6rem 1rem; color: #333; font-size: .9rem;
                                text-decoration: none; }
  .user-menu-dropdown a.item:hover { background: #f7f7f7; text-decoration: none; }
  .user-menu-dropdown a.item .ico { width: 1rem; height: 1rem; opacity: .65;
                                     flex-shrink: 0; color: #555; }
  .user-menu-dropdown .divider { border-top: 1px solid #f0f0f0; margin: .25rem 0; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-head">
    <a href="/" class="new-chat-btn" id="new-chat-btn">
      <span class="plus">+</span>
      <span>New chat</span>
    </a>
  </div>
  <div id="sidebar-section">Recents</div>
  <nav id="chat-list">
    <div class="empty">Loading…</div>
  </nav>
</aside>

<div id="main">
<div id="topbar">
  <h1>Hetchy</h1>
  <div class="links">
    <a href="/settings/org">Settings</a>
    <div class="user-menu">
      <button class="avatar-btn" id="user-menu-btn"
              aria-haspopup="menu" aria-expanded="false" aria-label="Open user menu">
        <img class="avatar" src="{{.GravatarURL}}" alt="" referrerpolicy="no-referrer">
      </button>
      <div class="user-menu-dropdown" id="user-menu-dropdown" role="menu" hidden>
        <div class="user-menu-header">
          <img class="avatar-lg" src="{{.GravatarURL}}" alt="" referrerpolicy="no-referrer">
          <div>
            <div class="name">{{.DisplayName}}</div>
            <div class="email">{{.Email}}</div>
          </div>
        </div>
        <a class="item" role="menuitem" href="/settings/profile">
          <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="5.5" r="2.5"/>
            <path d="M3 13.5c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5"/>
          </svg>
          Profile
        </a>
        <div class="divider"></div>
        <a class="item" role="menuitem" href="/logout">
          <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 3.5H5a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 5 12.5h4"/>
            <path d="M11 5.5 13.5 8 11 10.5"/>
            <path d="M6.5 8h7"/>
          </svg>
          Log out
        </a>
      </div>
    </div>
  </div>
</div>
<div id="log"></div>
<div id="bar">
  <input id="inp" placeholder="Describe a feature…" autofocus>
  <button id="btn" onclick="send()">Send</button>
</div>
<div id="session-bar">
  <span>session: <span id="session-label"></span></span>
</div>
</div>

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');

// Read session ID from URL (?session=...) so the page can be reloaded or
// shared to reconnect to an existing sandbox. Generate a new one if absent.
const params = new URLSearchParams(window.location.search);
const isFreshChat = !params.has('session');
const sessionId = params.get('session') || crypto.randomUUID();
if (isFreshChat) {
  const url = new URL(window.location);
  url.searchParams.set('session', sessionId);
  history.replaceState(null, '', url);
}
document.getElementById('session-label').textContent = sessionId;

inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

function addMsg(text, cls) {
  // Replace the empty-state placeholder the first time we add a message
  // so the welcome card disappears as the conversation begins.
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function showEmptyState() {
  log.innerHTML = '';
  const d = document.createElement('div');
  d.id = 'empty-state';
  d.innerHTML = '<h2>Start a new chat</h2><div>Describe a feature, fix, or refactor and Hetchy will open a PR.</div>';
  log.appendChild(d);
}

async function loadSidebar() {
  const list = document.getElementById('chat-list');
  try {
    const res = await fetch('/api/conversations', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) {
      list.innerHTML = '<div class="empty">Could not load chats.</div>';
      return;
    }
    const items = await res.json();
    list.innerHTML = '';
    if (!items || items.length === 0) {
      list.innerHTML = '<div class="empty">No past chats yet.</div>';
      return;
    }
    for (const c of items) {
      const a = document.createElement('a');
      a.className = 'chat-item' + (c.thread_id === sessionId ? ' active' : '');
      a.href = '/?session=' + encodeURIComponent(c.thread_id);
      a.title = c.title;
      a.textContent = c.title;
      list.appendChild(a);
    }
  } catch (e) {
    list.innerHTML = '<div class="empty">Could not load chats.</div>';
  }
}

async function loadHistory() {
  // Fresh chat: don't probe the API, just show the welcome state.
  if (isFreshChat) { showEmptyState(); return; }
  try {
    const res = await fetch('/api/conversations/' + encodeURIComponent(sessionId),
                            { headers: { 'Accept': 'application/json' } });
    if (res.status === 404) {
      // Session id is in the URL but no conversation has been persisted yet
      // (e.g. the user opened a fresh URL with ?session= or the agent for a
      // brand-new chat hasn't completed its first turn). Treat as new chat.
      showEmptyState();
      return;
    }
    if (!res.ok) return;
    const detail = await res.json();
    log.innerHTML = '';
    for (const turn of detail.history || []) {
      addMsg(turn, 'user');
    }
    if (detail.pr_url) {
      addMsg('Done! 🎉 ' + detail.pr_url, 'bot');
    }
  } catch (e) {
    // Leave the log empty on error; the user can still type a message.
  }
}

async function send() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  btn.disabled = true;
  const isFirstTurn = log.querySelectorAll('.msg').length === 0;
  addMsg(text, 'user');
  const bot = addMsg('…', 'bot');

  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, session_id: sessionId })
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  bot.textContent = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      if (part.startsWith('data: ')) {
        bot.textContent += (bot.textContent ? '\n' : '') + JSON.parse(part.slice(6));
        log.scrollTop = log.scrollHeight;
      }
    }
  }
  btn.disabled = false;
  inp.focus();
  // After the first turn finishes, the conversation row exists — refresh
  // the sidebar so the new chat appears in Recents.
  if (isFirstTurn) loadSidebar();
}

// Avatar dropdown — toggle on click, close on outside-click or Escape.
const userMenuBtn = document.getElementById('user-menu-btn');
const userMenuDrop = document.getElementById('user-menu-dropdown');
function setUserMenuOpen(open) {
  userMenuDrop.hidden = !open;
  userMenuBtn.setAttribute('aria-expanded', String(open));
}
userMenuBtn.addEventListener('click', e => {
  e.stopPropagation();
  setUserMenuOpen(userMenuDrop.hidden);
});
document.addEventListener('click', e => {
  if (!userMenuDrop.hidden && !userMenuDrop.contains(e.target)) setUserMenuOpen(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !userMenuDrop.hidden) {
    setUserMenuOpen(false);
    userMenuBtn.focus();
  }
});

// Initial load: paint the sidebar and any existing chat history in parallel.
loadSidebar();
loadHistory();
</script>
</body>
</html>
