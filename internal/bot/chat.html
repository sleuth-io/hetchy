<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hetchy</title>
<!-- Favicon — chunky block "H" echoing the ASCII banner shown in the
     empty state. The data URI comes from web.go's faviconHref helper; JS
     reads link.href at load to derive the badged "done" variant by
     splicing a green dot before the closing </svg>, so the H markup
     never has to be kept in sync between HTML and JS. -->
<link rel="icon" type="image/svg+xml" id="favicon" href="{{faviconHref}}">
<!-- Markdown rendering for bot blocks. DOMPurify sanitizes the HTML
     marked produces — we render server-supplied content (Claude's
     stream-json text, tool inputs/results) and never want raw HTML
     bleeding in. CDN-pinned to specific minor versions so a publish
     can't silently change behaviour. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
// Theme bootstrap — runs before any styles are applied so the page paints
// in the chosen theme on first frame (no flash of light content). The
// preference is determined by (in order): localStorage override, org-level
// theme setting, or "system" as the fallback. Values are "system" | "light"
// | "dark"; "system" follows the OS via prefers-color-scheme. A change in
// either source flips html.is-dark.
(function(){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){
    var pref;
    try { pref = localStorage.getItem('theme'); } catch(e) { pref = null; }
    if (pref === null) {
      pref = '{{.OrgTheme}}' || 'system';
    }
    var dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.classList.toggle('is-dark', dark);
  }
  apply();
  mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if (e.key === 'theme') apply(); });
})();
// Metadata-sidebar visibility bootstrap — same FOUC rationale as the
// theme bootstrap above. Without this, body paints with the 280px
// sidebar visible, then the inline IIFE further down runs and snaps
// it away on reloads where the user previously hid it. Setting the
// class on <html> before any styles apply paints the right layout
// on the first frame.
//
// On phone-sized viewports the panel becomes a fixed overlay (see the
// @media block in the stylesheet) — defaulting to hidden there keeps
// first-time mobile visitors from landing on a screen the slide-in
// panel has fully covered.
(function(){
  try {
    var pref = localStorage.getItem('hetchy.metaHidden');
    var mobile = window.matchMedia('(max-width: 768px)').matches;
    if (pref === '1' || (pref === null && mobile)) {
      document.documentElement.classList.add('meta-hidden');
    }
  } catch (e) {}
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; display: flex; height: 100vh;
         background: #f5f5f5; color: #1a1a1a; }

  /* Sidebar */
  #sidebar { width: 260px; flex-shrink: 0; background: #fafafa;
             border-right: 1px solid #e5e5e5; display: flex; flex-direction: column;
             min-height: 0; }
  #sidebar-head { padding: .75rem; border-bottom: 1px solid #f0f0f0; }
  .new-chat-btn { display: flex; align-items: center; gap: .5rem; width: 100%;
                  padding: .55rem .75rem; background: #fff; border: 1px solid #e5e5e5;
                  border-radius: .5rem; font-size: .9rem; font-weight: 500;
                  color: #1a1a1a; cursor: pointer; text-decoration: none;
                  text-align: left; }
  .new-chat-btn:hover { background: #f4f4f4; border-color: #d0d0d0; }
  .new-chat-btn .plus { font-size: 1.05rem; line-height: 1; color: #888; }
  #sidebar-filter { padding: .5rem .75rem .25rem; display: flex;
                    flex-direction: row; align-items: center; gap: .35rem; }
  #user-filter { flex: 1; min-width: 0; padding: .3rem .5rem; border: 1px solid #e5e5e5;
                 border-radius: .375rem; font-size: .8rem; font-family: inherit;
                 background: #fff; color: #333; cursor: pointer; outline: none; }
  #user-filter:focus { border-color: #0b93f6; }
  #search-toggle { flex-shrink: 0; display: inline-flex; align-items: center;
                   justify-content: center; width: 1.75rem; height: 1.75rem;
                   padding: 0; background: none; border: 1px solid #e5e5e5;
                   border-radius: .375rem; color: #666; cursor: pointer;
                   line-height: 0; }
  #search-toggle:hover { background: #f0f0f0; border-color: #d0d0d0; }
  #sidebar-filter.is-searching #search-toggle { background: #e8f1fc;
    border-color: #cfe2f8; color: #0b5ec0; }
  #chat-search { flex: 1; min-width: 0; padding: .3rem .5rem; border: 1px solid #e5e5e5;
                 border-radius: .375rem; font-size: .8rem; font-family: inherit;
                 background: #fff; color: #333; outline: none; display: none; }
  #chat-search:focus { border-color: #0b93f6; }
  #sidebar-filter.is-searching #user-filter { display: none; }
  #sidebar-filter.is-searching #chat-search { display: block; }
  /* WebKit renders a built-in clear "x" inside type=search fields.
     Default cursor is the I-beam (because the field accepts text);
     this rule swaps it for a pointer so the affordance reads as a
     button. No layout change. */
  #chat-search::-webkit-search-cancel-button { cursor: pointer; }
  #chat-list-more { padding: .35rem .75rem .85rem; }
  #chat-list-more[hidden] { display: none; }
  #chat-list-more-btn { width: 100%; padding: .45rem .6rem; background: #fff;
                        border: 1px solid #e5e5e5; border-radius: .35rem;
                        font-size: .8rem; font-family: inherit; color: #555;
                        cursor: pointer; }
  #chat-list-more-btn:hover { background: #f0f0f0; border-color: #d0d0d0; }
  #chat-list-more-btn:disabled { opacity: .55; cursor: default;
                                  background: #fafafa; }
  #sidebar-section { padding: .35rem .75rem .25rem;
                     font-size: .7rem; font-weight: 600; text-transform: uppercase;
                     letter-spacing: .05em; color: #999; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 .25rem .75rem; }
  #chat-list .empty { padding: .5rem .75rem; font-size: .85rem; color: #999; }
  .chat-item-wrap { position: relative; display: flex; align-items: center;
                    margin: 0 .25rem; border-radius: .375rem; }
  .chat-item-wrap:hover { background: #f0f0f0; }
  .chat-item-wrap.wrap-active { background: #e8f1fc; }
  .chat-item { flex: 1; min-width: 0; display: block; padding: .5rem .75rem;
               font-size: .875rem; color: #333; text-decoration: none; cursor: pointer;
               white-space: nowrap; overflow: hidden;
               -webkit-mask-image: linear-gradient(to right, black calc(100% - 2rem), transparent 100%);
               mask-image: linear-gradient(to right, black calc(100% - 2rem), transparent 100%);
               background: none; border-radius: 0; }
  .chat-item:hover { background: none; }
  .chat-item.active { background: none; color: #0b5ec0; }
  .chat-menu-btn { position: absolute; right: 0; top: 0; bottom: 0;
                   display: flex; align-items: center;
                   padding: 0 .4rem 0 1.2rem;
                   background: linear-gradient(to right, transparent, #fafafa 40%);
                   border: 0; color: #666; cursor: pointer;
                   font-size: 1rem; line-height: 1; font-family: inherit;
                   opacity: 0; pointer-events: none; }
  .chat-item-wrap:hover .chat-menu-btn { background: linear-gradient(to right, transparent, #f0f0f0 40%);
                                          opacity: 1; pointer-events: auto; }
  .chat-item-wrap.wrap-active .chat-menu-btn { background: linear-gradient(to right, transparent, #e8f1fc 40%); }
  .chat-menu-btn[aria-expanded="true"] { opacity: 1; pointer-events: auto; }

  /* Chat item context-menu dropdown — rendered into <body> as fixed-position */
  .chat-menu-drop { position: fixed; z-index: 200; background: #fff;
                    border: 1px solid #e5e5e5; border-radius: .4rem;
                    box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: .25rem 0;
                    min-width: 130px; }
  .chat-menu-drop[hidden] { display: none; }
  .chat-menu-drop-item { display: block; width: 100%; padding: .45rem .85rem;
                         text-align: left; background: none; border: 0;
                         border-radius: 0; cursor: pointer; font-family: inherit;
                         font-size: .83rem; color: #333; }
  .chat-menu-drop-item:hover { background: #f5f5f5; }
  .chat-menu-drop-item.danger { color: #c0392b; }
  .chat-menu-drop-item.danger:hover { background: #fff0ee; }

  /* Rename / delete dialogs */
  dialog.chat-dialog { border: none; border-radius: .55rem; padding: 0; margin: auto;
                        box-shadow: 0 16px 48px rgba(0,0,0,.22); max-width: 26rem;
                        width: 90vw; background: #fff; color: #1a1a1a; }
  dialog.chat-dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog.chat-dialog .dlg-body { padding: 1.25rem 1.25rem 1rem; }
  dialog.chat-dialog h3 { margin: 0 0 .75rem; font-size: 1rem; font-weight: 600; }
  dialog.chat-dialog p { margin: 0 0 .75rem; font-size: .875rem; color: #555; }
  dialog.chat-dialog input[type="text"] { width: 100%; padding: .5rem .65rem;
    border: 1px solid #d0d0d0; border-radius: .4rem; font-size: .9rem;
    font-family: inherit; outline: none; }
  dialog.chat-dialog input[type="text"]:focus { border-color: #0b93f6; }
  dialog.chat-dialog .dlg-actions { display: flex; justify-content: flex-end;
                                     gap: .5rem; padding: .85rem 1.25rem; }
  dialog.chat-dialog .dlg-cancel { padding: .5rem 1rem; background: #f3f3f3;
    color: #333; border: 1px solid #d8d8d8; border-radius: .4rem; cursor: pointer;
    font-size: .875rem; font-family: inherit; }
  dialog.chat-dialog .dlg-cancel:hover { background: #ebebeb; }
  dialog.chat-dialog .dlg-save { padding: .5rem 1rem; background: #0b93f6;
    color: #fff; border: 0; border-radius: .4rem; cursor: pointer;
    font-size: .875rem; font-family: inherit; }
  dialog.chat-dialog .dlg-save:hover { background: #0a83d8; }
  dialog.chat-dialog .dlg-delete { padding: .5rem 1rem; background: #c0392b;
    color: #fff; border: 0; border-radius: .4rem; cursor: pointer;
    font-size: .875rem; font-family: inherit; }
  dialog.chat-dialog .dlg-delete:hover { background: #a93226; }

  /* Main column */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Top bar across the chat column. Holds the toggle for the right-hand
     metadata panel; nothing else lives here yet so it stays slim. */
  #main-top { display: flex; align-items: center; justify-content: flex-end;
              padding: .5rem .75rem; border-bottom: 1px solid #ececec;
              background: #fafafa; min-height: 2.5rem; }
  #meta-toggle { display: inline-flex; align-items: center; justify-content: center;
                 padding: .35rem; background: none; border: 1px solid transparent;
                 border-radius: .35rem; color: #555; cursor: pointer;
                 line-height: 0; }
  #meta-toggle:hover { background: #efefef; border-color: #e0e0e0; }
  #meta-toggle[aria-pressed="true"] { background: #e8f1fc; border-color: #cfe2f8;
                                       color: #0b5ec0; }
  #meta-toggle svg { width: 1rem; height: 1rem; }

  #log  { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex;
          flex-direction: column; gap: .75rem; }
  .msg  { max-width: 70%; padding: .6rem 1rem; border-radius: 1rem; line-height: 1.4; }
  .user { align-self: flex-end; background: #0b93f6; color: #fff; border-bottom-right-radius: .25rem; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #ddd;
          border-bottom-left-radius: .25rem; white-space: pre-wrap; }
  #empty-state { margin: auto; text-align: center; color: #888; font-size: .95rem; }
  .empty-brand { display: inline-block; text-align: center; }
  .empty-ascii { font-family: monospace; font-size: .6rem; line-height: 1.2;
                 color: #0b93f6; margin: 0; display: block;
                 text-align: left; white-space: pre; }
  .empty-tagline { margin-top: .45rem; font-size: .78rem; color: #7aaedf; }
  #bar  { padding: 1rem; background: #fff; border-top: 1px solid #ddd;
          position: relative; }
  #composer { width: min(100%, 54rem); margin: 0 auto; padding: .75rem;
              display: flex; flex-direction: column; gap: .55rem;
              background: #fff; border: 1px solid #d7d7dc;
              border-radius: 1.15rem; box-shadow: 0 1px 2px rgba(0,0,0,.04);
              min-width: 0; }
  #composer:focus-within { border-color: #0b93f6; }
  #inp  { width: 100%; padding: .15rem .2rem; border: 0; background: transparent;
          color: #1a1a1a; font-size: 1rem; outline: none;
          font-family: inherit; line-height: 1.4; resize: none;
          overflow-y: hidden; max-height: 16rem;
          /* Match line-height so a single empty textarea renders at the same
             height as the previous single-line input — no jump on focus. */
          min-height: 1.4em; }
  #composer-controls { display: flex; align-items: center;
                       justify-content: space-between; gap: .75rem; }
  #composer-actions { display: flex; align-items: center; gap: .5rem; }
  button { padding: .6rem 1.2rem; background: #0b93f6; color: #fff; border: none;
           border-radius: 2rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #tools-picker, #model-picker { position: relative; flex-shrink: 0; }
  #tools-btn { width: 2rem; height: 2rem; padding: 0; display: inline-flex;
               align-items: center; justify-content: center; border-radius: 50%;
               border: 1px solid transparent; background: transparent; color: #777;
               line-height: 0; }
  #tools-btn svg { width: 1rem; height: 1rem; stroke-width: 1.6; display: block; }
  #tools-btn:hover, #tools-btn[aria-expanded="true"] { background: #f2f2f4;
                                                       border-color: #d8d8dd; }
  #tools-btn.has-agent { color: #0b5ec0; background: #f3f8ff; border-color: #cfe2f8; }
  .composer-popover { position: absolute; bottom: calc(100% + .5rem);
                      padding: .35rem; background: #fff; border: 1px solid #ddd;
                      border-radius: .6rem; box-shadow: 0 10px 28px rgba(0,0,0,.14);
                      z-index: 70; }
  .composer-popover[hidden] { display: none; }
  #tools-popover { left: 0; width: min(17rem, calc(100vw - 2rem)); }
  #model-popover { right: 0; width: min(16rem, calc(100vw - 2rem)); }
  .model-popover-title { padding: .45rem .55rem .35rem;
                         font-size: .72rem; font-weight: 600;
                         text-transform: uppercase; letter-spacing: .05em;
                         color: #777; }
  .tools-menu-item { width: 100%; min-height: 2.45rem; padding: .55rem .65rem;
                     border: 0; border-radius: .45rem; background: transparent;
                     color: #222; display: flex; align-items: center; gap: .6rem;
                     text-align: left; font: inherit; }
  .tools-menu-item:hover,
  .tools-menu-item[aria-expanded="true"] { background: #f2f6fb; }
  .tools-menu-icon { width: 1rem; height: 1rem; flex-shrink: 0; color: #777; }
  .tools-menu-main { flex: 1; min-width: 0; display: flex; align-items: center;
                     justify-content: space-between; gap: .75rem; }
  .tools-menu-label { font-size: .88rem; font-weight: 500; color: #222; }
  .tools-menu-value { font-size: .86rem; color: #777; line-height: 1.25;
                      text-align: right;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools-chevron { color: #888; font-size: 1rem; line-height: 1; }
  .tools-divider { border-top: 1px solid #ececf0; margin: .35rem -.35rem; }
  #agent-flyout-root { position: relative; }
  #agent-popover { left: calc(100% + .45rem); top: auto; bottom: 0;
                   width: min(21rem, calc(100vw - 2rem));
                   max-height: min(22rem, calc(100vh - 2rem));
                   overflow-y: auto; }
  .tools-checkbox-row { position: relative; cursor: pointer; user-select: none; color: #222; }
  .tools-checkbox-row.is-checked { color: #0b93f6; }
  .tools-checkbox-row .tools-menu-label { flex: 1; }
  .tools-checkbox-row input { position: absolute; opacity: 0; pointer-events: none; }
  .tools-checkbox-row .tools-menu-icon,
  .tools-checkbox-row .tools-menu-label { color: inherit; }
  .tools-checkmark { width: 1rem; flex-shrink: 0; color: #0b93f6;
                     font-size: .95rem; line-height: 1; text-align: center;
                     opacity: 0; }
  .tools-checkbox-row input:checked ~ .tools-checkmark { opacity: 1; }
  .agent-choice { width: 100%; padding: .55rem .65rem; border: 0;
                  border-radius: .45rem; background: transparent; color: #222;
                  text-align: left; display: flex; flex-direction: column; gap: .18rem;
                  font: inherit; }
  .agent-choice:hover, .agent-choice.is-selected { background: #f2f6fb; }
  .agent-choice-name { font-size: .88rem; font-weight: 500; }
  .agent-choice-desc { font-size: .76rem; color: #777; line-height: 1.3; }
  #model-btn { height: 2rem; min-width: 5.7rem; padding: 0 .65rem;
               display: inline-flex; align-items: center; justify-content: center;
               gap: .35rem; border: 1px solid #d7d7dc; border-radius: .6rem;
               background: #f7f7f8; color: #222; font-size: .88rem; }
  #model-btn:hover, #model-btn[aria-expanded="true"] { background: #f0f0f2;
                                                       border-color: #c8c8ce; }
  #model-btn .chevron { width: .85rem; height: .85rem; color: #777;
                        stroke-width: 1.8; display: block; }
  .model-choice { width: 100%; padding: .55rem .65rem; border: 0;
                  border-radius: .45rem; background: transparent; color: #222;
                  text-align: left; display: grid; grid-template-columns: 1fr auto;
                  gap: .15rem .5rem; font: inherit; }
  .model-choice:hover, .model-choice.is-selected { background: #f2f6fb; }
  .model-choice-name { font-size: .88rem; font-weight: 500; }
  .model-choice-desc { grid-column: 1 / 2; font-size: .76rem; color: #777; line-height: 1.3; }
  .model-check { grid-column: 2; grid-row: 1 / span 2; align-self: center;
                 color: #0b5ec0; font-size: .9rem; }
  #btn { width: 2rem; height: 2rem; padding: 0; border-radius: .6rem;
         display: inline-flex; align-items: center; justify-content: center;
         line-height: 0; }
  #btn svg { width: 1rem; height: 1rem; stroke-width: 2.2; display: block; }
  #btn .stop-icon { display: none; }
  #btn.is-stop .send-icon { display: none; }
  #btn.is-stop .stop-icon { display: block; }

  /* Right-side metadata sidebar — surfaces what we know about the chat
     (repo, branch, PR, sandbox, creator). Hidden when the user toggles
     it off via #meta-toggle (state persisted in localStorage). */
  #meta-sidebar { width: 280px; flex-shrink: 0; background: #fafafa;
                  border-left: 1px solid #e5e5e5; display: flex;
                  flex-direction: column; min-height: 0; overflow-y: auto; }
  html.meta-hidden #meta-sidebar { display: none; }
  .meta-section { padding: .85rem 1rem; border-bottom: 1px solid #f0f0f0; }
  .meta-section:last-child { border-bottom: 0; }
  .meta-title { font-size: .7rem; font-weight: 600; text-transform: uppercase;
                letter-spacing: .05em; color: #888; margin-bottom: .55rem; }
  .meta-row { display: flex; gap: .5rem; align-items: baseline;
              padding: .25rem 0; font-size: .82rem; }
  .meta-row .meta-label { width: 5.5rem; flex-shrink: 0; color: #777; }
  .meta-row .meta-value { flex: 1; min-width: 0; color: #1a1a1a;
                          overflow-wrap: anywhere; }
  .meta-row .meta-value a { color: #0b5ec0; text-decoration: none; }
  .meta-row .meta-value a:hover { text-decoration: underline; }
  .meta-row.is-empty .meta-value { color: #b8b8b8; }
  .meta-empty { padding: 1rem; font-size: .82rem; color: #888;
                text-align: center; }
  .meta-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: .78rem; }

  /* User menu — sidebar footer with click-to-open popup */
  .user-menu { position: relative; border-top: 1px solid #f0f0f0;
               margin-top: auto; padding-bottom: .75rem; }
  /* border-radius is set explicitly because the global `button` rule
     (used by the chat Send button) gives all <button>s a 2rem pill
     radius; without this override the hover highlight would round off
     instead of filling the full sidebar width. */
  .user-menu-trigger { display: flex; align-items: center; gap: .6rem;
                       width: 100%; padding: .65rem .75rem; background: none;
                       border: 0; border-radius: 0; cursor: pointer;
                       text-align: left; font-family: inherit;
                       font-size: .9rem; color: #1a1a1a; }
  .user-menu-trigger:hover, .user-menu-trigger[aria-expanded="true"] { background: #f0f0f0; }
  .user-menu-trigger .name { flex: 1; min-width: 0; font-weight: 500;
                             white-space: nowrap; overflow: hidden;
                             text-overflow: ellipsis; }
  .avatar { width: 28px; height: 28px; border-radius: 50%;
            display: block; background: #f0f0f0; flex-shrink: 0; }
  .user-menu-dropdown { position: absolute; bottom: calc(100% + .35rem); left: .5rem;
                        right: .5rem; background: #fff; border: 1px solid #e5e5e5;
                        border-radius: .5rem; box-shadow: 0 8px 24px rgba(0,0,0,.12);
                        padding: .25rem 0; z-index: 50; }
  .user-menu-dropdown[hidden] { display: none; }
  .user-menu-header { display: flex; align-items: center; gap: .75rem;
                      padding: .75rem .85rem; border-bottom: 1px solid #f0f0f0; }
  .user-menu-header .avatar-lg { width: 36px; height: 36px; border-radius: 50%;
                                  background: #f0f0f0; display: block; flex-shrink: 0; }
  .user-menu-header .name { font-weight: 600; font-size: .9rem; color: #1a1a1a;
                            line-height: 1.2; white-space: nowrap;
                            overflow: hidden; text-overflow: ellipsis; }
  .user-menu-header .email { font-size: .75rem; color: #777; line-height: 1.4;
                             white-space: nowrap; overflow: hidden;
                             text-overflow: ellipsis; }
  .user-menu-header > div { min-width: 0; }
  .user-menu-dropdown a.item { display: flex; align-items: center; gap: .6rem;
                                padding: .55rem .85rem; color: #333; font-size: .85rem;
                                text-decoration: none; }
  .user-menu-dropdown a.item:hover { background: #f7f7f7; text-decoration: none; }
  .user-menu-dropdown a.item .ico { width: 1rem; height: 1rem; opacity: .65;
                                     flex-shrink: 0; color: #555; }
  .user-menu-dropdown .divider { border-top: 1px solid #f0f0f0; margin: .25rem 0; }

  /* Block-style bot messages. The bot's per-turn output is a sequence
     of typed Blocks (sandbox setup, claude_text, tool_use, notify,
     result, error). Each block renders as a <details> element that
     auto-collapses when the next one starts; the active streaming
     block stays open. */
  /* Fixed-width container so the block stack doesn't jump around as
     content streams in and blocks open/close. The blocks inside (which
     are <details> elements, block-level by default) stretch to fill
     this width, keeping every row the same size regardless of which
     block is currently widest. Pinned to the left at 80% so bot turns
     read as a response distinct from the right-aligned user bubble. */
  .bot-turn { display: flex; flex-direction: column; gap: .35rem;
              align-self: flex-start; width: 80%; min-width: 0; }
  .blk { border: 1px solid #e2e2e6; border-radius: .55rem; background: #fff;
         overflow: hidden; transition: border-color .15s; }
  .blk[open] { border-color: #c8c8cc; }
  .blk > summary { display: flex; align-items: center; gap: .5rem;
                   padding: .45rem .75rem; cursor: pointer; user-select: none;
                   font-size: .82rem; color: #444; list-style: none; }
  .blk > summary::-webkit-details-marker { display: none; }
  .blk > summary .caret { color: #999; font-size: .7rem; width: .8rem;
                          display: inline-block; text-align: center;
                          transition: transform .15s; }
  .blk[open] > summary .caret { transform: rotate(90deg); }
  .blk > summary .blk-icon { font-size: .9rem; line-height: 1;
                             flex-shrink: 0; width: 1rem; text-align: center; }
  .blk > summary .blk-title { flex: 1; min-width: 0; font-weight: 500;
                              white-space: nowrap; overflow: hidden;
                              text-overflow: ellipsis; }
  .blk > summary .blk-summary { color: #888; font-weight: 400;
                                font-size: .75rem; flex-shrink: 0; }
  .blk.blk-live-heartbeat > summary .blk-summary { color: #0b93f6; }
  /* Block start time + total execution duration. Both sit right of
     the summary, kept dim and monospace-ish so the column reads as
     metadata rather than content. The :empty rule on each lets older
     persisted blocks predating the field render unchanged. */
  .blk > summary .blk-time,
  .blk > summary .blk-duration { color: #999; font-weight: 400;
                                  font-size: .72rem; flex-shrink: 0;
                                  font-variant-numeric: tabular-nums; }
  .blk > summary .blk-time:empty,
  .blk > summary .blk-duration:empty { display: none; }
  /* One-shot status blocks (notify/result/error kinds emitted via
     liveEmitter.oneShot) wrap no processing, so the elapsed chip is
     always ~0ms — hide it. Keyed off blk-oneshot rather than the
     per-kind class so a tool_use / setup / phase that finishes in
     error status (which adds blk-kind-error to *any* block) still
     keeps its duration — that's exactly when "took 30s before
     failing" is most useful. */
  .blk-oneshot > summary .blk-duration { display: none; }
  .blk-body { padding: .5rem .85rem .8rem; font-size: .88rem;
              line-height: 1.5; color: #1a1a1a; }
  .blk-body p { margin: .35rem 0; }
  .blk-body p:first-child { margin-top: 0; }
  .blk-body p:last-child { margin-bottom: 0; }
  .blk-body pre { background: #f3f3f5; border: 1px solid #e6e6ea;
                  border-radius: .35rem; padding: .5rem .65rem;
                  overflow-x: auto; font-size: .8rem; line-height: 1.4;
                  margin: .35rem 0; }
  .blk-body code { background: #f0f0f3; border-radius: .25rem;
                   padding: 0 .2rem; font-size: .85em; }
  .blk-body pre code { background: transparent; padding: 0; font-size: 1em; }
  .blk-body a { color: #0b5ec0; }
  .blk-body ul, .blk-body ol { margin: .35rem 0 .35rem 1.25rem; }

  /* Per-kind accents on the icon column. */
  .blk-kind-setup       > summary .blk-icon { color: #888; }
  .blk-kind-notify      > summary .blk-icon { color: #0b93f6; }
  .blk-kind-claude_text > summary .blk-icon { color: #6b46c1; }
  .blk-kind-tool_use    > summary .blk-icon { color: #2b8a3e; }
  .blk-kind-result      > summary .blk-icon { color: #2b8a3e; }
  .blk-kind-error       > summary .blk-icon { color: #c0392b; }
  .blk-kind-error       { border-color: #f4b6ad; }
  .blk-kind-result      { border-color: #b6e0c4; }

  /* Tool-use blocks render as compact one-line log rows (matching
     Claude Code's terminal `● Read(file.go) — 287 lines` style). The
     web emitter drops the streamed body for tool_use, so the body
     div stays empty and we hide it; the caret is removed and the
     summary cursor is default to make the row visually inert. */
  .blk-kind-tool_use { border-color: transparent; background: transparent;
                        border-radius: 0; }
  .blk-kind-tool_use > summary { padding: .2rem .25rem; cursor: default; }
  .blk-kind-tool_use > summary .caret { display: none; }
  .blk-kind-tool_use > .blk-body { display: none; }
  /* Failed tools surface the truncated error in the summary slot —
     bump it so it's not dim like a happy-path "287 lines". */
  .blk-kind-tool_use.blk-kind-error > summary .blk-summary {
    color: #c0392b; font-weight: 500;
  }

  /* "Phase" boxes group a Claude prose paragraph with the tool calls
     it triggered. The box header carries the prose's first line as a
     scannable title; the body shows the full prose (when there's more
     than one line) followed by the tool one-liners. When the next
     phase or a terminal block starts, the previous phase collapses
     and its right-side summary updates with the step count. */
  .blk-kind-phase > summary .blk-icon { color: #6b46c1; }
  .blk-kind-phase > .blk-body { padding: .35rem .85rem .65rem; }
  .phase-prose { font-size: .9rem; line-height: 1.5; color: #1a1a1a; }
  .phase-prose:empty { display: none; }
  .phase-prose p { margin: .25rem 0; }
  .phase-prose p:first-child { margin-top: 0; }
  .phase-prose p:last-child { margin-bottom: 0; }
  .phase-prose code { background: #f0f0f3; border-radius: .25rem;
                      padding: 0 .2rem; font-size: .85em; }
  .phase-prose a { color: #0b5ec0; }
  .phase-tools { margin-top: .25rem; }
  .phase-tools:empty { margin-top: 0; }


  /* Spinner for blocks that are actively receiving content, or are
     the latest one-shot status while the run is still waiting on the
     next visible event. */
  .blk-streaming > summary .blk-icon::after,
  .blk-awaiting-next > summary .blk-icon::after {
    content: ''; display: inline-block; width: .75rem; height: .75rem;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: blk-spin .7s linear infinite;
    vertical-align: -.15em;
  }
  .blk-streaming > summary .blk-icon,
  .blk-awaiting-next > summary .blk-icon { color: #888; }
  .blk-streaming > summary .blk-icon > *,
  .blk-awaiting-next > summary .blk-icon > * { display: none; }
  @keyframes blk-spin { to { transform: rotate(360deg); } }

  /* Dark theme — applied via html.is-dark by the bootstrap script. Kept
     as overrides on top of the light defaults so the light path stays
     untouched and either rule set is easy to find when tweaking colors. */
  html { color-scheme: light; }
  html.is-dark { color-scheme: dark; }
  html.is-dark body { background: #18181b; color: #e7e7e9; }

  html.is-dark .blk-kind-error  { border-color: #6b2a23; }
  html.is-dark .blk-kind-result { border-color: #265a3a; }
  html.is-dark .blk-kind-tool_use { background: transparent; border-color: transparent; }
  html.is-dark .blk-kind-tool_use.blk-kind-error > summary .blk-summary { color: #f87171; }
  html.is-dark .phase-prose { color: #e7e7e9; }
  html.is-dark .phase-prose code { background: #2a2a2e; }

                           box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  html.is-dark #composer:focus-within { border-color: #7dc4ff; }

  /* Sidebar toggle — hidden on desktop, visible on mobile to slide
     #sidebar in. The button styling mirrors #meta-toggle so the two
     header controls match. */
  #sidebar-toggle { display: none; align-items: center; justify-content: center;
                    padding: .35rem; background: none; border: 1px solid transparent;
                    border-radius: .35rem; color: #555; cursor: pointer;
                    line-height: 0; }
  #sidebar-toggle:hover { background: #efefef; border-color: #e0e0e0; }
  #sidebar-toggle svg { width: 1.1rem; height: 1.1rem; }
  html.is-dark #sidebar-toggle { color: #c4c4c8; }
  html.is-dark #sidebar-toggle:hover { background: #2a2a2e; border-color: #3a3a40; }

  /* Scrim behind sidebar/meta overlays on mobile. display:none on
     desktop and when neither panel is open. */
  #overlay-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.38);
                   z-index: 90; display: none; }
  #overlay-scrim[hidden] { display: none; }

  /* ----- Mobile (<= 768px) ------------------------------------------
     Three structural changes:
       1. Sidebar slides in from the left as a fixed overlay, gated by
          html.sidebar-open. Toggled via #sidebar-toggle in #main-top.
       2. Meta sidebar slides in from the right as a fixed overlay,
          gated by html:not(.meta-hidden). The head bootstrap forces
          meta-hidden on first mobile visit so the panel doesn't take
          over the screen before the user has interacted.
       3. Composer + messages widen to use the available column and
          drop excess padding so input is the priority.
     The scrim (#overlay-scrim) is shown by JS whenever either panel
     is open and dismisses both on click.
  */
  @media (max-width: 768px) {
    /* Don't let the body itself scroll; #log and the sidebar lists own
       their own scrollable regions. Lock height to viewport height so
       mobile browser chrome doesn't cause the layout to jitter. */
    body { height: 100vh; height: 100dvh; overflow: hidden; }

    #sidebar-toggle { display: inline-flex; }
    #main-top { justify-content: space-between; padding: .5rem .65rem; }

    #sidebar { position: fixed; top: 0; left: 0; bottom: 0;
               width: min(85%, 320px); z-index: 100;
               box-shadow: 8px 0 24px rgba(0,0,0,.18);
               transform: translateX(-100%);
               transition: transform .22s ease; }
    html.sidebar-open #sidebar { transform: translateX(0); }

    /* Meta sidebar overlays from the right when toggled on. Default is
       hidden via the html.meta-hidden class (set by the head
       bootstrap on first mobile visit). */
    #meta-sidebar { position: fixed; top: 0; right: 0; bottom: 0;
                    width: min(85%, 320px); z-index: 100;
                    box-shadow: -8px 0 24px rgba(0,0,0,.18);
                    transform: translateX(100%);
                    transition: transform .22s ease;
                    display: flex; }
    html:not(.meta-hidden) #meta-sidebar { transform: translateX(0); }
    /* Override the desktop "display:none" rule for meta-hidden so the
       slide-out transition still runs. The transform keeps it
       off-screen visually. */
    html.meta-hidden #meta-sidebar { display: flex; }

    /* Show the scrim whenever either overlay is open. */
    html.sidebar-open #overlay-scrim,
    html:not(.meta-hidden) #overlay-scrim { display: block; }

    /* Roomier message bubbles + bot-turn so chat reads on a narrow
       column without becoming a stack of skinny boxes. */
    #log { padding: 1rem .75rem; gap: .65rem; }
    .msg { max-width: 92%; }
    .bot-turn { width: 100%; }
    #bar { padding: .65rem; }
    #composer { padding: .55rem; border-radius: 1rem; }
    #composer-controls { gap: .5rem; }
    #composer-actions { gap: .35rem; }
    #model-btn { min-width: 4.8rem; padding: 0 .5rem; font-size: .82rem; }

    /* Empty-state ASCII art is wider than a phone — scale it down so
       it still fits in the centered card without horizontal scroll. */
    .empty-ascii { font-size: .45rem; }

    /* Composer popovers — pin to the viewport so they don't overflow
       a 360px screen. */
    #tools-popover, #model-popover { width: min(18rem, calc(100vw - 1.5rem)); }
    #tools-popover { left: 0; }
    #model-popover { right: 0; }
    /* The agent flyout normally pops to the right of the tools
       menu; on a phone it would shoot off-screen, so anchor it back
       under the tools menu instead. */
    #agent-popover { left: 0; right: auto; top: 100%; bottom: auto;
                     width: min(18rem, calc(100vw - 1.5rem));
                     max-height: min(20rem, 60vh); }
  }

  /* Phone-portrait niceties — shave a bit more padding so the
     composer + first user bubble both fit above the keyboard. */
  @media (max-width: 480px) {
    #log { padding: .75rem .5rem; }
    .msg { max-width: 95%; padding: .5rem .8rem; border-radius: .9rem; }
    #bar { padding: .5rem .5rem .65rem; }
    #composer { padding: .45rem .55rem; }
    #empty-state { font-size: .85rem; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-head">
    <a href="/" class="new-chat-btn" id="new-chat-btn">
      <span class="plus">+</span>
      <span>New chat</span>
    </a>
  </div>
  <div id="sidebar-filter">
    <select id="user-filter" aria-label="Filter chats by user">
      <option value="">All</option>
    </select>
    <button id="search-toggle" type="button" aria-label="Search chats" title="Search chats" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
    </button>
    <input id="chat-search" type="search" placeholder="Search chats…"
           aria-label="Search chats" autocomplete="off">
  </div>
  <div id="sidebar-section">Recents</div>
  <nav id="chat-list">
    <div class="empty">Loading…</div>
  </nav>
  <div id="chat-list-more" hidden>
    <!-- Button label is also stored as LOAD_MORE_LABEL in the script
         so a transient failure can be cleared back to it. Keep the two
         in sync if you change the wording here. -->

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');
const toolsBtn = document.getElementById('tools-btn');
const toolsPopover = document.getElementById('tools-popover');
const agentSelectorBtn = document.getElementById('agent-selector-btn');
const agentSelectorValueEl = document.getElementById('agent-selector-value');
const agentPopover = document.getElementById('agent-popover');
const agentOptionsEl = document.getElementById('agent-options');
const modelBtn = document.getElementById('model-btn');
const modelLabelEl = document.getElementById('model-label');
const modelPopover = document.getElementById('model-popover');
const modelOptionsEl = document.getElementById('model-options');
const validateBox = document.getElementById('validate-checkbox');
const validateRow = document.querySelector('.tools-checkbox-row');

// Current user's WorkOS ID, injected by the server. Used to default the
// sidebar filter to "my chats".
const currentUserID = '{{.UserID}}';
let agentOptions = [];
let agentOptionsLoaded = false;
const agentStorageKey = 'hetchy.agent.' + currentUserID;

function readStoredAgentSlug() {
  try {
    const saved = localStorage.getItem(agentStorageKey);
    return saved === null ? '' : saved.trim();
  } catch (e) {
    return '';
  }
}

let selectedAgentSlug = readStoredAgentSlug();
const modelOptions = [
  { value: 'opus', label: 'Opus', description: 'Most capable' },
  { value: 'sonnet', label: 'Sonnet', description: 'Balanced everyday work' },
  { value: 'haiku', label: 'Haiku', description: 'Fastest' },
];
const modelStorageKey = 'hetchy.model';
let selectedModel = (function () {
  try {
    const saved = localStorage.getItem(modelStorageKey);
    if (modelOptions.some(model => model.value === saved)) return saved;
  } catch (e) {}
  return 'opus';
})();
let modelLocked = false;
let isRunning = false;
let isStopping = false;

function setRunState(running, stopping = false) {
  isRunning = running;
  isStopping = running && stopping;
  btn.classList.toggle('is-stop', isRunning);
  btn.disabled = isStopping;
  btn.setAttribute('aria-label', isRunning ? (isStopping ? 'Stopping' : 'Stop') : 'Send');
  btn.title = isRunning ? (isStopping ? 'Stopping…' : 'Stop') : 'Send';
  inp.setAttribute('aria-disabled', isRunning ? 'true' : 'false');
}

function handleComposerAction() {
  if (isRunning) {
    stopRun();
    return;
  }
  send();
}

// Read session ID from URL (?session=...) so the page can be reloaded or
// shared to reconnect to an existing sandbox. Generate a new one if absent.
// crypto.randomUUID() is gated on secure contexts; on plain HTTP at a
// non-localhost host (like dev.hetchy.ai) it isn't defined, so fall back
// to RFC4122 v4 from getRandomValues (which is unrestricted).
function newSessionId() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
const params = new URLSearchParams(window.location.search);
const isFreshChat = !params.has('session');
const sessionId = params.get('session') || newSessionId();
let conversationHasServerState = !isFreshChat;
if (isFreshChat) {
  const url = new URL(window.location);
  url.searchParams.set('session', sessionId);
  history.replaceState(null, '', url);
}

// Auto-grow the textarea to fit its content. Collapsing the height to 0
// first sidesteps a Chromium quirk where an empty textarea's scrollHeight
// reflects the user-agent default rows rather than the actual content
// height. CSS min-height keeps the visible element at one line.
function autosizeInput() {
  inp.style.height = '0px';
  inp.style.height = inp.scrollHeight + 'px';
  // Once content exceeds the CSS max-height the element stops growing —
  // switch overflow back on so the user can scroll within the composer.
  inp.style.overflowY = inp.scrollHeight > inp.clientHeight ? 'auto' : 'hidden';
}
inp.addEventListener('input', autosizeInput);
// Bare Enter sends; Shift+Enter and Ctrl/Cmd+Enter insert a newline.
inp.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.shiftKey || e.ctrlKey || e.metaKey) {
    if (e.ctrlKey || e.metaKey) {
      // Browsers don't insert a newline for Ctrl/Cmd+Enter by default;
      // do it manually so the modifier behaves the same as Shift+Enter.
      e.preventDefault();
      const start = inp.selectionStart, end = inp.selectionEnd;
      inp.value = inp.value.slice(0, start) + '\n' + inp.value.slice(end);
      inp.selectionStart = inp.selectionEnd = start + 1;
      autosizeInput();
    }
    return;
  }
  e.preventDefault();
  send();
});

function addUserMsg(text) {
  // Replace the empty-state placeholder the first time we add a message
  // so the welcome card disappears as the conversation begins.
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg user';
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function loadAgents() {
  agentOptionsLoaded = false;
  try {
    const res = await fetch('/api/agents', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('agents fetch failed: ' + res.status);
    agentOptions = await res.json();
    agentOptionsLoaded = true;
  } catch (e) {
    agentOptions = [];
  }
  if (agentOptionsLoaded) reconcileSelectedAgentWithOptions();
  populateAgentPicker();
}

function persistSelectedAgent() {
  try { localStorage.setItem(agentStorageKey, selectedAgentSlug); } catch (e) {}
}

function agentSlugIsKnown(slug) {
  return !slug || agentOptions.some(agent => agent.slug === slug);
}

function reconcileSelectedAgentWithOptions() {
  if (!agentOptionsLoaded) return;
  if (agentSlugIsKnown(selectedAgentSlug)) return;
  selectedAgentSlug = '';
  persistSelectedAgent();
}

function selectedAgentName() {
  if (!selectedAgentSlug) return 'none';
  const found = agentOptions.find(agent => agent.slug === selectedAgentSlug);
  return found ? (found.display_name || found.slug) : selectedAgentSlug;
}

function updateToolsButton() {
  const agentLabel = selectedAgentName();
  const validates = validateBox ? validateBox.checked : true;
  agentSelectorValueEl.textContent = agentLabel === 'none' ? 'No agent' : agentLabel;
  toolsBtn.title = 'Agent: ' + agentLabel + '; validation ' + (validates ? 'on' : 'off');
  toolsBtn.setAttribute('aria-label', 'Composer options. Agent: ' + agentLabel + '. Validation ' + (validates ? 'on' : 'off') + '.');
  toolsBtn.classList.toggle('has-agent', !!selectedAgentSlug);
  if (validateRow) {
    validateRow.classList.toggle('is-checked', validates);
    validateRow.setAttribute('aria-checked', String(validates));
  }
}

function chooseAgent(slug) {
  selectedAgentSlug = slug || '';
  persistSelectedAgent();
  populateAgentPicker();
  updateToolsButton();
  updateMutablePendingAgentMetadata();
  closeAgentPopover();
  closeToolsPopover();
  inp.focus();
}

function populateAgentPicker() {
  if (!agentOptionsEl) return;
  agentOptionsEl.innerHTML = '';
  const choices = [{
    slug: '',
    display_name: 'No agent',
    description: 'Use Hetchy without a specialized persona.'
  }, ...agentOptions];
  for (const agent of choices) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'agent-choice' + (agent.slug === selectedAgentSlug ? ' is-selected' : '');
    item.dataset.agentSlug = agent.slug;

    const name = document.createElement('span');
    name.className = 'agent-choice-name';
    name.textContent = agent.display_name || agent.slug;
    item.appendChild(name);

    if (agent.description) {
      const desc = document.createElement('span');
      desc.className = 'agent-choice-desc';
      desc.textContent = agent.description;
      item.appendChild(desc);
    }

    item.addEventListener('click', () => chooseAgent(agent.slug));
    agentOptionsEl.appendChild(item);
  }
  updateToolsButton();
}

function modelLabelFor(value) {
  const found = modelOptions.find(model => model.value === value);
  return found ? found.label : 'Opus';
}

function selectedModelLabel() {
  return modelLabelFor(selectedModel);
}

function updateModelButton() {
  const label = selectedModelLabel();
  modelLabelEl.textContent = label;
  const suffix = modelLocked ? ' (set for this chat)' : '';
  modelBtn.title = 'Model: ' + label + suffix;
  modelBtn.setAttribute('aria-label', 'Model: ' + label + suffix);
}

function setModelPickerLocked(locked) {
  modelLocked = !!locked;
  modelBtn.disabled = modelLocked;
  if (modelLocked) closeModelPopover();
  updateModelButton();
}

function applyConversationModel(detail) {
  const hasTurns = !!(detail && Array.isArray(detail.history) && detail.history.length);
  if (detail && modelOptions.some(model => model.value === detail.model)) {
    selectedModel = detail.model;
    populateModelPicker();
  }
  setModelPickerLocked(hasTurns);
}

function applyConversationAgent(detail) {
  selectedAgentSlug = detail ? (detail.agent_slug || '') : readStoredAgentSlug();
  if (!detail) reconcileSelectedAgentWithOptions();
  populateAgentPicker();
  updateToolsButton();
}

function chooseModel(value) {
  if (modelLocked) return;
  if (!modelOptions.some(model => model.value === value)) return;
  selectedModel = value;
  try { localStorage.setItem(modelStorageKey, selectedModel); } catch (e) {}
  populateModelPicker();
  updateModelButton();
  closeModelPopover();
  inp.focus();
}

function populateModelPicker() {
  if (!modelOptionsEl) return;
  modelOptionsEl.innerHTML = '';
  for (const model of modelOptions) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'model-choice' + (model.value === selectedModel ? ' is-selected' : '');

    const name = document.createElement('span');
    name.className = 'model-choice-name';
    name.textContent = model.label;
    item.appendChild(name);

    const desc = document.createElement('span');
    desc.className = 'model-choice-desc';
    desc.textContent = model.description;
    item.appendChild(desc);

    if (model.value === selectedModel) {
      const check = document.createElement('span');
      check.className = 'model-check';
      check.textContent = '✓';
      item.appendChild(check);
    }

    item.addEventListener('click', () => chooseModel(model.value));
    modelOptionsEl.appendChild(item);
  }
  updateModelButton();
}

function openToolsPopover() {
  toolsPopover.hidden = false;
  toolsBtn.setAttribute('aria-expanded', 'true');
  closeModelPopover();
}

function closeToolsPopover() {
  toolsPopover.hidden = true;
  toolsBtn.setAttribute('aria-expanded', 'false');
  closeAgentPopover();
}

function openAgentPopover() {
  agentPopover.hidden = false;
  agentSelectorBtn.setAttribute('aria-expanded', 'true');
}

function closeAgentPopover() {
  agentPopover.hidden = true;
  agentSelectorBtn.setAttribute('aria-expanded', 'false');
}

function openModelPopover() {
  if (modelLocked) return;
  modelPopover.hidden = false;
  modelBtn.setAttribute('aria-expanded', 'true');
  closeToolsPopover();
}

function closeModelPopover() {
  modelPopover.hidden = true;
  modelBtn.setAttribute('aria-expanded', 'false');
}

toolsBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (toolsPopover.hidden) openToolsPopover();
  else closeToolsPopover();
});
toolsPopover.addEventListener('click', e => e.stopPropagation());
agentSelectorBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (agentPopover.hidden) openAgentPopover();
  else closeAgentPopover();
});
document.getElementById('agent-flyout-root').addEventListener('mouseenter', openAgentPopover);
if (validateBox) {
  validateBox.addEventListener('change', updateToolsButton);
}
if (validateRow) {
  validateRow.addEventListener('mouseenter', closeAgentPopover);
}
modelBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (modelPopover.hidden) openModelPopover();
  else closeModelPopover();
});
modelPopover.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => {
  closeToolsPopover();
  closeModelPopover();
  closeAgentPopover();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeToolsPopover();
    closeModelPopover();
    closeAgentPopover();
  }
});

// formatBlockTime renders a block's started_at into a short HH:MM
// (24-hour, local) string for the summary chip. Returns '' for a
// missing/invalid input so callers can blindly assign the result —
// the .blk-time:empty CSS rule hides the element entirely when no
// time is known (e.g. an older persisted block predating the field).
function formatBlockTime(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// formatBlockDuration turns a (started_at, ended_at) pair into a
// compact total-execution-time string ("420ms", "3.2s", "1m 4s",
// "12m 30s"). Returns '' on missing/invalid input or a non-positive
// delta — the .blk-duration:empty CSS rule then hides the chip.
function formatBlockDuration(startedAt, endedAt) {
  if (!startedAt || !endedAt) return '';
  const a = new Date(startedAt).getTime();
  const b = new Date(endedAt).getTime();
  if (isNaN(a) || isNaN(b)) return '';
  const ms = b - a;
  if (ms < 0) return '';
  if (ms < 1000) return ms + 'ms';
  const totalSec = Math.round(ms / 1000);
  if (totalSec < 60) {
    // sub-minute: show one decimal so 3.2s reads sharper than 3s.
    const s = (ms / 1000).toFixed(1).replace(/\.0$/, '');
    return s + 's';
  }
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return s === 0 ? m + 'm' : m + 'm ' + s + 's';
}

// Per-kind icon glyphs shown in the collapsed summary. Spinner takes
// over when a block is streaming, so this is just the resting icon.
const BLK_ICON = {
  setup:       '□', // ▢
  notify:      '●', // ●
  claude_text: '✎', // ✎
  tool_use:    '⚙', // ⚙
  result:      '✓', // ✓
  error:       '✗', // ✗
  phase:       '✎', // ✎ — phase boxes group prose + tools, share the prose icon
};

// renderMarkdown converts a markdown body into sanitized HTML. We
// trust marked's output shape but run it through DOMPurify because
// the body comes from Claude / sandbox stdout and could contain
// arbitrary text — some of which (e.g. tool result JSON) might look
// like an HTML tag to a careless parser.
function renderMarkdown(md) {
  if (!md) return '';
  const html = marked.parse(md, { breaks: true, gfm: true });
  const sanitized = DOMPurify.sanitize(html);
  // Post-process to add target="_blank" and rel="noopener" to all links
  const temp = document.createElement('div');
  temp.innerHTML = sanitized;
  temp.querySelectorAll('a').forEach(a => {
    if (!a.hasAttribute('target')) {
      a.setAttribute('target', '_blank');
    }
    if (!a.hasAttribute('rel')) {
      a.setAttribute('rel', 'noopener');
    } else if (!a.getAttribute('rel').includes('noopener')) {
      a.setAttribute('rel', a.getAttribute('rel') + ' noopener');
    }
  });
  return temp.innerHTML;
}

// startBotTurn ensures there's a container the streaming blocks are
// appended into. One container per user → bot exchange. The active
// block's icon spinner is the run's "still alive" indicator —
// there's no separate turn-level pulse because it would duplicate
// the spinner inside whichever block is currently streaming.
function startBotTurn() {
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'bot-turn';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

// renderBlock builds a collapsible block element and appends it into
// the supplied turn container. Used for setup, notify, result, and
// error kinds — claude_text and tool_use go through phase boxes
// (openPhase / addToolToPhase) instead so the user sees the prose +
// tools as a single grouped unit.
//
// tool_use is still handled here for the standalone case (no phase
// has been opened yet), though in practice the phase model creates
// one on first contact. We keep the standalone branch so a future
// emitter that fires tool_use without a wrapping claude_text doesn't
// silently drop on the floor.
function renderBlock(turn, block, opts) {
  const isToolUse = block.kind === 'tool_use';
  const isOneShot = block.kind === 'notify'
                    || block.kind === 'result'
                    || block.kind === 'error';
  const open = !!(opts && opts.open) && !isToolUse;
  const el = document.createElement('details');
  el.className = 'blk blk-kind-' + block.kind
                 + (block.status === 'streaming' ? ' blk-streaming' : '')
                 + (block.status === 'error' ? ' blk-kind-error' : '')
                 + (isOneShot ? ' blk-oneshot' : '');
  if (open) el.open = true;
  el.dataset.blockId = block.id;
  el.dataset.startedAt = block.started_at || '';
  el.id = 'block-' + block.id;
  el.innerHTML = '<summary>'
    + '<span class="caret">▶</span>'
    + '<span class="blk-icon"><span>' + (BLK_ICON[block.kind] || '•') + '</span></span>'
    + '<span class="blk-title"></span>'
    + '<span class="blk-summary"></span>'
    + '<span class="blk-time"></span>'
    + '<span class="blk-duration"></span>'
    + '</summary><div class="blk-body"></div>';
  el.querySelector('.blk-title').textContent = block.title || '';
  el.querySelector('.blk-summary').textContent = block.summary || '';
  el.querySelector('.blk-time').textContent = formatBlockTime(block.started_at);
  el.querySelector('.blk-duration').textContent = formatBlockDuration(block.started_at, block.ended_at);
  if (!isToolUse) {
    el.querySelector('.blk-body').innerHTML = renderMarkdown(block.body || '');
  }
  if (isToolUse) {
    // Suppress the native <details> click-to-toggle so the body never
    // opens (it would reveal an empty pane).
    el.querySelector('summary').addEventListener('click', e => e.preventDefault());
  }
  turn.appendChild(el);
  return el;
}

// openPhase creates a new phase box ("group" of one Claude prose
// paragraph + the tool calls it triggers). The box stays expanded
// while it's the active phase; closePhase below collapses it and
// stamps the right-hand summary with the step count.
//
// The header title is set on creation from the first claude_text
// chunk's first line (or "Working" when a tool_use opens the phase
// without a leading prose chunk). The body holds two regions: a
// .phase-prose block that streams the rest of the paragraph, and a
// .phase-tools wrapper that subsequent tool_uses are appended into.
function openPhase(turn, headerTitle, startedAt) {
  const el = document.createElement('details');
  el.className = 'blk blk-kind-phase blk-streaming';
  el.open = true;
  el.innerHTML = '<summary>'
    + '<span class="caret">▶</span>'
    + '<span class="blk-icon"><span>' + BLK_ICON.phase + '</span></span>'
    + '<span class="blk-title"></span>'
    + '<span class="blk-summary"></span>'
    + '<span class="blk-time"></span>'
    + '<span class="blk-duration"></span>'
    + '</summary>'
    + '<div class="blk-body">'
    +   '<div class="phase-prose"></div>'
    +   '<div class="phase-tools"></div>'
    + '</div>';
  const phase = {
    el,
    titleEl: el.querySelector('.blk-title'),
    summaryEl: el.querySelector('.blk-summary'),
    durationEl: el.querySelector('.blk-duration'),
    proseEl: el.querySelector('.phase-prose'),
    toolsEl: el.querySelector('.phase-tools'),
    proseRaw: '',
    toolCount: 0,
    titleLocked: false,
    proseRenderQueued: false,
    startedAt: startedAt || '',
  };
  phase.titleEl.textContent = headerTitle || 'Working';
  el.querySelector('.blk-time').textContent = formatBlockTime(startedAt);
  if (headerTitle) phase.titleLocked = true;
  turn.appendChild(el);
  return phase;
}

// SERVER_CLOCK_NOTE: every duration chip is computed from a pair of
// server-stamped (started_at, ended_at) values that came over the
// SSE wire or out of the persisted blocks. We deliberately do NOT
// fall back to the browser clock for the missing endpoint — a laptop
// that just resumed from sleep, or a VM with bad NTP, would otherwise
// paint a duration tens of minutes off (or get clamped to '' by
// formatBlockDuration when the delta goes negative). Better to hide
// the chip than show a wrong number.

// closePhase collapses the phase and updates its right-hand summary
// with the step count so the user sees "5 steps" once it's done.
// Idempotent — safe to call on a phase that's already closed.
//
// endedAt (optional) drives the total-execution-time chip. Callers
// should pass a server-stamped value: replay uses the trailing tool's
// ended_at, live uses the started_at of whatever event is closing
// the phase (next block_start). When neither is available — e.g. the
// SSE stream dropped before a terminal frame — the chip is left empty
// rather than synthesising one from the browser clock (see
// SERVER_CLOCK_NOTE above).
function closePhase(phase, endedAt) {
  if (!phase || phase._closed) return;
  phase._closed = true;
  phase.el.classList.remove('blk-streaming');
  phase.el.classList.remove('blk-live-heartbeat');
  phase.el.open = false;
  if (phase.toolCount > 0) {
    phase.summaryEl.textContent = phase.toolCount === 1
      ? '1 step'
      : phase.toolCount + ' steps';
  }
  if (phase.durationEl && phase.startedAt && endedAt) {
    phase.durationEl.textContent = formatBlockDuration(phase.startedAt, endedAt);
  }
}

// appendPhaseProse buffers the delta into the phase's prose buffer
// and schedules a single rAF-coalesced re-render — same coalescing
// rationale as the original appendToBlock (avoid O(n²) full re-parse
// per token on long prose chunks).
//
// Once the prose contains its first newline the header title is
// frozen with `titleLocked = true`. Without that latch, every
// subsequent delta would re-run `indexOf('\n')` over the growing
// buffer for nothing — the title can't change after the first line
// is complete. Until the newline arrives, we keep updating the
// title from the running first-line preview so streaming feels live.
function appendPhaseProse(phase, delta) {
  if (!phase) return;
  phase.proseRaw += delta;
  if (!phase.titleLocked) {
    const nl = phase.proseRaw.indexOf('\n');
    const head = nl >= 0 ? phase.proseRaw.slice(0, nl) : phase.proseRaw;
    const firstLine = head.trim();
    if (firstLine) {
      phase.titleEl.textContent = firstLine.length > 100
        ? firstLine.slice(0, 100) + '…'
        : firstLine;
    }
    if (nl >= 0) phase.titleLocked = true;
  }
  if (phase.proseRenderQueued) return;
  phase.proseRenderQueued = true;
  requestAnimationFrame(() => {
    phase.proseRenderQueued = false;
    phase.proseEl.innerHTML = renderMarkdown(phase.proseRaw);
    log.scrollTop = log.scrollHeight;
  });
}

// finishPhaseProse flushes any pending render (so the last delta
// always lands) and commits the title. The phase itself stays open —
// the trailing tool_uses are still arriving and belong inside it.
function finishPhaseProse(phase) {
  if (!phase) return;
  phase.titleLocked = true;
  phase.proseEl.innerHTML = renderMarkdown(phase.proseRaw);
}

// addToolToPhase renders a tool_use one-liner inside the supplied
// phase. The phase header carries the start-time chip for the whole
// group, so individual step rows omit it — only the duration chip
// remains, which is per-step useful (e.g. "287 lines / 1.2s").
function addToolToPhase(phase, payload) {
  const el = document.createElement('details');
  el.className = 'blk blk-kind-tool_use'
                 + (payload.status === 'streaming' ? ' blk-streaming' : '')
                 + (payload.status === 'error' ? ' blk-kind-error' : '');
  el.dataset.blockId = payload.id;
  el.dataset.startedAt = payload.started_at || '';
  el.id = 'block-' + payload.id;
  el.innerHTML = '<summary>'
    + '<span class="caret">▶</span>'
    + '<span class="blk-icon"><span>' + BLK_ICON.tool_use + '</span></span>'
    + '<span class="blk-title"></span>'
    + '<span class="blk-summary"></span>'
    + '<span class="blk-duration"></span>'
    + '</summary><div class="blk-body"></div>';
  el.querySelector('.blk-title').textContent = payload.title || '';
  el.querySelector('.blk-summary').textContent = payload.summary || '';
  el.querySelector('.blk-duration').textContent = formatBlockDuration(payload.started_at, payload.ended_at);
  el.querySelector('summary').addEventListener('click', e => e.preventDefault());
  phase.toolsEl.appendChild(el);
  phase.toolCount++;
  return el;
}

// appendToBlock buffers the delta into the block's raw markdown and
// schedules a single rAF-coalesced re-render. A naive "re-render on
// every delta" would be O(n²): each chunk re-parses + re-sanitises the
// full body, which visibly stutters the browser on long Claude streams
// (thousands of small text deltas). Coalescing collapses bursts of
// deltas into one paint per frame.
function appendToBlock(el, delta) {
  if (!el) return;
  const body = el.querySelector('.blk-body');
  body.dataset.raw = (body.dataset.raw || '') + delta;
  scheduleBlockRender(el);
}

function scheduleBlockRender(el) {
  if (el._renderQueued) return;
  el._renderQueued = true;
  requestAnimationFrame(() => {
    el._renderQueued = false;
    // Collapsible <details> blocks hide the body when closed, so the
    // markdown render is wasted work — catch up on the next render
    // (or on finishBlock). Flat claude_text blocks are always visible,
    // so we always paint.
    if (el.tagName === 'DETAILS' && !el.open) return;
    const body = el.querySelector('.blk-body');
    body.innerHTML = renderMarkdown(body.dataset.raw || '');
    log.scrollTop = log.scrollHeight;
  });
}

function finishBlock(el, status, summary, endedAt) {
  if (!el) return;
  el.classList.remove('blk-streaming');
  el.classList.remove('blk-awaiting-next');
  el.classList.remove('blk-live-heartbeat');
  const summaryEl = el.querySelector('.blk-summary');
  if (summary && summaryEl) summaryEl.textContent = summary;
  if (status === 'error') {
    el.classList.add('blk-kind-error');
  }
  const durationEl = el.querySelector('.blk-duration');
  const startedAt = el.dataset.startedAt;
  if (durationEl && startedAt && endedAt) {
    // Server-stamped only — see SERVER_CLOCK_NOTE near closePhase.
    durationEl.textContent = formatBlockDuration(startedAt, endedAt);
  }
  // Force a final render so any pending deltas land before the block
  // is collapsed by the next block_start (a collapsed block skips its
  // queued render, so we'd otherwise miss the last few tokens).
  const body = el.querySelector('.blk-body');
  if (body) body.innerHTML = renderMarkdown(body.dataset.raw || '');
}

function markBlockAwaitingNext(el) {
  if (!el) return;
  el.classList.add('blk-awaiting-next');
}

function clearBlockActivity(el) {
  if (!el) return;
  el.classList.remove('blk-streaming');
  el.classList.remove('blk-awaiting-next');
  el.classList.remove('blk-live-heartbeat');
}

function blockHasActivity(el) {
  return !!el && (
    el.classList.contains('blk-streaming') ||
    el.classList.contains('blk-awaiting-next')
  );
}

function heartbeatSummary(title, body, elapsed) {
  if (elapsed) return 'Still running · ' + elapsed;
  const text = body || title || 'Still running';
  const m = text.match(/\b(?:for|running for)\s+(.+?)\s+[—–-]/i);
  if (m && m[1]) return 'Still running · ' + m[1].trim();
  return title || 'Still running';
}

function applyHeartbeatToActiveBlock(currentPhase, lastStandaloneEl, payload) {
  const summary = heartbeatSummary(payload.title, payload.delta, payload.elapsed);
  if (currentPhase && !currentPhase._closed) {
    currentPhase.summaryEl.textContent = summary;
    currentPhase.el.classList.add('blk-live-heartbeat');
    return;
  }
  if (blockHasActivity(lastStandaloneEl)) {
    const summaryEl = lastStandaloneEl.querySelector('.blk-summary');
    if (summaryEl) summaryEl.textContent = summary;
    lastStandaloneEl.classList.add('blk-live-heartbeat');
  }
}

function showEmptyState() {
  log.innerHTML = '';
  const d = document.createElement('div');
  d.id = 'empty-state';
  const ascii = `<div class="empty-brand"><pre class="empty-ascii">
  ██╗  ██╗███████╗████████╗ ██████╗██╗  ██╗██╗   ██╗
  ██║  ██║██╔════╝╚══██╔══╝██╔════╝██║  ██║╚██╗ ██╔╝
  ███████║█████╗     ██║   ██║     ███████║ ╚████╔╝
  ██╔══██║██╔══╝     ██║   ██║     ██╔══██║  ╚██╔╝
  ██║  ██║███████╗   ██║   ╚██████╗██║  ██║   ██║

  </pre><div class="empty-tagline">&lt; your AI coding co-pilot /&gt;</div></div>`;
