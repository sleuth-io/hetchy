<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hetchy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; display: flex; height: 100vh;
         background: #f5f5f5; color: #1a1a1a; }

  /* Sidebar */
  #sidebar { width: 260px; flex-shrink: 0; background: #fafafa;
             border-right: 1px solid #e5e5e5; display: flex; flex-direction: column;
             min-height: 0; }
  #sidebar-head { padding: .75rem; border-bottom: 1px solid #f0f0f0; }
  .new-chat-btn { display: flex; align-items: center; gap: .5rem; width: 100%;
                  padding: .55rem .75rem; background: #fff; border: 1px solid #e5e5e5;
                  border-radius: .5rem; font-size: .9rem; font-weight: 500;
                  color: #1a1a1a; cursor: pointer; text-decoration: none;
                  text-align: left; }
  .new-chat-btn:hover { background: #f4f4f4; border-color: #d0d0d0; }
  .new-chat-btn .plus { font-size: 1.05rem; line-height: 1; color: #888; }
  #sidebar-section { padding: .75rem .75rem .25rem;
                     font-size: .7rem; font-weight: 600; text-transform: uppercase;
                     letter-spacing: .05em; color: #999; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 .25rem .75rem; }
  #chat-list .empty { padding: .5rem .75rem; font-size: .85rem; color: #999; }
  .chat-item { display: block; padding: .5rem .75rem; margin: 0 .25rem;
               border-radius: .375rem; font-size: .875rem; color: #333;
               text-decoration: none; cursor: pointer;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item:hover { background: #f0f0f0; }
  .chat-item.active { background: #e8f1fc; color: #0b5ec0; }
  .chat-item.pending { color: #888; font-style: italic; }
  .chat-item.pending.active { color: #0b5ec0; }

  /* Main column */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #log  { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex;
          flex-direction: column; gap: .75rem; }
  .msg  { max-width: 70%; padding: .6rem 1rem; border-radius: 1rem; line-height: 1.4; }
  .user { align-self: flex-end; background: #0b93f6; color: #fff; border-bottom-right-radius: .25rem; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #ddd;
          border-bottom-left-radius: .25rem; white-space: pre-wrap; }
  #empty-state { margin: auto; text-align: center; color: #888; font-size: .95rem; }
  #empty-state h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: .5rem;
                    color: #333; }
  #bar  { display: flex; gap: .5rem; padding: 1rem; background: #fff;
          border-top: 1px solid #ddd; }
  #inp  { flex: 1; padding: .6rem 1rem; border: 1px solid #ccc; border-radius: 2rem;
          font-size: 1rem; outline: none; }
  #inp:focus { border-color: #0b93f6; }
  button { padding: .6rem 1.2rem; background: #0b93f6; color: #fff; border: none;
           border-radius: 2rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #session-bar { padding: .3rem 1rem; background: #f0f0f0; border-top: 1px solid #ddd;
                 font-size: .75rem; color: #888; font-family: monospace;
                 display: flex; justify-content: space-between; align-items: center; }
  #session-bar a { color: #0b93f6; text-decoration: none; font-family: system-ui, sans-serif; }
  #session-bar a:hover { text-decoration: underline; }
  #session-bar .links { display: flex; gap: 1rem; }

  /* User menu — sidebar footer with click-to-open popup */
  .user-menu { position: relative; border-top: 1px solid #f0f0f0;
               margin-top: auto; padding-bottom: .75rem; }
  /* border-radius is set explicitly because the global `button` rule
     (used by the chat Send button) gives all <button>s a 2rem pill
     radius; without this override the hover highlight would round off
     instead of filling the full sidebar width. */
  .user-menu-trigger { display: flex; align-items: center; gap: .6rem;
                       width: 100%; padding: .65rem .75rem; background: none;
                       border: 0; border-radius: 0; cursor: pointer;
                       text-align: left; font-family: inherit;
                       font-size: .9rem; color: #1a1a1a; }
  .user-menu-trigger:hover, .user-menu-trigger[aria-expanded="true"] { background: #f0f0f0; }
  .user-menu-trigger .name { flex: 1; min-width: 0; font-weight: 500;
                             white-space: nowrap; overflow: hidden;
                             text-overflow: ellipsis; }
  .avatar { width: 28px; height: 28px; border-radius: 50%;
            display: block; background: #f0f0f0; flex-shrink: 0; }
  .user-menu-dropdown { position: absolute; bottom: calc(100% + .35rem); left: .5rem;
                        right: .5rem; background: #fff; border: 1px solid #e5e5e5;
                        border-radius: .5rem; box-shadow: 0 8px 24px rgba(0,0,0,.12);
                        padding: .25rem 0; z-index: 50; }
  .user-menu-dropdown[hidden] { display: none; }
  .user-menu-header { display: flex; align-items: center; gap: .75rem;
                      padding: .75rem .85rem; border-bottom: 1px solid #f0f0f0; }
  .user-menu-header .avatar-lg { width: 36px; height: 36px; border-radius: 50%;
                                  background: #f0f0f0; display: block; flex-shrink: 0; }
  .user-menu-header .name { font-weight: 600; font-size: .9rem; color: #1a1a1a;
                            line-height: 1.2; white-space: nowrap;
                            overflow: hidden; text-overflow: ellipsis; }
  .user-menu-header .email { font-size: .75rem; color: #777; line-height: 1.4;
                             white-space: nowrap; overflow: hidden;
                             text-overflow: ellipsis; }
  .user-menu-header > div { min-width: 0; }
  .user-menu-dropdown a.item { display: flex; align-items: center; gap: .6rem;
                                padding: .55rem .85rem; color: #333; font-size: .85rem;
                                text-decoration: none; }
  .user-menu-dropdown a.item:hover { background: #f7f7f7; text-decoration: none; }
  .user-menu-dropdown a.item .ico { width: 1rem; height: 1rem; opacity: .65;
                                     flex-shrink: 0; color: #555; }
  .user-menu-dropdown .divider { border-top: 1px solid #f0f0f0; margin: .25rem 0; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-head">
    <a href="/" class="new-chat-btn" id="new-chat-btn">
      <span class="plus">+</span>
      <span>New chat</span>
    </a>
  </div>
  <div id="sidebar-section">Recents</div>
  <nav id="chat-list">
    <div class="empty">Loading…</div>
  </nav>
  <div class="user-menu">
    <button class="user-menu-trigger" id="user-menu-btn"
            aria-haspopup="menu" aria-expanded="false" aria-label="Open user menu">
      <img class="avatar" src="{{.GravatarURL}}" alt="" referrerpolicy="no-referrer">
      <span class="name">{{.DisplayName}}</span>
    </button>
    <div class="user-menu-dropdown" id="user-menu-dropdown" role="menu" hidden>
      <div class="user-menu-header">
        <img class="avatar-lg" src="{{.GravatarURL}}" alt="" referrerpolicy="no-referrer">
        <div>
          <div class="name">{{.DisplayName}}</div>
          <div class="email">{{.Email}}</div>
        </div>
      </div>
      <a class="item" role="menuitem" href="/settings/profile">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="5.5" r="2.5"/>
          <path d="M3 13.5c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5"/>
        </svg>
        User settings
      </a>
      <a class="item" role="menuitem" href="/settings/org">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="2"/>
          <path d="M13 8a5 5 0 0 0-.1-1l1.3-1-1-1.7-1.5.5a5 5 0 0 0-1.7-1L9.7 2H6.3l-.3 1.6a5 5 0 0 0-1.7 1l-1.5-.5-1 1.7 1.3 1A5 5 0 0 0 3 8a5 5 0 0 0 .1 1l-1.3 1 1 1.7 1.5-.5a5 5 0 0 0 1.7 1l.3 1.6h3.4l.3-1.6a5 5 0 0 0 1.7-1l1.5.5 1-1.7-1.3-1A5 5 0 0 0 13 8z"/>
        </svg>
        Organization settings
      </a>
      <div class="divider"></div>
      <a class="item" role="menuitem" href="/logout">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3.5H5a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 5 12.5h4"/>
          <path d="M11 5.5 13.5 8 11 10.5"/>
          <path d="M6.5 8h7"/>
        </svg>
        Log out
      </a>
    </div>
  </div>
</aside>

<div id="main">
<div id="log"></div>
<div id="bar">
  <input id="inp" placeholder="Describe a feature…" autofocus>
  <button id="btn" onclick="send()">Send</button>
</div>
<div id="session-bar">
  <span>session: <span id="session-label"></span></span>
</div>
</div>

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');

// Read session ID from URL (?session=...) so the page can be reloaded or
// shared to reconnect to an existing sandbox. Generate a new one if absent.
// crypto.randomUUID() is gated on secure contexts; on plain HTTP at a
// non-localhost host (like dev.hetchy.ai) it isn't defined, so fall back
// to RFC4122 v4 from getRandomValues (which is unrestricted).
function newSessionId() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
const params = new URLSearchParams(window.location.search);
const isFreshChat = !params.has('session');
const sessionId = params.get('session') || newSessionId();
if (isFreshChat) {
  const url = new URL(window.location);
  url.searchParams.set('session', sessionId);
  history.replaceState(null, '', url);
}
document.getElementById('session-label').textContent = sessionId;

inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

function addMsg(text, cls) {
  // Replace the empty-state placeholder the first time we add a message
  // so the welcome card disappears as the conversation begins.
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function showEmptyState() {
  log.innerHTML = '';
  const d = document.createElement('div');
  d.id = 'empty-state';
  d.innerHTML = '<h2>Start a new chat</h2><div>Describe a feature, fix, or refactor and Hetchy will open a PR.</div>';
  log.appendChild(d);
}

// Sidebar state. `sidebarItems` is the last list returned by the API;
// `pendingChatTitle` is set when the user starts a brand-new chat so we
// can show it in the sidebar before the agent finishes and the row is
// persisted. We always render from these two pieces, so any update to
// either triggers a paint via renderSidebar().
let sidebarItems = [];
let pendingChatTitle = null;

function renderSidebar() {
  const list = document.getElementById('chat-list');
  // Optimistically prepend the in-flight chat if it isn't (yet) in the
  // server-side list. Once the agent finishes and the row is persisted,
  // the next loadSidebar() will replace the optimistic entry with the
  // real one (same thread_id, same place at the top by updated_at DESC).
  const display = sidebarItems.slice();
  const alreadyHasCurrent = display.some(c => c.thread_id === sessionId);
  if (pendingChatTitle && !alreadyHasCurrent) {
    display.unshift({ thread_id: sessionId, title: pendingChatTitle, _pending: true });
  }
  list.innerHTML = '';
  if (display.length === 0) {
    list.innerHTML = '<div class="empty">No past chats yet.</div>';
    return;
  }
  for (const c of display) {
    const a = document.createElement('a');
    a.className = 'chat-item'
      + (c.thread_id === sessionId ? ' active' : '')
      + (c._pending ? ' pending' : '');
    a.href = '/?session=' + encodeURIComponent(c.thread_id);
    a.title = c.title;
    a.textContent = c.title;
    list.appendChild(a);
  }
}

async function loadSidebar() {
  const list = document.getElementById('chat-list');
  try {
    const res = await fetch('/api/conversations', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) {
      list.innerHTML = '<div class="empty">Could not load chats.</div>';
      return;
    }
    sidebarItems = (await res.json()) || [];
    // Once the server has persisted the current chat, the optimistic
    // entry is no longer needed — drop the pending title so the real row
    // is rendered with its server-side title.
    if (sidebarItems.some(c => c.thread_id === sessionId)) {
      pendingChatTitle = null;
    }
    renderSidebar();
  } catch (e) {
    list.innerHTML = '<div class="empty">Could not load chats.</div>';
  }
}

async function loadHistory() {
  // Fresh chat: don't probe the API, just show the welcome state.
  if (isFreshChat) { showEmptyState(); return; }
  try {
    const res = await fetch('/api/conversations/' + encodeURIComponent(sessionId),
                            { headers: { 'Accept': 'application/json' } });
    if (res.status === 404) {
      // Session id is in the URL but no conversation has been persisted yet
      // (e.g. the user opened a fresh URL with ?session= or the agent for a
      // brand-new chat hasn't completed its first turn). Treat as new chat.
      showEmptyState();
      return;
    }
    if (!res.ok) return;
    const detail = await res.json();
    log.innerHTML = '';
    const history = detail.history || [];
    const responses = detail.responses || [];
    for (let i = 0; i < history.length; i++) {
      addMsg(history[i], 'user');
      // Older rows persisted before we tracked bot transcripts won't have
      // a paired response — fall back to the PR URL on the last turn so
      // the chat doesn't look one-sided.
      if (responses[i]) {
        addMsg(responses[i], 'bot');
      } else if (i === history.length - 1 && detail.pr_url) {
        addMsg('Done! 🎉 ' + detail.pr_url, 'bot');
      }
    }
  } catch (e) {
    // Leave the log empty on error; the user can still type a message.
  }
}

function makePendingTitle(text) {
  const oneLine = text.replace(/\s+/g, ' ').trim();
  return oneLine.length > 80 ? oneLine.slice(0, 80) + '…' : oneLine;
}

async function send() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  btn.disabled = true;
  const isFirstTurn = log.querySelectorAll('.msg').length === 0;
  addMsg(text, 'user');
  const bot = addMsg('…', 'bot');

  // Show the chat in the sidebar immediately on the first turn — the
  // backend doesn't persist the row until the agent finishes, which can
  // take minutes, and the user expects to see their chat appear right
  // away (and to be able to navigate back to it mid-run).
  if (isFirstTurn) {
    pendingChatTitle = makePendingTitle(text);
    renderSidebar();
  }

  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, session_id: sessionId })
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  bot.textContent = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      if (part.startsWith('data: ')) {
        bot.textContent += (bot.textContent ? '\n' : '') + JSON.parse(part.slice(6));
        log.scrollTop = log.scrollHeight;
      }
    }
  }
  btn.disabled = false;
  inp.focus();
  // Refresh the sidebar after every turn so the row's title (server-side)
  // and ordering (newest activity first) reflect the just-completed turn.
  loadSidebar();
}

// Avatar dropdown — toggle on click, close on outside-click or Escape.
const userMenuBtn = document.getElementById('user-menu-btn');
const userMenuDrop = document.getElementById('user-menu-dropdown');
function setUserMenuOpen(open) {
  userMenuDrop.hidden = !open;
  userMenuBtn.setAttribute('aria-expanded', String(open));
}
userMenuBtn.addEventListener('click', e => {
  e.stopPropagation();
  setUserMenuOpen(userMenuDrop.hidden);
});
document.addEventListener('click', e => {
  if (!userMenuDrop.hidden && !userMenuDrop.contains(e.target)) setUserMenuOpen(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !userMenuDrop.hidden) {
    setUserMenuOpen(false);
    userMenuBtn.focus();
  }
});

// Initial load: paint the sidebar and any existing chat history in parallel.
loadSidebar();
loadHistory();
</script>
</body>
</html>
