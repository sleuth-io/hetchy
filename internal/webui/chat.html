<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hetchy</title>
<!-- Favicon — chunky block "H" echoing the ASCII banner shown in the
     empty state. The data URI comes from web.go's faviconHref helper; JS
     reads link.href at load to derive the badged "done" variant by
     splicing a green dot before the closing </svg>, so the H markup
     never has to be kept in sync between HTML and JS. -->
<link rel="icon" type="image/svg+xml" id="favicon" href="{{faviconHref}}">
<!-- Markdown rendering for bot blocks. DOMPurify sanitizes the HTML
     marked produces — we render server-supplied content (Claude's
     stream-json text, tool inputs/results) and never want raw HTML
     bleeding in. CDN-pinned to specific minor versions so a publish
     can't silently change behaviour. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="{{assetPath "chat_bootstrap.js"}}"></script>
<link rel="stylesheet" href="{{assetPath "chat.css"}}">
</head>
<body data-current-user-id="{{.UserID}}" data-openai-enabled="{{if .OpenAIEnabled}}1{{else}}0{{end}}" data-default-repo-slug="{{.DefaultRepoSlug}}">

<div id="toast-stack" aria-live="polite" aria-atomic="true"></div>

<aside id="sidebar">
  <div id="sidebar-head">
    <a href="/" class="new-chat-btn" id="new-chat-btn">
      <span class="plus">+</span>
      <span>New chat</span>
    </a>
  </div>
  <div id="sidebar-filter">
    <select id="user-filter" aria-label="Filter chats by user">
      <option value="">All</option>
    </select>
    <button id="search-toggle" type="button" aria-label="Search chats" title="Search chats" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
    </button>
    <input id="chat-search" type="search" placeholder="Search chats…"
           aria-label="Search chats" autocomplete="off">
  </div>
  <div id="sidebar-section">Recents</div>
  <nav id="chat-list">
    <div class="empty">Loading…</div>
  </nav>
  <div id="chat-list-more" hidden>
    <!-- Button label is also stored as LOAD_MORE_LABEL in the script
         so a transient failure can be cleared back to it. Keep the two
         in sync if you change the wording here. -->
    <button type="button" id="chat-list-more-btn">Load more</button>
  </div>
  <div class="user-menu">
    <button class="user-menu-trigger" id="user-menu-btn"
            aria-haspopup="menu" aria-expanded="false" aria-label="Open user menu">
      <img class="avatar" src="{{.GravatarURL}}" alt="" referrerpolicy="no-referrer">
      <span class="name">{{.DisplayName}}</span>
    </button>
    <div class="user-menu-dropdown" id="user-menu-dropdown" role="menu" hidden>
      <div class="user-menu-header">
        <img class="avatar-lg" src="{{.GravatarURL}}" alt="" referrerpolicy="no-referrer">
        <div>
          <div class="name">{{.DisplayName}}</div>
          <div class="email">{{.Email}}</div>
        </div>
      </div>
      <a class="item" role="menuitem" href="/settings/profile">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="5.5" r="2.5"/>
          <path d="M3 13.5c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5"/>
        </svg>
        User settings
      </a>
      <a class="item" role="menuitem" href="/settings/org">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="2"/>
          <path d="M13 8a5 5 0 0 0-.1-1l1.3-1-1-1.7-1.5.5a5 5 0 0 0-1.7-1L9.7 2H6.3l-.3 1.6a5 5 0 0 0-1.7 1l-1.5-.5-1 1.7 1.3 1A5 5 0 0 0 3 8a5 5 0 0 0 .1 1l-1.3 1 1 1.7 1.5-.5a5 5 0 0 0 1.7 1l.3 1.6h3.4l.3-1.6a5 5 0 0 0 1.7-1l1.5.5 1-1.7-1.3-1A5 5 0 0 0 13 8z"/>
        </svg>
        Organization settings
      </a>
      <div class="divider"></div>
      <a class="item" role="menuitem" href="/logout">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3.5H5a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 5 12.5h4"/>
          <path d="M11 5.5 13.5 8 11 10.5"/>
          <path d="M6.5 8h7"/>
        </svg>
        Log out
      </a>
    </div>
  </div>
</aside>

<!-- Rename dialog -->
<dialog class="chat-dialog" id="rename-dialog" aria-labelledby="rename-dialog-title">
  <div class="dlg-body">
    <h3 id="rename-dialog-title">Rename chat</h3>
    <input type="text" id="rename-input" maxlength="200" autocomplete="off">
  </div>
  <div class="dlg-actions">
    <button class="dlg-cancel" id="rename-cancel">Cancel</button>
    <button class="dlg-save" id="rename-save">Save</button>
  </div>
</dialog>

<!-- Delete confirmation dialog -->
<dialog class="chat-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
  <div class="dlg-body">
    <h3 id="delete-dialog-title">Delete chat?</h3>
    <p>This will permanently delete this chat. This action cannot be undone.</p>
  </div>
  <div class="dlg-actions">
    <button class="dlg-cancel" id="delete-cancel">Cancel</button>
    <button class="dlg-delete" id="delete-confirm">Delete</button>
  </div>
</dialog>

<div id="main">
<div id="main-top">
  <!-- Sidebar toggle — only visible on mobile via CSS. Toggles the
       `sidebar-open` class on <html> which slides the chat-list aside
       in from the left as a fixed overlay. On desktop the sidebar is
       always visible and this button is hidden. -->
  <button id="sidebar-toggle" type="button"
          aria-label="Toggle chat list" title="Toggle chat list"
          aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="2.5" y1="4" x2="13.5" y2="4"/>
      <line x1="2.5" y1="8" x2="13.5" y2="8"/>
      <line x1="2.5" y1="12" x2="13.5" y2="12"/>
    </svg>
  </button>
  <!-- aria-pressed is intentionally omitted here — the head-bootstrap
       toggles `html.meta-hidden` before paint, then applyMetaHidden()
       on init sets the right aria-pressed value to match. Hard-coding
       "true" in markup would mismatch on reloads where the panel is
       hidden until the script catches up. -->
  <button id="meta-toggle" type="button"
          aria-label="Toggle chat details panel" title="Toggle chat details">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="3" width="12" height="10" rx="1.5"/>
      <line x1="10.5" y1="3" x2="10.5" y2="13"/>
    </svg>
  </button>
</div>
<!-- Backdrop behind the sidebar/meta overlays on mobile. Clicking it
     closes whichever panel is open. The CSS hides this on desktop. -->
<div id="overlay-scrim" hidden></div>
<div id="log"></div>
<div id="bar">
  <div id="composer">
    <textarea id="inp" rows="1" placeholder="Code anything and open a ready pr" autofocus></textarea>
    <input id="attachment-input" type="file" multiple hidden>
    <div id="attachment-list" hidden></div>
    <div id="composer-controls">
      <div id="composer-controls-left">
        <div id="tools-picker">
          <button id="tools-btn" type="button" aria-label="Open composer options" aria-expanded="false" title="Options">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
          </button>
          <div id="tools-popover" class="composer-popover" hidden>
            <button id="attach-files-btn" class="tools-menu-item" type="button">
              <svg class="tools-menu-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.4 11.6-8.5 8.5a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 5 5l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/>
              </svg>
              <span class="tools-menu-main">
                <span class="tools-menu-label">Add files or photos</span>
              </span>
            </button>
            <div class="tools-divider"></div>
            <label class="tools-menu-item tools-checkbox-row">
              <input type="checkbox" id="validate-checkbox" checked>
              <svg class="tools-menu-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 12l2 2 4-5"/>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <span class="tools-menu-label">Validate changes</span>
              <span class="tools-help" tabindex="0" aria-label="Validate changes help">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.2-3 4"/>
                  <path d="M12 17h.01"/>
                </svg>
                <span class="tools-help-tooltip" role="tooltip">Runs repository setup and post-change validation so the agent proves the change before opening a PR. Disabling it is faster but reduces quality.</span>
              </span>
              <span class="tools-checkmark" aria-hidden="true">✓</span>
            </label>
            <label class="tools-menu-item tools-checkbox-row">
              <input type="checkbox" id="review-before-push-checkbox" checked>
              <svg class="tools-menu-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6"/>
                <path d="m9 15 2 2 4-4"/>
              </svg>
              <span class="tools-menu-label">Review code before push</span>
              <span class="tools-help" tabindex="0" aria-label="Review code before push help">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.2-3 4"/>
                  <path d="M12 17h.01"/>
                </svg>
                <span class="tools-help-tooltip" role="tooltip">Requires the agent to launch a sub-agent to review the changed branch and fix issues before pushing or opening a PR. Disabling it is faster but reduces quality.</span>
              </span>
              <span class="tools-checkmark" aria-hidden="true">✓</span>
            </label>
            <label class="tools-menu-item tools-checkbox-row">
              <input type="checkbox" id="action-pr-checks-checkbox" checked>
              <svg class="tools-menu-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3-6.7"/>
                <path d="M21 3v6h-6"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
              <span class="tools-menu-label">Action PR checks for done</span>
              <span class="tools-help" tabindex="0" aria-label="Action PR checks for done help">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.2-3 4"/>
                  <path d="M12 17h.01"/>
                </svg>
                <span class="tools-help-tooltip" role="tooltip">Requires the agent to wait on PR checks and automated AI reviews, fix failures or non-LOW findings, push again, and only finish when clean. Disabling it is faster but reduces quality.</span>
              </span>
              <span class="tools-checkmark" aria-hidden="true">✓</span>
            </label>
          </div>
        </div>
        <div id="repo-flyout-root">
          <button id="repo-selector-btn" class="repo-chip" type="button"
                  aria-label="Choose repository" aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="repo-popover" title="Choose repository">
            <svg class="repo-chip-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h11a3 3 0 0 1 3 3v13"/>
              <path d="M4 4v15a2 2 0 0 0 2 2h12"/>
              <path d="M9 8h6"/>
            </svg>
            <span id="repo-selector-value" class="repo-chip-label">Default</span>
            <svg class="repo-chip-chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 10 5 5 5-5"/>
            </svg>
          </button>
          <div id="repo-popover" class="composer-popover" role="listbox" aria-label="Repositories" hidden>
            <div class="repo-search-wrap">
              <input id="repo-search" type="search" autocomplete="off"
                     placeholder="Search repositories…" aria-label="Search repositories">
            </div>
            <div id="repo-options"></div>
          </div>
        </div>
        <div id="agent-flyout-root">
          <button id="agent-selector-btn" class="agent-chip" type="button"
                  aria-label="Choose agent" aria-haspopup="menu" aria-expanded="false"
                  aria-controls="agent-popover" title="Choose agent">
            <svg class="agent-chip-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8V4"/>
              <rect x="6" y="8" width="12" height="10" rx="3"/>
              <path d="M9 13h.01"/>
              <path d="M15 13h.01"/>
            </svg>
            <span id="agent-selector-value" class="agent-chip-label">No agent</span>
            <svg class="agent-chip-chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 10 5 5 5-5"/>
            </svg>
          </button>
          <div id="agent-popover" class="composer-popover" hidden>
            <div id="agent-options"></div>
          </div>
        </div>
      </div>
      <div id="composer-actions">
        <div id="model-picker">
          <button id="model-btn" type="button" aria-label="Choose model" aria-expanded="false" title="Model: Opus">
            <span id="model-label">Opus</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 10 5 5 5-5"/>
            </svg>
          </button>
          <div id="model-popover" class="composer-popover" hidden>
            <div class="model-popover-title">Model</div>
            <div id="model-options"></div>
          </div>
        </div>
        <button id="btn" type="button" onclick="handleComposerAction()" aria-label="Send" title="Send">
          <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="m5 12 7-7 7 7"/>
          </svg>
          <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <rect x="7" y="7" width="10" height="10" rx="2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
</div>

<aside id="meta-sidebar" aria-label="Chat details">
  <div id="meta-content">
    <div class="meta-empty">No chat details yet.</div>
  </div>
</aside>

<script src="{{assetPath "chat_core.js"}}"></script>
<script src="{{assetPath "chat_composer.js"}}"></script>
<script src="{{assetPath "chat_blocks.js"}}"></script>
<script src="{{assetPath "chat_sidebar.js"}}"></script>
<script src="{{assetPath "chat_metadata.js"}}"></script>
<script src="{{assetPath "chat_image_modal.js"}}"></script>
<script src="{{assetPath "chat_stream.js"}}"></script>
<script src="{{assetPath "chat_members.js"}}"></script>
<script src="{{assetPath "chat_layout.js"}}"></script>
<script src="{{assetPath "chat_init.js"}}"></script>
</body>
</html>
