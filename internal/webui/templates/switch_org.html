<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch organization · Hetchy</title>
<link rel="icon" type="image/svg+xml" href="{{faviconHref}}">
<script>
(function(){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){
    var pref;
    try { pref = localStorage.getItem('theme') || 'system'; } catch(e) { pref = 'system'; }
    var dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.classList.toggle('is-dark', dark);
  }
  apply();
  mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if (e.key === 'theme') apply(); });
})();
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 1rem; box-sizing: border-box; }
  .card { background: #fff; padding: 2rem 2.5rem; border-radius: 1rem;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); width: 100%; max-width: 26rem;
          box-sizing: border-box; }
  @media (max-width: 480px) {
    .card { padding: 1.5rem 1.25rem; }
  }
  h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
  .sub { color: #777; margin: 0 0 1.25rem; font-size: .9rem; }
  .err { background: #fee; color: #a00; padding: .5rem .75rem;
         border-radius: .4rem; margin-bottom: 1rem; font-size: .85rem; }
  .orgs { display: flex; flex-direction: column; gap: .5rem; }
  .org { display: flex; align-items: center; justify-content: space-between;
         gap: .75rem; border: 1px solid #ddd; border-radius: .5rem;
         padding: .65rem .85rem; }
  .org .meta { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .org .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .org .role { color: #999; font-size: .75rem; text-transform: capitalize; }
  .org form { margin: 0; }
  .org button { padding: .4rem .9rem; background: #0b93f6; color: #fff;
                border: none; border-radius: .4rem; font-size: .85rem;
                cursor: pointer; white-space: nowrap; }
  .org.current { border-color: #0b93f6; background: #f0f8ff; }
  .org .current-tag { color: #0b93f6; font-size: .8rem; font-weight: 600;
                      white-space: nowrap; }
  .who { color: #999; font-size: .8rem; margin-top: 1.25rem; text-align: center; }
  .who a { color: #999; }

  html { color-scheme: light; }
  html.is-dark { color-scheme: dark; }
  html.is-dark body { background: #0f0f10; }
  html.is-dark .card { background: #1c1c1f; color: #e7e7e9;
                       box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  html.is-dark h1 { color: #f5f5f7; }
  html.is-dark .sub { color: #9a9aa0; }
  html.is-dark .err { background: #3a1818; color: #ff8888; }
  html.is-dark .org { border-color: #2e2e33; }
  html.is-dark .org.current { border-color: #2f6db0; background: #14222f; }
  html.is-dark .org .role { color: #6e6e72; }
  html.is-dark .who, html.is-dark .who a { color: #6e6e72; }
</style>
</head>
<body>
<div class="card">
  <h1>Switch organization</h1>
  <p class="sub">Choose the organization you want to work in. You'll stay signed in.</p>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <div class="orgs">
    {{range .Orgs}}
    <div class="org{{if .Current}} current{{end}}">
      <div class="meta">
        <span class="name">{{.Name}}</span>
        {{if .RoleSlug}}<span class="role">{{.RoleSlug}}</span>{{end}}
      </div>
      {{if .Current}}
      <span class="current-tag">Current</span>
      {{else}}
      <form method="POST" action="/switch-org">
        <button type="submit" name="org_id" value="{{.OrgID}}">Switch</button>
      </form>
      {{end}}
    </div>
    {{end}}
  </div>
  <p class="who">Signed in as {{.Email}} · <a href="/">Back to app</a></p>
</div>
</body>
</html>
