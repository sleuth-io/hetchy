# Live-reload config for `make bot`. Watches Go sources, embedded web UI
# templates/assets, and SQL queries; rebuilds and restarts the binary on
# save. Generated files (sqlc output, migrations) are excluded so a regen
# doesn't trigger a useless second rebuild.
root = "."
tmp_dir = ".air-tmp"

[build]
  cmd = "./scripts/build-hetchy-dev.sh ./.air-tmp/hetchy"
  bin = "./.air-tmp/hetchy"
  # `html`, `css`, `js`, and `sh` are embedded by the Go binary, so Air
  # must rebuild on those changes too. Sandbox files affect the stamped
  # Daytona snapshot version, so they also need to trigger rebuilds.
  include_ext = ["go", "html", "css", "js", "sql", "sh"]
  include_file = [
    "sandbox/Dockerfile",
    "sandbox/hetchy-playwright-smoke",
    "sandbox/hetchy-record-screen",
    "scripts/sandbox-version.sh",
  ]
  exclude_dir = [
    "dist",
    ".air-tmp",
    "db/migrations",
    "internal/db/sqlc",
    # Top-level scripts/ only (push-snapshot, create-slack-app) — the
    # embedded scripts at internal/bot/scripts/ MUST be watched.
    "./scripts",
    "docs",
  ]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
