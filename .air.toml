# Live-reload config for `make bot`. Watches Go sources, embedded HTML,
# and SQL queries; rebuilds and restarts the binary on save. Generated
# files (sqlc output, migrations) are excluded so a regen doesn't trigger
# a useless second rebuild.
root = "."
tmp_dir = ".air-tmp"

[build]
  cmd = "go build -o ./.air-tmp/hetchy ./cmd/hetchy"
  bin = "./.air-tmp/hetchy"
  # `sh` is here so the //go:embed at internal/bot/scripts/ picks up
  # edits to agent.sh / followup.sh on save — without it, the binary
  # keeps running with whatever scripts were embedded at last `.go`
  # rebuild, and you can chase a "fixed" bug for hours wondering why.
  include_ext = ["go", "html", "sql", "sh"]
  exclude_dir = [
    "dist",
    ".air-tmp",
    "db/migrations",
    "internal/db/sqlc",
    "sandbox",
    # Top-level scripts/ only (push-snapshot, create-slack-app) — the
    # embedded scripts at internal/bot/scripts/ MUST be watched.
    "./scripts",
    "docs",
  ]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
